.colbt{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid #E4E2DC;border-radius:9px;background:#fff;color:#545C69;cursor:pointer;flex:none}
.colbt:hover{border-color:#1D6FE8;color:#1D6FE8}
.colsv{position:fixed;inset:0;background:rgba(20,24,33,.18);z-index:590}
.colsp{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:100vw;background:#FBFAF8;z-index:600;display:flex;flex-direction:column;padding:22px 22px 18px;border-left:1px solid #E4E2DC;font-family:inherit;color:#1A1D23}

<script>
/* chave do estoque: número do Tiny (só dígitos) ou ERP-<SKU> inteiro (item cadastrado no ERP).
   Antes tirava as letras e ERP-MP001, ERP-CO001 e ERP-EM001 viravam todos "001": um saldo só para três itens. */
const chaveEst=v=>{v=String(v||'').trim();return /^ERP-/i.test(v)?v:v.replace(/\D/g,'');};
/* v372: busca sem acento — "agua" acha "água" em todo campo de busca */
(function(){try{const AC=/[\u00C0-\u024F]/;const str=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');const inc=String.prototype.includes;
Object.defineProperty(String.prototype,'includes',{configurable:true,writable:true,value:function(q,pos){if(typeof q==='string'&&(AC.test(this)||AC.test(q)))return inc.call(str(this),str(q),pos);return inc.call(this,q,pos);}});}catch(e){}})();
</script>
<script>
/* =====================================================================
   Estoque · ERP Atrius · módulo do ERP Atrius
   Arquivo próprio, que abre na moldura do ERP. Não carrega o motor do PCP:
   pede ao núcleo (window.parent.csNucleo) os insumos, os saldos do Tiny, o
   que as OPs vão consumir e a gravação. Assim uma mudança aqui não mexe no
   PCP que está rodando, e vice-versa.
   ===================================================================== */
const MOD_TESTE=false;
const MOD_ID='estoque';
const N=(()=>{try{if(window.parent!==window&&window.parent.csNucleo)return window.parent.csNucleo;}catch(e){}
  return window.csNucleo||null;})();
const $=id=>document.getElementById(id);
/* dentro do ERP a pílula TESTE já está no canto da casca: aqui ela sobraria em dobro */
try{if(window.parent!==window){const p=document.querySelector('.teste-pill');if(p)p.remove();}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=0)=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const nq=v=>{const n=Math.round((+v||0)*1000)/1000;return Number.isInteger(n)?nf(n):n.toLocaleString('pt-BR',{maximumFractionDigits:3});};
const rs=v=>'R$ '+nf(v,2);
/* número digitado à brasileira: "1.234,5" vira 1234.5 */
const num=s=>{if(typeof s==='number')return s;s=String(s||'').trim();if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0;};
const ymd=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const hojeY=()=>ymd(new Date());
const br=y=>y?y.split('-').reverse().join('/'):'—';
const addDias=(y,n)=>{const d=new Date(y+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const agora=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const usuario=()=>N?N.usuario():'Teste';
const pode=(k,nv)=>N?N.pode(k,nv):true;
function toast(m,erro){const t=document.createElement('div');t.className='toast'+(erro?' erro':'');t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),erro?5200:2800);}
/* unidade: o que se pesa é kg, o resto é unidade */
const unDe=x=>/mat[ée]ria|fragr|corante/i.test((x&&x.tipo)||'')?'kg':'un';

/* ---------- gravação ---------- */
let DB=null,tGrava=null,GRAVANDO=false,SUJO=false;
function salvar(){SUJO=true;clearTimeout(tGrava);tGrava=setTimeout(gravarAgora,500);marcaSalvo('salvando…');}
async function gravarAgora(){
  if(!N||GRAVANDO)return;GRAVANDO=true;SUJO=false;
  try{
    const r=await N.gravar(MOD_ID,DB);
    if(r&&r.conflito){toast('Outra pessoa gravou antes. Recarreguei o que está no banco.',true);DB=normaliza(await N.ler(MOD_ID));render();}
    else marcaSalvo(r&&r.local?'salvo neste navegador '+agora().slice(-5):'salvo no banco '+agora().slice(-5));
  }catch(e){marcaSalvo('NÃO SALVOU');toast('Não consegui gravar: '+e.message,true);}
  GRAVANDO=false;if(SUJO)salvar();
}
function marcaSalvo(t){document.querySelectorAll('.salvo').forEach(e=>e.textContent=t);}
window.addEventListener('beforeunload',e=>{if(SUJO){e.preventDefault();e.returnValue='';}});

/* ---------- página pelo endereço (#ordens, #necessidade…) ---------- */
let PAG='';
function lerHash(){const h=(location.hash||'').replace('#','').split('/');return {pag:h[0]||PAGINA_INICIAL,arg:h[1]||''};}
window.addEventListener('hashchange',()=>{const {pag}=lerHash();if(pag!==PAG){PAG=pag;try{N&&N.pagina(PAG);}catch(e){}}render();});
function ir(pag,arg){location.hash='#'+pag+(arg?'/'+arg:'');}

/* ---------- gaveta e popups ---------- */
function gaveta(html){const g=$('gav');if(html==null){g.classList.remove('on');$('veu').classList.remove('on');return;}
  g.innerHTML=html;g.classList.add('on');$('veu').classList.add('on');}
$('veu').onclick=()=>gaveta(null);

/* ---------- busca de insumo com lista embaixo do campo ---------- */
function buscaInsumo(input,escolhe,filtro){
  const caixa=input.parentNode;caixa.classList.add('rel');
  let lista=null;
  const fecha=()=>{if(lista){lista.remove();lista=null;}};
  input.addEventListener('input',()=>{
    fecha();const q=input.value.trim().toLowerCase();if(q.length<2)return;
    const achados=(N?N.insumos():[]).filter(x=>(!filtro||filtro(x))&&(x.sku+' '+x.nome+' '+x.tipo).toLowerCase().includes(q)).slice(0,12);
    if(!achados.length)return;
    lista=document.createElement('div');lista.className='lista-sug';
    lista.innerHTML=achados.map((x,i)=>`<button data-i="${i}"><b>${esc(x.nome)}</b><small>${esc(x.sku)} · ${esc(x.tipo)}${x.tiny?'':' · sem código do Tiny'}</small></button>`).join('');
    caixa.appendChild(lista);
    lista.querySelectorAll('button').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();escolhe(achados[+b.dataset.i]);input.value='';fecha();});
  });
  input.addEventListener('blur',()=>setTimeout(fecha,150));
}
</script>
<script>
/* =====================================================================
   PERÍODO · o mesmo filtro de datas em todo o sistema (desenho aprovado)
   estado: {m:'sem'|'dia'|'mes'|'int'|'prev', dia, mes:'aaaa-mm', de, ate, campo}
   abrirPeriodo(botão, estado, {prev:true|false, campos:[[valor,rótulo]]}, aplicar)
   ===================================================================== */
const PER_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PER_MC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const perHoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const perYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const perD=s=>{const [a,m,d]=String(s).split('-').map(Number);return new Date(a,(m||1)-1,d||1);};
const perBr=s=>s?String(s).split('-').reverse().join('/'):'';
const perLe=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;};
const perAdd=(s,n)=>{const d=perD(s);d.setDate(d.getDate()+n);return perYmd(d);};
function perNovo(m){const h=perHoje();return {m:m||'sem',dia:h,mes:h.slice(0,7),de:perAdd(h,-29),ate:h,campo:''};}
function perRotulo(p){if(!p||p.m==='sem')return 'Período';const h=perHoje();
  if(p.m==='dia')return p.dia===h?'Hoje':perBr(p.dia);
  if(p.m==='mes'){const [a,m]=p.mes.split('-');return PER_MES[+m-1]+' de '+a;}
  const ano=p.de.slice(0,4)!==p.ate.slice(0,4)||p.ate.slice(0,4)!==h.slice(0,4);
  const r=p.de===p.ate?perBr(p.de):perBr(p.de).slice(0,ano?10:5)+' a '+perBr(p.ate).slice(0,ano?10:5);
  return p.m==='prev'?'Previstos '+r:r;}
/* o intervalo efetivo, para quem filtra: {de, ate} (vazio = sem limite) */
function perFaixa(p){if(!p||p.m==='sem')return {de:'',ate:''};
  if(p.m==='dia')return {de:p.dia,ate:p.dia};
  if(p.m==='mes'){const [a,m]=p.mes.split('-').map(Number);return {de:p.mes+'-01',ate:perYmd(new Date(a,m,0))};}
  return {de:p.de<=p.ate?p.de:p.ate,ate:p.de<=p.ate?p.ate:p.de};}
function perBotao(id,p){return `<button class="perb2 ${p&&p.m!=='sem'?'ativo':''}" id="${id}" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg> ${perRotulo(p)}</button>`;}
function abrirPeriodo(botao,estado,opts,aplicar){
  opts=opts||{};
  const velho=document.getElementById('perPop');if(velho){const mesmo=velho._dono===botao;velho.remove();if(mesmo)return;}
  const t=JSON.parse(JSON.stringify(estado||perNovo()));if(!t.campo&&opts.campos)t.campo=opts.campos[0][0];
  let alvo='de',view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);
  const p=document.createElement('div');p.id='perPop';p.className='perpop';p._dono=botao;document.body.appendChild(p);
  const modos=[['sem','sem filtro'],['dia','do dia'],['mes','do mês'],['int','do intervalo'],...(opts.prev?[['prev','previstos para']]:[])];
  const cal=()=>{const y=view.getFullYear(),m=view.getMonth(),ini=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const faixa=t.m==='int'||t.m==='prev';
    const cls=s=>{if(!faixa)return s===t.dia?'on':'';const a=t.de<=t.ate?t.de:t.ate,b=t.de<=t.ate?t.ate:t.de;if(s===a&&s===b)return 'on';if(s===a)return 'on ini';if(s===b)return 'on fim';return s>a&&s<b?'fx':'';};
    return `<div class="pcal"><div class="pch"><button data-nv="-1" type="button">‹</button><b>${PER_MES[m]} ${y}</b><button data-nv="1" type="button">›</button></div><div class="pcg">${'DSTQQSS'.split('').map(x=>'<span>'+x+'</span>').join('')}${'<i></i>'.repeat(ini)}${Array.from({length:n},(_,i)=>{const s=perYmd(new Date(y,m,i+1));return `<button type="button" class="${cls(s)} ${s===perHoje()?'hj':''}" data-dd="${s}">${i+1}</button>`;}).join('')}</div></div>`;};
  const res=()=>{const f=perFaixa(t);if(t.m==='sem')return 'mostra tudo, sem limitar por data';
    const dias=Math.round((perD(f.ate)-perD(f.de))/864e5)+1;return `<b>${perRotulo(t)}</b>${dias>1?` · ${dias} dias`:''}`;};
  const des=()=>{
    let c='';
    if(t.m==='dia')c=`<div class="pdf"><button data-dia="-1" type="button">‹</button><input id="pdDia" value="${perBr(t.dia)}"><button data-dia="1" type="button">›</button></div>${cal()}`;
    else if(t.m==='mes'){const [a,mm]=t.mes.split('-').map(Number);c=`<div class="pdf sm"><button data-ano="-1" type="button">‹</button><input value="${a}" readonly><button data-ano="1" type="button">›</button></div><div class="pmes">${PER_MC.map((x,i)=>`<button type="button" data-ms="${i+1}" class="${i+1===mm?'on':''}">${x}</button>`).join('')}</div>`;}
    else if(t.m==='int'||t.m==='prev'){const h=perHoje();
      const at=t.m==='prev'?[['hoje',h,h],['amanhã',perAdd(h,1),perAdd(h,1)],['próximos 7 dias',h,perAdd(h,6)]]:[['últimos 7 dias',perAdd(h,-6),h],['últimos 30 dias',perAdd(h,-29),h],['este mês',h.slice(0,8)+'01',perFaixa({m:'mes',mes:h.slice(0,7)}).ate],['mês passado',perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth()-1,1)),perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth(),0))]];
      c=`${t.m==='prev'?'<div class="pdica">Entrega prevista entre as duas datas. Para um dia só, deixe as duas iguais.</div>':''}<div class="patal">${at.map(([r,a,b],i)=>`<button type="button" data-at="${i}">${r}</button>`).join('')}</div>
      <div class="pdois"><div><small>de</small><div class="pdf sm ${alvo==='de'?'at':''}" data-alvo="de"><input id="pdDe" value="${perBr(t.de)}"></div></div><div><small>até</small><div class="pdf sm ${alvo==='ate'?'at':''}" data-alvo="ate"><input id="pdAte" value="${perBr(t.ate)}"></div></div></div>
      <div class="pdica">${alvo==='de'?'clique no primeiro dia':'agora clique no último dia'}</div>${cal()}`;
      p._at=at;}
    else c='<div class="pdica" style="margin:6px 0 10px">Mostra tudo, sem limitar por data.</div>';
    p.innerHTML=`<div class="pmodos">${modos.map(([k,r])=>`<button type="button" data-md="${k}" class="${t.m===k?'on':''}">${r}</button>`).join('')}</div>
      <div class="pcorpo">${c}${opts.campos&&t.m!=='sem'?`<div class="pcampo"><small>Data a considerar</small><select id="pdCampo">${opts.campos.filter(x=>t.m==='prev'?true:!x[2]).map(([v,r])=>`<option value="${v}" ${t.campo===v?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
      <div class="pres">${res()}</div><div class="pbot"><button type="button" class="btn" id="pdLimpa">limpar</button><button type="button" class="btn pri" id="pdOk">aplicar</button></div></div>`;
    p.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{t.m=b.dataset.md;alvo='de';if(t.m==='prev'&&!(estado&&estado.m==='prev')){t.de=t.ate=perHoje();}
      view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{view.setMonth(view.getMonth()+(+b.dataset.nv));des();});
    p.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{const s=b.dataset.dd;if(t.m==='dia'){t.dia=s;}else if(alvo==='de'){t.de=s;if(t.ate<s)t.ate=s;alvo='ate';}else{if(s<t.de){t.ate=t.de;t.de=s;}else t.ate=s;alvo='de';}des();});
    p.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{t.dia=perAdd(t.dia,+b.dataset.dia);view=perD(t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-ano]').forEach(b=>b.onclick=()=>{const [a,mm]=t.mes.split('-');t.mes=(+a+(+b.dataset.ano))+'-'+mm;des();});
    p.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{t.mes=t.mes.slice(0,4)+'-'+String(b.dataset.ms).padStart(2,'0');des();});
    p.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{const x=p._at[+b.dataset.at];t.de=x[1];t.ate=x[2];alvo='de';view=perD(t.de);view.setDate(1);des();});
    p.querySelectorAll('[data-alvo]').forEach(b=>b.onclick=()=>{if(alvo!==b.dataset.alvo){alvo=b.dataset.alvo;des();const i=p.querySelector(alvo==='de'?'#pdDe':'#pdAte');if(i)i.focus();}});
    const inp=(id,f)=>{const i=p.querySelector(id);if(i)i.onchange=()=>{const v=perLe(i.value);if(v){f(v);view=perD(v);view.setDate(1);}des();};};
    inp('#pdDia',v=>t.dia=v);inp('#pdDe',v=>t.de=v);inp('#pdAte',v=>t.ate=v);
    const cs=p.querySelector('#pdCampo');if(cs)cs.onchange=()=>{t.campo=cs.value;};
    p.querySelector('#pdLimpa').onclick=()=>{p.remove();aplicar(Object.assign(perNovo('sem'),{campo:t.campo}));};
    p.querySelector('#pdOk').onclick=()=>{p.remove();if(t.m!=='prev'&&opts.campos&&opts.campos.some(x=>x[0]===t.campo&&x[2]))t.campo=opts.campos[0][0];aplicar(t);};
    posiciona();
  };
  const posiciona=()=>{const r=botao.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
    let l=r.left;if(l+w>innerWidth-8)l=Math.max(8,innerWidth-w-8);let tp=r.bottom+6;if(tp+h>innerHeight-8)tp=Math.max(8,innerHeight-h-8);
    p.style.left=l+'px';p.style.top=tp+'px';};
  p.onclick=ev=>ev.stopPropagation();
  p.onkeydown=ev=>{if(ev.key==='Escape')p.remove();if(ev.key==='Enter'&&ev.target.tagName!=='SELECT'){ev.preventDefault();p.querySelector('#pdOk').click();}};
  des();
}
document.addEventListener('click',ev=>{const p=document.getElementById('perPop');if(p&&!p.contains(ev.target)&&ev.target!==p._dono&&!(p._dono&&p._dono.contains(ev.target)))p.remove();});

/* =====================================================================
   COLUNAS VISÍVEIS · o botão do Tiny que escolhe o que aparece na lista
   Cada lista tem uma chave (vendas, compras, ordens...). A escolha fica
   guardada no aparelho, por lista. Funciona olhando o cabeçalho da tabela:
   não precisa mexer em quem desenha a lista — some a coluna com o título
   que a pessoa desligou. Coluna sem título (marcar, três pontinhos) fica.
   ===================================================================== */
const COLS_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="9" r="2" fill="#fff"/><circle cx="12" cy="15" r="2" fill="#fff"/><circle cx="18" cy="8" r="2" fill="#fff"/></svg>';
const colsNorm=s=>String(s||'').replace(/[↑↓▲▼⇅]/g,'').replace(/\s+/g,' ').trim();

/* painel: lista de rótulos com chave liga/desliga; fixas não desligam */

  const velho=document.getElementById('colsP');if(velho){velho.remove();document.getElementById('colsV')&&document.getElementById('colsV').remove();}

  document.body.appendChild(v);document.body.appendChild(p);

  const liga=()=>p.querySelectorAll('[data-cr]').forEach(s=>s.onclick=()=>{const r=s.dataset.cr;if(fixas.includes(r))return;oc.has(r)?oc.delete(r):oc.add(r);s.classList.toggle('on',!oc.has(r));});
  liga();v.onclick=fecha;p.querySelector('#colsX').onclick=fecha;p.querySelector('#colsC').onclick=fecha;
  p.querySelector('#colsPad').onclick=()=>{oc.clear();(pad||[]).forEach(r=>oc.add(r));p.querySelector('#colsL').innerHTML=lin();liga();};
  p.querySelector('#colsOk').onclick=()=>{colsGravar(k,[...oc]);fecha();if(aoAplicar)aoAplicar();};

/* tabela <table>: some a coluna pelo título do cabeçalho */
function colsTabela(tab,k,pad){
  if(!tab)return [];
  const oc=new Set(colsOcultas(k,pad)),ths=[...tab.querySelectorAll('thead tr:first-child > th')];
  const rot=ths.map(t=>colsNorm(t.textContent));const esc=[];
  rot.forEach((r,i)=>{if(r&&oc.has(r))esc.push(i);});
  ths.forEach((t,i)=>t.style.display=esc.includes(i)?'none':'');
  tab.querySelectorAll('tbody > tr').forEach(tr=>{const tds=[...tr.children];if(tds.length!==ths.length)return;
    tds.forEach((td,i)=>td.style.display=esc.includes(i)?'none':'');});
  return rot.filter(Boolean);
}
/* lista em grade (div.h + div.r): some a coluna e refaz as trilhas */
function colsGrade(caixa,k,trilhas,pad){
  if(!caixa)return [];
  const h=caixa.querySelector('.h');if(!h)return [];
  const oc=new Set(colsOcultas(k,pad)),cel=[...h.children],rot=cel.map(c=>colsNorm(c.textContent));
  const esc=[];rot.forEach((r,i)=>{if(r&&oc.has(r))esc.push(i);});
  const tpl=trilhas.filter((t,i)=>!esc.includes(i)).join(' ');
  [h,...caixa.querySelectorAll('.r')].forEach(r=>{if(r.children.length!==cel.length)return;
    r.style.gridTemplateColumns=tpl;[...r.children].forEach((c,i)=>c.style.display=esc.includes(i)?'none':'');});
  return rot.filter(Boolean);
}

/* =====================================================================
   INVENTÁRIO
   Ao abrir, o saldo do Tiny de cada item fica congelado: é contra ele que a
   contagem é comparada. O ajuste vai para o Tiny como diferença (entrada ou
   saída), e não como balanço: o balanço troca o saldo pelo número contado e
   apagaria em silêncio qualquer baixa de OP feita depois da contagem.
   ===================================================================== */
const INVL={sit:'todos'};

/* diferença que vai ao Tiny, item a item */
function difItem(inv,x){
  const c=inv.cont[x.sku];if(c==null)return null;
  const cong=x.saldo==null?0:x.saldo;
  const at=inv.atual[x.sku];
  /* se o Tiny mexeu depois da abertura, a pessoa diz se a contagem já pegou esse movimento */
  const base=(at!=null&&Math.abs(at-cong)>1e-9&&inv.base[x.sku]==='atual')?at:cong;
  return Math.round((c-base)*1000)/1000;
}

function ligaInv(inv){
  const re=()=>telaInv(inv.id);
  $('volta').onclick=()=>ir('inventario');
  $('bFolha').onclick=()=>folha(inv);
  $('iq').oninput=e=>{INVV.q=e.target.value;clearTimeout(window._ti);window._ti=setTimeout(()=>{re();const i=$('iq');i.focus();i.setSelectionRange(i.value.length,i.value.length);},250);};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{INVV.f=b.dataset.f;re();});
  document.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v==='')delete inv.cont[i.dataset.c];else inv.cont[i.dataset.c]=num(v);salvar();re();});
  document.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>{inv.mot[s.dataset.m]=s.value;salvar();re();});
  document.querySelectorAll('[data-base]').forEach(s=>s.onchange=()=>{inv.base[s.dataset.base]=s.value;salvar();re();});
  if($('bTab'))$('bTab').onclick=()=>tablet(inv);
  if($('bCanc'))$('bCanc').onclick=()=>{if(!confirm(N.semTinyEstoque?'Cancelar este inventário? Nenhum ajuste entra no estoque.':'Cancelar este inventário? Nada vai para o Tiny.'))return;inv.sit='cancelado';salvar();re();};
  if($('bConf'))$('bConf').onclick=async()=>{
    if(N.teste){inv.conferidoEm=agora()+' (teste)';inv.sit='conferencia';salvar();re();return toast('Versão de teste: sem leitura do Tiny, nada mexeu.');}
    $('bConf').disabled=true;$('bConf').textContent=N.semTinyEstoque?'Conferindo…':'Lendo o Tiny…';
    try{const s=await N.lerSaldos(inv.itens.map(x=>x.tiny).filter(Boolean));
      inv.itens.forEach(x=>{if(x.tiny&&s[x.tiny]!==undefined)inv.atual[x.sku]=+s[x.tiny];});
      inv.conferidoEm=agora();inv.sit='conferencia';salvar();}catch(e){toast('Tiny: '+e.message,true);}re();};
  if($('bEnv'))$('bEnv').onclick=()=>enviarInv(inv);
}
async function enviarInv(inv){
  if(!pode('estoque.inv.enviar','ver'))return toast('Você não tem permissão para enviar ajuste de inventário ao Tiny.',true);
  const ajustes=inv.itens.map(x=>({x,d:difItem(inv,x)})).filter(a=>a.d&&a.x.tiny);
  const semCod=inv.itens.filter(x=>{const d=difItem(inv,x);return d&&!x.tiny;}).length;
  if(!inv.conferidoEm&&!confirm('Você ainda não conferiu os saldos. Se alguma OP baixou material durante a contagem, o ajuste pode sair errado. Enviar mesmo assim?'))return;
  if(!confirm(`${N.semTinyEstoque?'Lançar':'Enviar'} ${ajustes.length} ajuste(s)${N.semTinyEstoque?' no estoque':' ao Tiny'}?${semCod?` ${semCod} item(ns) sem código ficam de fora.`:''}`))return;
  /* uma chamada por motivo, para o histórico do Tiny dizer por que cada saldo mudou */
  const grupos={};ajustes.forEach(a=>{const m=inv.mot[a.x.sku]||'inventário';(grupos[m]=grupos[m]||[]).push(a);});
  let ok=0;const falhas=[];
  for(const [m,lista] of Object.entries(grupos)){
    const movs=lista.map(a=>({id:a.x.tiny,tipo:a.d>0?'E':'S',qtd:Math.abs(a.d)}));
    if(N.teste){ok+=movs.length;continue;}
    try{const r=await N.tiny({acao:'movimentar',movimentos:movs,obs:`ERP Atrius · Inventário ${inv.num} · ${m}`});
      ok+=(r&&r.feitos)||(r&&r.soErp?movs.length-((r.falhas||[]).length):0);((r&&r.falhas)||[]).forEach(f=>falhas.push(f));}
    catch(e){lista.forEach(a=>falhas.push({id:a.x.tiny,erro:e.message}));}
  }
  inv.envio={em:agora()+(N.teste?' (teste, sem envio)':''),por:usuario(),ok,falhas};
  if(!falhas.length)inv.sit='enviado';
  salvar();toast(falhas.length?`${falhas.length} ajuste(s) recusado(s).`:`Ajustes ${N.semTinyEstoque?'lançados':'enviados'}${N.teste?' (simulado)':''}.`,!!falhas.length);telaInv(inv.id);
}

      </div>
      <div style="display:flex;gap:10px;max-width:520px;width:100%;margin:12px auto 0">
        <button class="btn" id="tP" style="flex:1;height:54px;justify-content:center" ${i?'':'disabled'}>‹ Anterior</button>
        <button class="btn" id="tPula" style="flex:1;height:54px;justify-content:center">Pular</button>
        <button class="btn pri" id="tOk" style="flex:2;height:54px;justify-content:center;font-size:16px">Confirmar e próximo</button></div>`;
    tela.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const t=b.dataset.k;
      if(t==='⌫')val=val.slice(0,-1);else if(t===','){if(!val.includes(','))val=(val||'0')+',';}else val+=t;desenha();});
    $('tS').onclick=()=>{tela.remove();telaInv(inv.id);};
    $('tP').onclick=()=>{i=Math.max(0,i-1);val=inv.cont[fila[i].sku]!=null?nq(inv.cont[fila[i].sku]):'';desenha();};
    $('tPula').onclick=()=>{i++;val='';desenha();};
    $('tOk').onclick=()=>{if(val===''){toast('Digite a quantidade contada, ou Pular.',true);return;}
      inv.cont[x.sku]=num(val);salvar();i++;val=fila[i]&&inv.cont[fila[i].sku]!=null?nq(inv.cont[fila[i].sku]):'';desenha();};
  };
  desenha();
}

/* =====================================================================
   ITEM DO ESTOQUE · no jeito do Tiny (v325)
   Abas Estoque e Reservas. O saldo é por depósito, e "Todos" soma. Cada
   lançamento tem o tipo clicável (OP, C, NF, TR, INV, M) e o ⋯ com editar e
   remover. As notas de saída vêm do Tiny só para mostrar: quem conta o saldo
   do acabado é o Tiny, e do insumo é o ERP.
   ===================================================================== */
const TIPO_NOME={E:'Entrada',S:'Saída',BAL:'Balanço'};
const COD_NOME={OP:'abre a ordem de produção',C:'abre a ordem de compra',NF:'abre a nota fiscal no Tiny',TR:'mostra as duas pontas da transferência',
  INV:'abre o inventário',M:'lançamento manual',BAL:'balanço: o saldo do depósito passa a ser este',EST:'estorno da OP',PV:'pedido de venda'};
const SIT_RES=['Em aberto','Aprovado','Preparando envio','Pronto para envio'];   /* os nomes do Tiny que ainda não faturaram */
const SIT_NOME={'Em aberto':'Em aberto','Aprovado':'Aprovado','Preparando envio':'Em separação','Pronto para envio':'Separado'};
const IT={id:'',aba:'est',deps:null,per:perNovo('sem'),tipos:new Set(['E','S','BAL']),nf:{},res:{},marcaTr:null};
const itemDe=id=>{id=String(id||'');const sem=chaveEst;
  const p=N.produtos().find(p=>sem(p.tiny)===id);
  if(p)return {id,nome:p.descricao,cod:p.codigo,un:/\bFD\b|FARDO/i.test(p.descricao||'')?'fd':'cx',acabado:true,p};
  const x=N.insumos().find(x=>sem(x.tiny)===id);
  if(x)return {id,nome:x.nome,cod:x.sku,un:unDe(x),acabado:false,x};
  return null;};
const depsN=()=>{const l=N.depositos?N.depositos():[{id:'fab',nome:'Fábrica',princ:true}];const g=window.__DEPGRP;if(g)l.forEach(d=>{if(d.princ)d.nome=g;});return l;};
const depNome=id=>(depsN().find(d=>d.id===id)||{}).nome||'Fábrica';
const quandoEm=s=>{const [d,h]=String(s||'').split(' ');return d?d.split('-').reverse().join('/')+(h?' · '+h:''):'—';};
const agoraLocal=()=>{const d=new Date();return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};

/* notas de saída e reservas: lidas uma vez por item e período */
async function lerNF(it){
  const fx=perFaixa(IT.per),de=fx.de||addDias(hojeY(),-120),ate=fx.ate||hojeY(),k=it.id+'|'+de+'|'+ate;
  if(IT.nf[k])return IT.nf[k];
  if(N.teste||!N.tiny)return IT.nf[k]={itens:[],aviso:'Versão de teste: as notas do Tiny não são lidas.'};
  IT.nf[k]={lendo:true,itens:[]};
  try{const r=await N.tiny({acao:'nf_item',sku:it.cod,idProduto:it.id,de,ate});
    IT.nf[k]={itens:(r.notas||[]).map(n=>({em:String(n.data||'').slice(0,10)+' 00:00',tipo:'S',qtd:+n.qtd||0,dep:(depsN().find(d=>d.princ)||{}).id,cod:'NF',ref:n.numero,nfId:n.id,
      obs:`NF ${n.numero}${n.serie?'-'+n.serie:''} · ${n.cliente||''}${n.cidade?' · '+n.cidade:''}`,quem:'Tiny',nf:true,bloqueio:'Nota fiscal do Tiny: muda lá.'})),estado:r.estado||{}};}
  catch(e){
    /* sem a tabela das notas ainda: mostra as saídas pela base de pedidos */
    try{const r=await N.tiny({acao:'vendas_saidas',sku:it.cod,dias:120});
      IT.nf[k]={itens:(r.itens||[]).filter(x=>(!fx.de||String(x.data||'')>=de)&&(!fx.ate||String(x.data||'').slice(0,10)<=ate)).map(x=>({em:String(x.data||'').slice(0,10)+' 00:00',tipo:'S',qtd:+x.qtd||0,dep:(depsN().find(d=>d.princ)||{}).id,cod:'PV',ref:x.numero,
        obs:`Pedido ${x.numero} · ${x.cliente||''}${x.cidade?' · '+x.cidade:''} · ${x.situacao||''}`,quem:'Tiny',nf:true,bloqueio:'Venda do Tiny: muda lá.'})),
        aviso:'As notas de saída ainda não foram lidas do Tiny ('+e.message+'). Mostrando as saídas pelos pedidos faturados.'};}
    catch(e2){IT.nf[k]={itens:[],aviso:'Não consegui ler as saídas do Tiny: '+e2.message};}}
  return IT.nf[k];
}
async function lerRes(it){
  /* a chave tem que ser a mesma da tela, senão a tela pede de novo para sempre */
  const fx=perFaixa(IT.per),cfg=N.cfgVendas?N.cfgVendas():{reservaPor:'prev'},campo=it.acabado?(cfg.reservaPor==='ped'?'pedido':'prevista'):'',k=it.id+'|'+campo+'|'+fx.de+'|'+fx.ate;
  if(IT.res[k])return IT.res[k];
  if(!it.acabado){const r=(N.reservado()[it.cod]||N.reservado()[it.nome]||{qtd:0,det:[]});
    return IT.res[k]={itens:(r.det||[]).map(d=>({num:d.o,quem:'',data:'',q:d.q})),tot:r.qtd||0,campo:''};}
  if(N.teste||!N.tiny)return IT.res[k]={itens:[],tot:0,campo};
  IT.res[k]={lendo:true,itens:[],tot:0,campo};
  try{const r=await N.tiny({acao:'nec_pedidos',situacoes:SIT_RES,campo,de:fx.de,ate:fx.ate});
    const ped={};(r.pedidos||[]).forEach(p=>ped[p.id]=p);
    const l=(r.itens||[]).filter(x=>String(x.sku)===String(it.cod)&&ped[x.pedido_id]).map(x=>{const p=ped[x.pedido_id];
      return {num:p.numero||p.id,quem:p.cliente||'',sit:SIT_NOME[p.situacao]||p.situacao,data:campo==='pedido'?p.data_pedido:p.data_prevista,q:+x.qtd||0};});
    l.sort((a,b)=>String(a.data||'9').localeCompare(String(b.data||'9')));
    IT.res[k]={itens:l,tot:l.reduce((a,x)=>a+x.q,0),campo};}
  catch(e){IT.res[k]={itens:[],tot:0,campo,erro:e.message};}
  return IT.res[k];
}

    ${podeL&&deps.length>1?'<button class="btn" id="bTr">⇄ Transferir entre depósitos</button>':''}${podeL?'<button class="btn pri" id="bInc">＋ Incluir lançamento</button>':''}</div>

  ${IT.aba==='est'?`${NFI&&NFI.aviso?`<div class="aviso">⚠ <div>${esc(NFI.aviso)}</div></div>`:''}${NFI&&NFI.lendo?'<div class="k" style="margin-bottom:8px">Lendo as notas de saída…</div>':''}
  <div class="caixa rolx"><table class="tv" id="tabI" style="min-width:820px"><thead><tr><th style="width:40px"></th><th>Data e hora</th><th>Depósito</th><th class="n">Entrada</th><th class="n">Saída</th><th>Observação</th><th>Tipo</th></tr></thead><tbody>

  <div class="leg">${it.acabado?`Pedidos ainda não faturados (em aberto, aprovado, em separação e separado), pela <b>${cfg.reservaPor==='ped'?'data do pedido':'data prevista'}</b>. Com período, só os pedidos com essa data dentro dele. Muda em Configurações › Vendas.`:'Insumo: reservado pelas OPs programadas e pelos tanques que ainda não consumiram.'}</div>`}`;
  ligaItem(it,l);

function ligaItem(it,l){
  $('iVolta').onclick=()=>ir('saldos');
  document.querySelectorAll('[data-ia]').forEach(b=>b.onclick=()=>{IT.aba=b.dataset.ia;telaItem(it.id);});
  const pop=(bt,pn)=>{if(!$(bt))return;$(bt).onclick=ev=>{ev.stopPropagation();['pDep','pTip'].forEach(p=>{if(p!==pn&&$(p))$(p).hidden=true;});$(pn).hidden=!$(pn).hidden;};$(pn).onclick=ev=>ev.stopPropagation();};
  pop('fDep','pDep');pop('fTip','pTip');
  const all=document.querySelector('[data-dall]');if(all)all.onchange=()=>{IT.deps=all.checked?null:new Set();telaItem(it.id);$('pDep').hidden=false;};
  document.querySelectorAll('[data-dp]').forEach(c=>c.onchange=()=>{if(!IT.deps)IT.deps=new Set(depsN().map(d=>d.id));c.checked?IT.deps.add(c.dataset.dp):IT.deps.delete(c.dataset.dp);if(IT.deps.size===depsN().length)IT.deps=null;telaItem(it.id);$('pDep').hidden=false;});
  document.querySelectorAll('[data-tp]').forEach(c=>c.onchange=()=>{c.checked?IT.tipos.add(c.dataset.tp):IT.tipos.delete(c.dataset.tp);telaItem(it.id);$('pTip').hidden=false;});
  $('fPer').onclick=ev=>{ev.stopPropagation();abrirPeriodo(ev.currentTarget,IT.per,{prev:false},st=>{IT.per=st;telaItem(it.id);});};
  $('fLimpa').onclick=()=>{IT.deps=null;IT.per=perNovo('sem');IT.tipos=new Set(['E','S','BAL']);IT.marcaTr=null;telaItem(it.id);};
  if($('bInc'))$('bInc').onclick=()=>formLanc(it,null);
  if($('bTr'))$('bTr').onclick=()=>formTransf(it);
  document.querySelectorAll('#tabI [data-mn]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();menuLanc(b,it,l[+b.dataset.mn]);});
  document.querySelectorAll('#tabI [data-or]').forEach(t=>t.onclick=ev=>{ev.stopPropagation();abrirOrigem(it,l[+t.dataset.or]);});
  /* a linha toda abre: editar, se pode; senão, a origem */
  document.querySelectorAll('#tabI tr[data-i]').forEach(r=>r.onclick=()=>{const x=l[+r.dataset.i];if(x.podeEditar&&pode('estoque.lanc','editar'))formLanc(it,x);else abrirOrigem(it,x);});
}
document.addEventListener('click',()=>{['pDep','pTip'].forEach(p=>{const e=$(p);if(e)e.hidden=true;});document.querySelectorAll('.emenu').forEach(m=>m.remove());});
function abrirOrigem(it,x){
  if(!x)return;
  if(x.cod==='TR'){IT.marcaTr=IT.marcaTr===x.tr?null:x.tr;telaItem(it.id);return toast(`Transferência ${x.tr}: as duas pontas estão marcadas.`);}

<script>
/* ===== v4.8.0 · o caminho da página (Módulo › Página › Item) vira link em todo o sistema =====
   Pedido de 24/10: o caminho no topo das páginas tem que levar de volta. Cada pedaço, menos o último, vira um link:
   o nome do módulo leva à primeira página dele; o nome de uma página leva a ela (procurada no menu do ERP).
   Links que a própria página já tinha (ex.: "Clientes e crédito" dentro da ficha do cliente) ficam como estão. */
(function(){
  if(window.__mg480)return;window.__mg480=true;
  /* CS_MOD, MOD_ATUAL e FIN_PAG são let/const no ERP: não ficam em window, por isso a leitura passa por eval */
  const P=(()=>{try{if(window.parent!==window&&typeof window.parent.csIr==='function')return window.parent;}catch(e){}return typeof window.csIr==='function'?window:null;})();
  const V=n=>{try{return P.eval(n);}catch(e){return undefined;}};
  const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  try{const st=document.createElement('style');st.textContent='.mg-a{color:inherit;cursor:pointer;text-decoration:none;border-radius:4px}.mg-a:hover{color:#1D4ED8;text-decoration:underline}';document.head.appendChild(st);}catch(e){}
  function destino(txt){
    if(!P)return null;const t=nrm(txt);if(!t)return null;
    const mods=V('CS_MOD')||[];let atualMod=null;const MA=V('MOD_ATUAL'),FP=V('FIN_PAG');
    try{atualMod=mods.find(m=>(m.pgs||[]).some(p=>p.mod&&p.mod===MA&&p.fin===FP));}catch(e){}
    const ordem=atualMod?[atualMod,...mods.filter(m=>m!==atualMod)]:mods;
    const pode=p=>{try{return typeof P.csPode!=='function'||P.csPode(p);}catch(e){return true;}};
    for(const m of ordem){const pgs=(m.pgs||[]);
      const g=pgs.find(p=>p.grupo&&p.acord&&nrm(p.n)===t);if(g){const f=pgs.find(p=>p.pai===g.acord&&!p.grupo&&pode(p));if(f)return f;}
      const p=pgs.find(p=>!p.grupo&&nrm(p.n)===t&&pode(p));if(p)return p;}
    const m=mods.find(m=>nrm(m.nome)===t);
    if(m){const f=(m.pgs||[]).find(p=>!p.grupo&&!p.breve&&pode(p)&&(p.page||p.fin||p.acao));if(f)return f;}
    return null;
  }
  function liga(el){
    if(el.dataset.mgk===el.innerHTML.length+'')return;
    const partes=el.innerHTML.split('›');
    if(partes.length<2){el.dataset.mgk=el.innerHTML.length+'';return;}
    const nova=partes.map((h,i)=>{if(i===partes.length-1||/<a[\s>]/i.test(h)||/mg-a/.test(h))return h;
      const tx=h.replace(/<[^>]+>/g,'').trim();if(!destino(tx))return h;
      return h.replace(tx,`<a class="mg-a" data-mglk="${tx.replace(/"/g,'&quot;')}">${tx}</a>`);}).join('›');
    if(nova!==el.innerHTML)el.innerHTML=nova;
    el.dataset.mgk=el.innerHTML.length+'';
  }
  const varre=()=>{try{document.querySelectorAll('.migalha,.c7-mig,.c9mig,.migal,.cfgmig').forEach(liga);}catch(e){}};
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-mglk]');if(!a)return;e.preventDefault();e.stopPropagation();
    const d=destino(a.dataset.mglk);if(d&&P){try{P.eval("CS_ABERTO=''");}catch(x){}try{P.csIr(d);}catch(x){}}},true);
  let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(varre,60);}).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(varre,300);
})();

</script>

    <div class="k" style="margin-bottom:12px">${esc(inv.nome)} · aberto em ${esc(inv.abertoEm)} por ${esc(inv.por||'')} · ${esc(SITI[inv.sit]||inv.sit)}</div>
    ${inv.sit==='enviado'?'<div class="aviso">⚠ <div>Os ajustes deste inventário já foram lançados. Excluir aqui <b>não desfaz</b> os ajustes no estoque: só tira o inventário da lista.</div></div>':''}
    <div class="cmp" style="margin-top:12px"><label>Por que está excluindo? <b>*</b></label><input id="xM" style="width:100%" placeholder="ex.: teste, aberto por engano"></div>
    <div class="cmp" style="margin-top:12px"><label>PIN do gestor ou a senha da sua conta <b>*</b></label><input id="xP" type="password" autocomplete="off" style="width:220px"></div></div>
    <div class="gr"><button class="btn" id="gN">Cancelar</button><button class="btn pri" id="gOk" style="background:#B91C1C;border-color:#B91C1C">Excluir</button></div>`);
  $('gX').onclick=$('gN').onclick=()=>gaveta(null);
  $('gOk').onclick=async()=>{const m=$('xM').value.trim();if(!m)return toast('Diga o motivo.',true);
    const g=N.gestor?await N.gestor($('xP').value):null;if(!g)return toast('PIN ou senha de gestor não confere.',true);
    DB.lixo=Array.isArray(DB.lixo)?DB.lixo:[];
    DB.lixo.push({tipo:'Inventário',ref:inv.num,nome:inv.nome,em:agora(),quem:usuario(),gestor:g.nome,motivo:m,dados:inv});
    DB.invs=DB.invs.filter(i=>i.id!==inv.id);salvar();gaveta(null);toast(inv.num+' excluído.');telaInvs();};
}
try{const _ti489=telaInvs;telaInvs=function(){_ti489.apply(this,arguments);
  try{const top=document.querySelector('.topo');if(top&&!$('eVolta'))top.insertAdjacentHTML('afterbegin','<button class="btn" id="eVolta">‹ Estoque</button>');if($('eVolta'))$('eVolta').onclick=()=>ir('saldos');
    const th=document.querySelector('.caixa table thead tr');if(th)th.insertAdjacentHTML('beforeend','<th></th>');
    document.querySelectorAll('[data-inv]').forEach(r=>{r.insertAdjacentHTML('beforeend',`<td class="n"><button class="btn sm del" data-xinv="${esc(r.dataset.inv)}" title="Excluir (senha de gestor)">Excluir</button></td>`);});
    document.querySelectorAll('[data-xinv]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const inv=DB.invs.find(i=>i.id===b.dataset.xinv);if(inv)estExcluirInv(inv);});
  }catch(e){}};}catch(e){}
/* ---------- Excluídos: inventários e lançamentos removidos, com quem, quando e por quê ---------- */
function telaExcluidos(){
  const porId={};try{estItens().forEach(i=>{if(i.id)porId[i.id]=i;});}catch(e){}
  const inv=(DB.lixo||[]).map(x=>({em:x.em,tipo:x.tipo,ref:x.ref,item:x.nome,quem:x.quem+(x.gestor?' · autorizado por '+x.gestor:''),mot:x.motivo}));
  const lanc=(N.razaoTudo?N.razaoTudo():[]).filter(x=>x.rm).map(x=>{const i=porId[String(x.id)];return {em:x.rm.em||'',tipo:'Lançamento',ref:`${x.tipo==='E'?'▲ entrada':x.tipo==='S'?'▼ saída':x.tipo} de ${nq(x.qtd)} · ${x.obs||x.origem||''}`,item:i?i.nome:x.id,quem:x.rm.quem||'',mot:x.rm.mot||''};});
  const l=[...inv,...lanc].sort((a,b)=>String(b.em).localeCompare(String(a.em)));
  $('app').innerHTML=`<div class="e9top"><button class="btn" id="eVolta">‹ Estoque</button><h1>Excluídos</h1></div>
    <div class="e9tb"><table class="e9t"><thead><tr><th>Quando</th><th>O quê</th><th>Item / inventário</th><th>Detalhe</th><th>Quem</th><th>Motivo</th></tr></thead><tbody>
    ${l.map(x=>`<tr><td class="k" style="white-space:nowrap">${esc(x.em)}</td><td><span class="e9mv S">${esc(x.tipo)}</span></td><td><b>${esc(x.item)}</b></td><td class="k">${esc(x.ref)}</td><td>${esc(x.quem)}</td><td>${esc(x.mot)}</td></tr>`).join('')||'<tr><td colspan="6" class="vazio">Nada foi excluído.</td></tr>'}</tbody></table></div>
    <div class="leg">Tudo o que sai do estoque por exclusão fica aqui: inventário excluído (com a senha do gestor) e lançamento removido do item.</div>`;
  $('eVolta').onclick=()=>ir('saldos');
}
try{const _rd489=render;render=function(){const {pag}=lerHash();if(pag==='excluidos'&&N&&DB){PAG=pag;return telaExcluidos();}return _rd489.apply(this,arguments);};}catch(e){}

/* v4.9.1 · depósitos com o nome certo: o da empresa é o do grupo do item (DEPÓSITO DE …), QUARENTENA, e o do
   fornecedor (NA PLASFAR…), que nasce sozinho na ordem de compra com industrialização. Sem "fornecedor ligado" à mão. */
const depG491=(dep,id)=>{try{return N.depNomeItem?N.depNomeItem(dep,id):'';}catch(e){return '';}};
estOnde=function(i){
  if(!i.id||!N.saldoDeps)return '';const sd=N.saldoDeps(i.id)||{por:{}},deps=depsN();
  return deps.map(d=>{const v=sd.por[d.id];if(v==null||Math.abs(+v)<1e-9)return '';
    const nm=depG491(d.id,i.id)||d.nome,cl=d.id==='quar'?'q':d.forn||/^NA /i.test(d.nome)?'f':'';
    return `<span class="e9d ${cl} ${+v<0?'neg':''}">${esc(nm)}</span>`;}).join('')||'<span class="k">—</span>';
};
try{const _ti491=telaItem;telaItem=function(id){try{const pr=(N.depositos().find(d=>d.princ)||{}).id;window.__DEPGRP=depG491(pr,id)||null;}catch(e){window.__DEPGRP=null;}return _ti491.apply(this,arguments);};}catch(e){}
try{const _ts491=telaSaldos;telaSaldos=function(){window.__DEPGRP=null;return _ts491.apply(this,arguments);};}catch(e){}
try{const _tv491=telaInvs;telaInvs=function(){window.__DEPGRP=null;return _tv491.apply(this,arguments);};}catch(e){}
/* a lista dos depósitos */
telaDepositos=function(){
  window.__DEPGRP=null;
  const deps=N.depositos(),pe=pode('estoque.cfg','editar'),px=pode('estoque.cfg','excluir');
  const its=estItens(),com=(dep,f)=>its.filter(i=>{if(!i.id)return false;const sd=N.saldoDeps(i.id);const v=sd&&sd.por[dep];return v!=null&&Math.abs(+v)>1e-9&&(!f||f(i));}).length;
  const pr=(deps.find(d=>d.princ)||{}).id;
  const gr=estFolhas().filter(f=>f.k!=='tanques');
  const lin=(nome,tipo,n,acoes)=>`<tr><td><b>${esc(nome)}</b></td><td class="k">${tipo}</td><td class="n">${nq(n)}</td><td class="n" style="white-space:nowrap">${acoes||''}</td></tr>`;
  $('app').innerHTML=`<div class="migalha">Configurações › Suprimentos › Controle de estoque</div>
  <div class="topo"><h1>Depósitos</h1>${pe?'<button class="btn pri" id="dNovo">＋ Novo depósito</button>':''}</div>
  <div class="caixa rolx"><table class="tv"><thead><tr><th>Depósito</th><th>Tipo</th><th class="n">Itens com saldo</th><th></th></tr></thead><tbody>
    ${gr.map(f=>lin(N.depGrupo?N.depGrupo(f.k):f.n,'da empresa · do grupo '+esc(f.n),com(pr,i=>i.g===f.k||(f.k==='pa'&&i.tp==='p')))).join('')}
    ${deps.filter(d=>!d.princ).map(d=>{const forn=d.forn||/^NA /i.test(d.nome);return lin(d.nome,d.id==='quar'?'da empresa · saiu do envase e espera liberação':forn?'no fornecedor · nasceu pela ordem de compra':'da empresa',com(d.id),
      (pe&&!forn?`<button class="btn sm" data-de="${esc(d.id)}">Renomear</button> `:'')+(px&&d.id!=='quar'?`<button class="btn sm del" data-dx="${esc(d.id)}">Excluir</button>`:''));}).join('')}
  </tbody></table></div>
  <div class="leg">Cada item fica no depósito do seu grupo (um rótulo está sempre no DEPÓSITO DE RÓTULOS). Para mudar de lugar, use <b>Transferir entre depósitos</b> no item: para a QUARENTENA ou para um fornecedor.
  O depósito do fornecedor nasce sozinho na primeira ordem de compra com industrialização dele. Só exclui depósito sem saldo.</div>`;
  if($('dNovo'))$('dNovo').onclick=()=>formDep(null);
  document.querySelectorAll('[data-de]').forEach(b=>b.onclick=()=>formDep(N.depositos().find(d=>d.id===b.dataset.de)));
  document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{const d=N.depositos().find(x=>x.id===b.dataset.dx);if(!d)return;
    const u=N.usoDeposito?N.usoDeposito(d.id):{itens:0,lanc:0};if(u.itens)return toast(`${d.nome} ainda tem saldo. Transfira antes de excluir.`,true);
    if(!confirm(`Excluir o depósito ${d.nome}?`))return;try{N.salvarDepositos(N.depositos().filter(x=>x.id!==d.id));toast('Depósito excluído.');}catch(e){toast(e.message,true);}telaDepositos();});
};
formDep=function(d){
  gaveta(`<div class="gt"><h2>${d?'Renomear depósito':'Novo depósito'}</h2><button class="btn sm" id="gX">Fechar ✕</button></div><div class="gc">
    <div class="cmp"><label>Nome do depósito</label><input id="dN" value="${d?esc(d.nome):''}" placeholder="ex.: ALMOXARIFADO" style="text-transform:uppercase;width:100%"></div></div>
    <div class="gr"><button class="btn" id="gC">Cancelar</button><button class="btn pri" id="gOk">Salvar</button></div>`);
  $('gX').onclick=$('gC').onclick=()=>gaveta(null);
  $('gOk').onclick=()=>{const n=$('dN').value.trim().toUpperCase();if(!n)return toast('Dê um nome ao depósito.',true);
    const l=N.depositos();if(d){const x=l.find(x=>x.id===d.id);x.nome=n;}else l.push({id:'d'+Date.now().toString(36),nome:n,forn:'',fornId:'',princ:false});
    try{N.salvarDepositos(l);gaveta(null);toast('Depósito salvo.');telaDepositos();}catch(e){toast(e.message,true);}};
};

/* v4.9.2 · lista dos depósitos com os nomes curtos: os da empresa (EXPEDIÇÃO, QUARENTENA, PREFORMAS, FRASCOS,
   FRASCOS ROTULADOS, FÁBRICA) e os dos fornecedores (nascem pela ordem de compra; dá para renomear). */
estOnde=function(i){
  if(!i.id||!N.saldoDeps)return '';const sd=N.saldoDeps(i.id)||{por:{}},deps=depsN();
  return deps.map(d=>{const v=sd.por[d.id];if(v==null||Math.abs(+v)<1e-9)return '';
    const nm=depG491(d.id,i.id)||d.nome,cl=d.id==='quar'?'q':(!d.princ&&d.forn)?'f':'';
    return `<span class="e9d ${cl} ${+v<0?'neg':''}">${esc(nm)}</span>`;}).join('')||'<span class="k">—</span>';
};
telaDepositos=function(){
  window.__DEPGRP=null;
  const deps=N.depositos(),pe=pode('estoque.cfg','editar'),px=pode('estoque.cfg','excluir');
  const its=estItens(),com=(dep,f)=>its.filter(i=>{if(!i.id)return false;const sd=N.saldoDeps(i.id);const v=sd&&sd.por[dep];return v!=null&&Math.abs(+v)>1e-9&&(!f||f(i));}).length;
  const pr=(deps.find(d=>d.princ)||{}).id;
  /* os grupos que caem em cada depósito da empresa */
  const ord=['EXPEDIÇÃO','PREFORMAS','FRASCOS','FRASCOS ROTULADOS','FÁBRICA'],por={};
  estFolhas().filter(f=>f.k!=='tanques').forEach(f=>{const n=N.depGrupo?N.depGrupo(f.k):'FÁBRICA';(por[n]=por[n]||[]).push(f);});
  const lin=(nome,tipo,n,acoes)=>`<tr><td><b>${esc(nome)}</b></td><td class="k">${tipo}</td><td class="n">${nq(n)}</td><td class="n" style="white-space:nowrap">${acoes||''}</td></tr>`;
  const empresa=ord.filter(n=>por[n]).map(n=>{const fs=por[n],ks=fs.map(f=>f.k);
    return lin(n,'da empresa · '+esc(fs.map(f=>f.n).join(', ')),com(pr,i=>ks.includes(i.g)||(n==='EXPEDIÇÃO'&&i.tp==='p')));});
  const q=deps.find(d=>d.id==='quar');
  const outros=deps.filter(d=>!d.princ&&d.id!=='quar');
  $('app').innerHTML=`<div class="migalha">Configurações › Suprimentos › Controle de estoque</div>
  <div class="topo"><h1>Depósitos</h1>${pe?'<button class="btn pri" id="dNovo">＋ Novo depósito</button>':''}</div>
  <div class="caixa rolx"><table class="tv"><thead><tr><th>Depósito</th><th>O que fica nele</th><th class="n">Itens com saldo</th><th></th></tr></thead><tbody>
    ${empresa[0]||''}
    ${q?lin(q.nome,'da empresa · produto acabado que saiu do envase e espera liberação',com(q.id)):''}
    ${empresa.slice(1).join('')}
    ${outros.map(d=>lin(d.nome,d.forn?'no fornecedor · '+esc(d.forn):'da empresa',com(d.id),
      (pe?`<button class="btn sm" data-de="${esc(d.id)}">Renomear</button> `:'')+(px?`<button class="btn sm del" data-dx="${esc(d.id)}">Excluir</button>`:''))).join('')}
  </tbody></table></div>
  <div class="leg">Cada item fica no depósito do seu grupo. Para mudar de lugar, use <b>Transferir entre depósitos</b> no item.
  O depósito do fornecedor nasce sozinho na primeira ordem de compra com industrialização dele. Só exclui depósito sem saldo.</div>`;
  if($('dNovo'))$('dNovo').onclick=()=>formDep(null);
  document.querySelectorAll('[data-de]').forEach(b=>b.onclick=()=>formDep(N.depositos().find(d=>d.id===b.dataset.de)));
  document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{const d=N.depositos().find(x=>x.id===b.dataset.dx);if(!d)return;
    const u=N.usoDeposito?N.usoDeposito(d.id):{itens:0,lanc:0};if(u.itens)return toast(`${d.nome} ainda tem saldo. Transfira antes de excluir.`,true);
    if(!confirm(`Excluir o depósito ${d.nome}?`))return;try{N.salvarDepositos(N.depositos().filter(x=>x.id!==d.id));toast('Depósito excluído.');}catch(e){toast(e.message,true);}telaDepositos();});
};

</script>
