<script>
/* =====================================================================
   Logística · ERP Atrius · módulo do ERP Atrius
   Arquivo próprio, que abre na moldura do ERP. Não carrega o motor do PCP:
   pede ao núcleo (window.parent.csNucleo) os insumos, os saldos do Tiny, o
   que as OPs vão consumir e a gravação. Assim uma mudança aqui não mexe no
   PCP que está rodando, e vice-versa.
   ===================================================================== */
const MOD_TESTE=false;
const MOD_ID='logistica';
const N=(()=>{try{if(window.parent!==window&&window.parent.csNucleo)return window.parent.csNucleo;}catch(e){}
  return window.csNucleo||null;})();
const $=id=>document.getElementById(id);
/* dentro do ERP a pílula TESTE já está no canto da casca: aqui ela sobraria em dobro */
try{if(window.parent!==window){const p=document.querySelector('.teste-pill');if(p)p.remove();}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=0)=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const nq=v=>{const n=Math.round((+v||0)*1000)/1000;return Number.isInteger(n)?nf(n):n.toLocaleString('pt-BR',{maximumFractionDigits:3});};
const rs=v=>'R$ '+nf(v,2);
/* número digitado à brasileira: "1.234,5" vira 1234.5 */
const num=s=>{if(typeof s==='number')return s;s=String(s||'').trim();if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0;};
const ymd=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const hojeY=()=>ymd(new Date());
const br=y=>y?y.split('-').reverse().join('/'):'—';
const addDias=(y,n)=>{const d=new Date(y+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const agora=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const usuario=()=>N?N.usuario():'Teste';
const pode=(k,nv)=>N?N.pode(k,nv):true;
function toast(m,erro){const t=document.createElement('div');t.className='toast'+(erro?' erro':'');t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),erro?5200:2800);}
/* unidade: o que se pesa é kg, o resto é unidade */
const unDe=x=>/mat[ée]ria|fragr|corante/i.test((x&&x.tipo)||'')?'kg':'un';

/* ---------- gravação ---------- */
let DB=null,tGrava=null,GRAVANDO=false,SUJO=false;
function salvar(){SUJO=true;clearTimeout(tGrava);tGrava=setTimeout(gravarAgora,500);marcaSalvo('salvando…');}
async function gravarAgora(){
  if(!N||GRAVANDO)return;GRAVANDO=true;SUJO=false;
  try{
    const r=await N.gravar(MOD_ID,DB);
    if(r&&r.conflito){toast('Outra pessoa gravou antes. Recarreguei o que está no banco.',true);DB=normaliza(await N.ler(MOD_ID));render();}
    else marcaSalvo(r&&r.local?'salvo neste navegador '+agora().slice(-5):'salvo no banco '+agora().slice(-5));
  }catch(e){marcaSalvo('NÃO SALVOU');toast('Não consegui gravar: '+e.message,true);}
  GRAVANDO=false;if(SUJO)salvar();
}
function marcaSalvo(t){document.querySelectorAll('.salvo').forEach(e=>e.textContent=t);}
window.addEventListener('beforeunload',e=>{if(SUJO){e.preventDefault();e.returnValue='';}});

/* ---------- página pelo endereço (#ordens, #necessidade…) ---------- */
let PAG='';
function lerHash(){const h=(location.hash||'').replace('#','').split('/');return {pag:h[0]||PAGINA_INICIAL,arg:h.slice(1).join('/')};}
window.addEventListener('hashchange',()=>{const {pag}=lerHash();if(pag!==PAG){PAG=pag;try{N&&N.pagina(PAG);}catch(e){}}render();});
function ir(pag,arg){location.hash='#'+pag+(arg?'/'+arg:'');}

/* ---------- gaveta e popups ---------- */
function gaveta(html){const g=$('gav');if(html==null){g.classList.remove('on');$('veu').classList.remove('on');return;}
  g.innerHTML=html;g.classList.add('on');$('veu').classList.add('on');}
$('veu').onclick=()=>gaveta(null);

/* ---------- busca de insumo com lista embaixo do campo ---------- */
function buscaInsumo(input,escolhe,filtro){
  const caixa=input.parentNode;caixa.classList.add('rel');
  let lista=null;
  const fecha=()=>{if(lista){lista.remove();lista=null;}};
  input.addEventListener('input',()=>{
    fecha();const q=input.value.trim().toLowerCase();if(q.length<2)return;
    const achados=(N?N.insumos():[]).filter(x=>(!filtro||filtro(x))&&(x.sku+' '+x.nome+' '+x.tipo).toLowerCase().includes(q)).slice(0,12);
    if(!achados.length)return;
    lista=document.createElement('div');lista.className='lista-sug';
    lista.innerHTML=achados.map((x,i)=>`<button data-i="${i}"><b>${esc(x.nome)}</b><small>${esc(x.sku)} · ${esc(x.tipo)}${x.tiny?'':' · sem código do Tiny'}</small></button>`).join('');
    caixa.appendChild(lista);
    lista.querySelectorAll('button').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();escolhe(achados[+b.dataset.i]);input.value='';fecha();});
  });
  input.addEventListener('blur',()=>setTimeout(fecha,150));
}

   estado: {m:'sem'|'dia'|'mes'|'int'|'prev', dia, mes:'aaaa-mm', de, ate, campo}
   abrirPeriodo(botão, estado, {prev:true|false, campos:[[valor,rótulo]]}, aplicar)
   ===================================================================== */
const PER_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PER_MC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const perHoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const perYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const perD=s=>{const [a,m,d]=String(s).split('-').map(Number);return new Date(a,(m||1)-1,d||1);};
const perBr=s=>s?String(s).split('-').reverse().join('/'):'';
const perLe=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;};
const perAdd=(s,n)=>{const d=perD(s);d.setDate(d.getDate()+n);return perYmd(d);};
function perNovo(m){const h=perHoje();return {m:m||'sem',dia:h,mes:h.slice(0,7),de:perAdd(h,-29),ate:h,campo:''};}
function perRotulo(p){if(!p||p.m==='sem')return 'Período';const h=perHoje();
  if(p.m==='dia')return p.dia===h?'Hoje':perBr(p.dia);
  if(p.m==='mes'){const [a,m]=p.mes.split('-');return PER_MES[+m-1]+' de '+a;}
  const ano=p.de.slice(0,4)!==p.ate.slice(0,4)||p.ate.slice(0,4)!==h.slice(0,4);
  const r=p.de===p.ate?perBr(p.de):perBr(p.de).slice(0,ano?10:5)+' a '+perBr(p.ate).slice(0,ano?10:5);

/* o intervalo efetivo, para quem filtra: {de, ate} (vazio = sem limite) */
function perFaixa(p){if(!p||p.m==='sem')return {de:'',ate:''};
  if(p.m==='dia')return {de:p.dia,ate:p.dia};
  if(p.m==='mes'){const [a,m]=p.mes.split('-').map(Number);return {de:p.mes+'-01',ate:perYmd(new Date(a,m,0))};}
  return {de:p.de<=p.ate?p.de:p.ate,ate:p.de<=p.ate?p.ate:p.de};}
function perBotao(id,p){return `<button class="perb2 ${p&&p.m!=='sem'?'ativo':''}" id="${id}" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg> ${perRotulo(p)}</button>`;}
function abrirPeriodo(botao,estado,opts,aplicar){
  opts=opts||{};
  const velho=document.getElementById('perPop');if(velho){const mesmo=velho._dono===botao;velho.remove();if(mesmo)return;}
  const t=JSON.parse(JSON.stringify(estado||perNovo()));if(!t.campo&&opts.campos)t.campo=opts.campos[0][0];
  let alvo='de',view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);
  const p=document.createElement('div');p.id='perPop';p.className='perpop';p._dono=botao;document.body.appendChild(p);
  const modos=[['sem','sem filtro'],['dia','do dia'],['mes','do mês'],['int','do intervalo'],...(opts.prev?[['prev','previstos para']]:[])];
  const cal=()=>{const y=view.getFullYear(),m=view.getMonth(),ini=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const faixa=t.m==='int'||t.m==='prev';
    const cls=s=>{if(!faixa)return s===t.dia?'on':'';const a=t.de<=t.ate?t.de:t.ate,b=t.de<=t.ate?t.ate:t.de;if(s===a&&s===b)return 'on';if(s===a)return 'on ini';if(s===b)return 'on fim';return s>a&&s<b?'fx':'';};
    return `<div class="pcal"><div class="pch"><button data-nv="-1" type="button">‹</button><b>${PER_MES[m]} ${y}</b><button data-nv="1" type="button">›</button></div><div class="pcg">${'DSTQQSS'.split('').map(x=>'<span>'+x+'</span>').join('')}${'<i></i>'.repeat(ini)}${Array.from({length:n},(_,i)=>{const s=perYmd(new Date(y,m,i+1));return `<button type="button" class="${cls(s)} ${s===perHoje()?'hj':''}" data-dd="${s}">${i+1}</button>`;}).join('')}</div></div>`;};
  const res=()=>{const f=perFaixa(t);if(t.m==='sem')return 'mostra tudo, sem limitar por data';
    const dias=Math.round((perD(f.ate)-perD(f.de))/864e5)+1;return `<b>${perRotulo(t)}</b>${dias>1?` · ${dias} dias`:''}`;};
  const des=()=>{
    let c='';
    if(t.m==='dia')c=`<div class="pdf"><button data-dia="-1" type="button">‹</button><input id="pdDia" value="${perBr(t.dia)}"><button data-dia="1" type="button">›</button></div>${cal()}`;
    else if(t.m==='mes'){const [a,mm]=t.mes.split('-').map(Number);c=`<div class="pdf sm"><button data-ano="-1" type="button">‹</button><input value="${a}" readonly><button data-ano="1" type="button">›</button></div><div class="pmes">${PER_MC.map((x,i)=>`<button type="button" data-ms="${i+1}" class="${i+1===mm?'on':''}">${x}</button>`).join('')}</div>`;}
    else if(t.m==='int'||t.m==='prev'){const h=perHoje();
      const at=t.m==='prev'?[['hoje',h,h],['amanhã',perAdd(h,1),perAdd(h,1)],['próximos 7 dias',h,perAdd(h,6)]]:[['últimos 7 dias',perAdd(h,-6),h],['últimos 30 dias',perAdd(h,-29),h],['este mês',h.slice(0,8)+'01',perFaixa({m:'mes',mes:h.slice(0,7)}).ate],['mês passado',perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth()-1,1)),perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth(),0))]];
      c=`${t.m==='prev'?'<div class="pdica">Entrega prevista entre as duas datas. Para um dia só, deixe as duas iguais.</div>':''}<div class="patal">${at.map(([r,a,b],i)=>`<button type="button" data-at="${i}">${r}</button>`).join('')}</div>
      <div class="pdois"><div><small>de</small><div class="pdf sm ${alvo==='de'?'at':''}" data-alvo="de"><input id="pdDe" value="${perBr(t.de)}"></div></div><div><small>até</small><div class="pdf sm ${alvo==='ate'?'at':''}" data-alvo="ate"><input id="pdAte" value="${perBr(t.ate)}"></div></div></div>
      <div class="pdica">${alvo==='de'?'clique no primeiro dia':'agora clique no último dia'}</div>${cal()}`;
      p._at=at;}
    else c='<div class="pdica" style="margin:6px 0 10px">Mostra tudo, sem limitar por data.</div>';
    p.innerHTML=`<div class="pmodos">${modos.map(([k,r])=>`<button type="button" data-md="${k}" class="${t.m===k?'on':''}">${r}</button>`).join('')}</div>
      <div class="pcorpo">${c}${opts.campos&&t.m!=='sem'?`<div class="pcampo"><small>Data a considerar</small><select id="pdCampo">${opts.campos.filter(x=>t.m==='prev'?true:!x[2]).map(([v,r])=>`<option value="${v}" ${t.campo===v?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
      <div class="pres">${res()}</div><div class="pbot"><button type="button" class="btn" id="pdLimpa">limpar</button><button type="button" class="btn pri" id="pdOk">aplicar</button></div></div>`;
    p.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{t.m=b.dataset.md;alvo='de';if(t.m==='prev'&&!(estado&&estado.m==='prev')){t.de=t.ate=perHoje();}
      view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{view.setMonth(view.getMonth()+(+b.dataset.nv));des();});
    p.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{const s=b.dataset.dd;if(t.m==='dia'){t.dia=s;}else if(alvo==='de'){t.de=s;if(t.ate<s)t.ate=s;alvo='ate';}else{if(s<t.de){t.ate=t.de;t.de=s;}else t.ate=s;alvo='de';}des();});
    p.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{t.dia=perAdd(t.dia,+b.dataset.dia);view=perD(t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-ano]').forEach(b=>b.onclick=()=>{const [a,mm]=t.mes.split('-');t.mes=(+a+(+b.dataset.ano))+'-'+mm;des();});
    p.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{t.mes=t.mes.slice(0,4)+'-'+String(b.dataset.ms).padStart(2,'0');des();});
    p.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{const x=p._at[+b.dataset.at];t.de=x[1];t.ate=x[2];alvo='de';view=perD(t.de);view.setDate(1);des();});
    p.querySelectorAll('[data-alvo]').forEach(b=>b.onclick=()=>{if(alvo!==b.dataset.alvo){alvo=b.dataset.alvo;des();const i=p.querySelector(alvo==='de'?'#pdDe':'#pdAte');if(i)i.focus();}});
    const inp=(id,f)=>{const i=p.querySelector(id);if(i)i.onchange=()=>{const v=perLe(i.value);if(v){f(v);view=perD(v);view.setDate(1);}des();};};
    inp('#pdDia',v=>t.dia=v);inp('#pdDe',v=>t.de=v);inp('#pdAte',v=>t.ate=v);
    const cs=p.querySelector('#pdCampo');if(cs)cs.onchange=()=>{t.campo=cs.value;};
    p.querySelector('#pdLimpa').onclick=()=>{p.remove();aplicar(Object.assign(perNovo('sem'),{campo:t.campo}));};
    p.querySelector('#pdOk').onclick=()=>{p.remove();if(t.m!=='prev'&&opts.campos&&opts.campos.some(x=>x[0]===t.campo&&x[2]))t.campo=opts.campos[0][0];aplicar(t);};
    posiciona();
  };
  const posiciona=()=>{const r=botao.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
    let l=r.left;if(l+w>innerWidth-8)l=Math.max(8,innerWidth-w-8);let tp=r.bottom+6;if(tp+h>innerHeight-8)tp=Math.max(8,innerHeight-h-8);

}
document.addEventListener('click',ev=>{const p=document.getElementById('perPop');if(p&&!p.contains(ev.target)&&ev.target!==p._dono&&!(p._dono&&p._dono.contains(ev.target)))p.remove();});

/* =====================================================================
   COLUNAS VISÍVEIS · o botão do Tiny que escolhe o que aparece na lista
   Cada lista tem uma chave (vendas, compras, ordens...). A escolha fica
   guardada no aparelho, por lista. Funciona olhando o cabeçalho da tabela:
   não precisa mexer em quem desenha a lista — some a coluna com o título
   que a pessoa desligou. Coluna sem título (marcar, três pontinhos) fica.
   ===================================================================== */
const COLS_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="9" r="2" fill="#fff"/><circle cx="12" cy="15" r="2" fill="#fff"/><circle cx="18" cy="8" r="2" fill="#fff"/></svg>';
const colsNorm=s=>String(s||'').replace(/[↑↓▲▼⇅]/g,'').replace(/\s+/g,' ').trim();
function colsOcultas(k,pad){try{const v=JSON.parse(localStorage.getItem('erp.cols.'+k)||'null');return Array.isArray(v)?v:(pad||[]);}catch(e){return pad||[];}}
function colsGravar(k,l){try{localStorage.setItem('erp.cols.'+k,JSON.stringify(l));}catch(e){}}
function colsBotao(id){return `<button type="button" class="colbt" id="${id}" title="Escolher as colunas que aparecem">${COLS_SVG}</button>`;}
/* painel: lista de rótulos com chave liga/desliga; fixas não desligam */
function colsPainel(k,rotulos,pad,fixas,aoAplicar){
  const velho=document.getElementById('colsP');if(velho){velho.remove();document.getElementById('colsV')&&document.getElementById('colsV').remove();}
  const oc=new Set(colsOcultas(k,pad));fixas=fixas||[];
  const v=document.createElement('div');v.id='colsV';v.className='colsv';
  const p=document.createElement('div');p.id='colsP';p.className='colsp';
  const lin=()=>rotulos.map(r=>`<label class="${fixas.includes(r)?'fx':''}"><span class="sw ${oc.has(r)?'':'on'}" data-cr="${r.replace(/"/g,'&quot;')}"></span>${r}</label>`).join('');
  p.innerHTML=`<div class="ch"><b>Informações visíveis</b><button type="button" class="x" id="colsX">fechar ✕</button></div>
    <p>Escolha as colunas que aparecem nesta lista. Fica guardado neste aparelho.</p>
    <div class="cl" id="colsL">${lin()}</div>
    <div class="cf"><button type="button" class="btn pri" id="colsOk">Aplicar</button><button type="button" class="btn" id="colsPad">Voltar ao padrão</button><button type="button" class="btn lk" id="colsC">Cancelar</button></div>`;
  document.body.appendChild(v);document.body.appendChild(p);
  const fecha=()=>{p.remove();v.remove();};
  const liga=()=>p.querySelectorAll('[data-cr]').forEach(s=>s.onclick=()=>{const r=s.dataset.cr;if(fixas.includes(r))return;oc.has(r)?oc.delete(r):oc.add(r);s.classList.toggle('on',!oc.has(r));});
  liga();v.onclick=fecha;p.querySelector('#colsX').onclick=fecha;p.querySelector('#colsC').onclick=fecha;
  p.querySelector('#colsPad').onclick=()=>{oc.clear();(pad||[]).forEach(r=>oc.add(r));p.querySelector('#colsL').innerHTML=lin();liga();};
  p.querySelector('#colsOk').onclick=()=>{colsGravar(k,[...oc]);fecha();if(aoAplicar)aoAplicar();};
}
/* tabela <table>: some a coluna pelo título do cabeçalho */
function colsTabela(tab,k,pad){
  if(!tab)return [];
  const oc=new Set(colsOcultas(k,pad)),ths=[...tab.querySelectorAll('thead tr:first-child > th')];
  const rot=ths.map(t=>colsNorm(t.textContent));const esc=[];
  rot.forEach((r,i)=>{if(r&&oc.has(r))esc.push(i);});
  ths.forEach((t,i)=>t.style.display=esc.includes(i)?'none':'');
  tab.querySelectorAll('tbody > tr, tfoot > tr').forEach(tr=>{const tds=[...tr.children];if(tds.length!==ths.length)return;
    tds.forEach((td,i)=>td.style.display=esc.includes(i)?'none':'');});
  return rot.filter(Boolean);
}
/* lista em grade (div.h + div.r): some a coluna e refaz as trilhas */
function colsGrade(caixa,k,trilhas,pad){
  if(!caixa)return [];
  const h=caixa.querySelector('.h');if(!h)return [];
  const oc=new Set(colsOcultas(k,pad)),cel=[...h.children],rot=cel.map(c=>colsNorm(c.textContent));
  const esc=[];rot.forEach((r,i)=>{if(r&&oc.has(r))esc.push(i);});
  const tpl=trilhas.filter((t,i)=>!esc.includes(i)).join(' ');
  [h,...caixa.querySelectorAll('.r')].forEach(r=>{if(r.children.length!==cel.length)return;
    r.style.gridTemplateColumns=tpl;[...r.children].forEach((c,i)=>c.style.display=esc.includes(i)?'none':'');});
  return rot.filter(Boolean);
}

const deBR=s=>{const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(!m)return '';
  const a=m[3].length===2?'20'+m[3]:m[3];const d=new Date(+a,+m[2]-1,+m[1]);
  if(d.getDate()!==+m[1]||d.getMonth()!==+m[2]-1)return '';return ymd(d);};
/* calendário: o mesmo modelo em todo campo de data */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function ligaCalendarios(raiz){
  (raiz||document).querySelectorAll('input[data-cal]').forEach(inp=>{
    if(inp._cal)return;inp._cal=1;inp.autocomplete='off';
    inp.addEventListener('click',ev=>{ev.stopPropagation();if(inp.disabled)return;abreCalendario(inp);});
  });
}
function abreCalendario(inp){
  document.querySelectorAll('.cal-pop').forEach(c=>c.remove());
  const sel=deBR(inp.value)||hojeY();let mes=new Date(sel+'T12:00');mes.setDate(1);
  const p=document.createElement('div');p.className='cal-pop';document.body.appendChild(p);
  const r=inp.getBoundingClientRect();p.style.left=(r.left+window.scrollX)+'px';p.style.top=(r.bottom+window.scrollY+4)+'px';
  const des=()=>{const y=mes.getFullYear(),m=mes.getMonth();const ini=new Date(y,m,1).getDay(),dias=new Date(y,m+1,0).getDate();
    p.innerHTML=`<div class="ch"><button data-n="-1">‹</button><b>${MESES[m]} ${y}</b><button data-n="1">›</button></div><div class="cg">${'DSTQQSS'.split('').map(d=>`<span>${d}</span>`).join('')}${'<i></i>'.repeat(ini)}${
      Array.from({length:dias},(_,i)=>{const d=ymd(new Date(y,m,i+1));return `<button data-d="${d}" class="${d===sel?'on':''} ${d===hojeY()?'hj':''}">${i+1}</button>`;}).join('')}</div>`;
    p.querySelectorAll('[data-n]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();mes.setMonth(mes.getMonth()+ +b.dataset.n);des();});
    p.querySelectorAll('[data-d]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();inp.value=br(b.dataset.d);p.remove();inp.dispatchEvent(new Event('change',{bubbles:true}));});};
  des();p.onclick=ev=>ev.stopPropagation();
  if(r.bottom+p.offsetHeight>window.innerHeight)p.style.top=Math.max(8,r.top+window.scrollY-p.offsetHeight-4)+'px';
}

<script data-v512="periodo">

  const rot=p=>{try{return perRotulo(p);}catch(e){return '';}};

async function sb(path,op){

async function carregaBase(forca){

async function carregaDev(per){

function semAcesso(){$('app').innerHTML='<div class="vazio">Você não tem acesso a esta página. Peça para liberar em Configurações › Pessoas e permissões › Logística.</div>';}

/* =====================================================================

function opCam(sel){return `<option value="">Todos os caminhões</option>${(LG.cams||[]).filter(c=>c.tipo!=='terceiro').map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}

async function telaLista(abrirNum){

  <div class="topo"><h1>Devoluções</h1><span class="salvo"></span>${pode('log.cfg')?'<button class="btn" id="bCam">▦ Caminhões e QR Code</button>':''}<button class="btn" id="bAtu">⟳ Atualizar</button></div>
  <div class="barra"><div class="busca">⌕<input id="q" placeholder="Nº, nossa nota, cliente, motorista, item ou lote" value="${esc(LG.q)}"></div>
    ${perBotao('bPer',LG.per)}<select class="inp lgsel" id="fCam">${opCam(LG.cam)}</select><select class="inp lgsel" id="fGr">${opGrupo(LG.grupo)}</select></div>

  $('q').oninput=e=>{LG.q=e.target.value;desenhaLista();};

function filtra(L,o){

    if(o.sit==='abertas'&&d.status!=='aberta')return false;if(o.sit==='conf'&&d.status!=='conferida')return false;

}

function corrigir(d,i){

/* =====================================================================
   CONFIGURAÇÕES › LOGÍSTICA: motivos e caminhões
   ===================================================================== */
async function telaCfg(){
  const ed=pode('log.cfg','editar');
  $('app').innerHTML=`<div class="migalha">Configurações › Logística</div>
  <div class="topo"><h1>Motivos de devolução</h1><span class="salvo"></span>${ed?'<button class="btn" id="cNG">＋ Novo grupo</button>':''}</div>
  <div class="k lgk">Aparecem no formulário do caminhão agrupados assim. Motivo já usado não se exclui: inativa e some do formulário. Grupo marcado "pede foto" obriga ao menos uma foto.</div>
  <div class="lgMtg" id="cMot"><div class="vazio">Carregando…</div></div>
  <div class="topo" style="margin-top:26px"><h1>Caminhões</h1>${ed?'<button class="btn" id="cNP">＋ Caminhão próprio</button><button class="btn" id="cNT">＋ Caminhão de terceiro</button>':''}</div>
  <div class="k lgk">Cada caminhão tem o seu link: o QR Code vai colado no caminhão e o mesmo link pode ir pelo WhatsApp (o terceiro recebe assim). Quem aparece na lista do formulário se cadastra em Configurações › Pessoas e permissões › Entregas.</div>
  <div class="rolx" style="max-width:1100px"><table class="tv" id="cCam"></table></div>`;
  try{await carregaBase(true);}catch(e){$('cMot').innerHTML=`<div class="aviso">⚠ <div>${esc(e.message)}</div></div>`;return;}
  if($('cNG'))$('cNG').onclick=()=>editaGrupo(null);
  if($('cNP'))$('cNP').onclick=()=>editaCam(null,'propria');
  if($('cNT'))$('cNT').onclick=()=>editaCam(null,'terceiro');
  desenhaCfg();
}
function desenhaCfg(){
  const ed=pode('log.cfg','editar');
  $('cMot').innerHTML=LG.grupos.length?LG.grupos.map(g=>`<div class="card lgMc ${g.ativo?'':'ina'}"><div class="lgMh"><b>${esc(g.nome)}</b>${g.pede_foto?'<span class="lgg av">pede foto</span>':''}${g.ativo?'':'<span class="lgg">inativo</span>'}
      ${ed?`<button class="dots" data-gm="${g.id}" title="Grupo">⋯</button>`:''}</div>
    ${(g.dev_motivos||[]).map(m=>`<div class="lgMl ${m.ativo?'':'ina'}"><span>${esc(m.nome)}${m.outro?' <small>(pede o texto)</small>':''}</span>${m.ativo?'':'<small>inativo</small>'}
      ${ed?`<button class="lk" data-mr="${m.id}">renomear</button><button class="lk" data-ma="${m.id}">${m.ativo?'inativar':'reativar'}</button>`:''}</div>`).join('')}
    ${ed&&g.ativo?`<div class="lgMn"><input class="inp" placeholder="Novo motivo" data-nm="${g.id}"><button class="btn sm" data-nmb="${g.id}">Incluir</button></div>`:''}</div>`).join('')
    :'<div class="vazio">Nenhum grupo ainda.</div>';
  const mt=id=>LG.grupos.flatMap(g=>g.dev_motivos||[]).find(m=>m.id===id);
  document.querySelectorAll('[data-gm]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();menuGrupo(b,LG.grupos.find(g=>g.id===b.dataset.gm));});
  document.querySelectorAll('[data-mr]').forEach(b=>b.onclick=async()=>{const m=mt(b.dataset.mr);const n=prompt('Novo nome do motivo:',m.nome);if(!n||!n.trim()||n.trim()===m.nome)return;
    await grava(`dev_motivos?id=eq.${m.id}`,{nome:n.trim()},'Motivo renomeado.');});
  document.querySelectorAll('[data-ma]').forEach(b=>b.onclick=async()=>{const m=mt(b.dataset.ma);await grava(`dev_motivos?id=eq.${m.id}`,{ativo:!m.ativo},m.ativo?'Motivo inativado.':'Motivo reativado.');});
  const novoM=async gid=>{const i=document.querySelector(`[data-nm="${gid}"]`);const n=(i.value||'').trim();if(!n)return;const g=LG.grupos.find(x=>x.id===gid);
    await grava('dev_motivos',{grupo_id:gid,nome:n,ordem:(g.dev_motivos||[]).length+1,outro:/^outro$/i.test(n)},'Motivo incluído.','POST');};
  document.querySelectorAll('[data-nmb]').forEach(b=>b.onclick=()=>novoM(b.dataset.nmb));
  document.querySelectorAll('[data-nm]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')novoM(i.dataset.nm);});
  /* caminhões */
  const cs=LG.cams;
  $('cCam').innerHTML=`<thead><tr><th>Caminhão</th><th>Tipo</th><th>Placa</th><th>Link</th><th></th></tr></thead><tbody>
    ${cs.length?cs.map(c=>`<tr class="${c.ativo?'':'lgina'}"><td><b>${esc(c.tipo==='terceiro'?(c.transportadora||c.nome):c.nome)}</b>${c.tipo==='terceiro'&&c.transportadora?`<small class="lgsm">${esc(c.nome)}</small>`:''}${c.ativo?'':' <span class="lgg">inativo</span>'}</td>
      <td>${c.tipo==='terceiro'?'<span class="lgst ter">Terceiro</span>':'<span class="lgst pr">Frota própria</span>'}</td><td class="m">${esc(c.placa||'')}</td>
      <td class="m lglink">${esc(linkDe(c))}</td>
      <td><div class="lgac"><button class="btn sm" data-qr="${c.id}">▦ QR Code</button><button class="btn sm" data-cl="${c.id}">Copiar link</button>${ed?`<button class="dots" data-cm="${c.id}">⋯</button>`:''}</div></td></tr>`).join('')
    :'<tr><td colspan="5" class="vazio">Nenhum caminhão cadastrado. Cadastre a frota e os terceiros para gerar os links.</td></tr>'}</tbody>`;
  const cam=id=>cs.find(c=>c.id===id);
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>qr(cam(b.dataset.qr)));
  document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{const l=linkDe(cam(b.dataset.cl));try{navigator.clipboard.writeText(l).then(()=>toast('Link copiado. É só colar no WhatsApp.'),()=>toast(l));}catch(e){toast(l);}});
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const c=cam(b.dataset.cm);
    menuSimples(b,camNome(c),[['Editar',()=>editaCam(c,c.tipo)],[c.ativo?'Inativar (o link para de abrir)':'Reativar',()=>grava(`dev_caminhoes?id=eq.${c.id}`,{ativo:!c.ativo},c.ativo?'Caminhão inativado: o link dele não abre mais.':'Caminhão reativado.')],
      ['Trocar o link (o QR antigo para de funcionar)',()=>{if(confirm('Trocar o link deste caminhão? O QR Code colado hoje para de funcionar e precisa ser impresso de novo.'))grava(`dev_caminhoes?id=eq.${c.id}`,{codigo:Math.random().toString(36).slice(2,12)},'Link trocado. Imprima o QR Code novo.');}]]);});
}
function menuSimples(botao,tit,it){
  const v=document.getElementById('m3d');if(v)v.remove();const m=document.createElement('div');m.id='m3d';m.className='m3';
  m.innerHTML=`<div class="mh">${esc(tit)}</div>`+it.map((x,n)=>`<button data-n="${n}">${esc(x[0])}</button>`).join('');document.body.appendChild(m);
  const r=botao.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-250)+'px';m.style.top=(r.bottom+4)+'px';
  m.onclick=ev=>ev.stopPropagation();m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{m.remove();it[+b.dataset.n][1]();});
  setTimeout(()=>document.addEventListener('click',function f(){const x=document.getElementById('m3d');if(x)x.remove();document.removeEventListener('click',f);}),0);
}
function menuGrupo(b,g){menuSimples(b,g.nome,[['Renomear',async()=>{const n=prompt('Novo nome do grupo:',g.nome);if(n&&n.trim()&&n.trim()!==g.nome)await grava(`dev_grupos?id=eq.${g.id}`,{nome:n.trim()},'Grupo renomeado.');}],
  [g.pede_foto?'Não pedir foto':'Pedir foto (obrigatória)',()=>grava(`dev_grupos?id=eq.${g.id}`,{pede_foto:!g.pede_foto},g.pede_foto?'O grupo não pede mais foto.':'O grupo agora pede foto.')],
  ['Subir',()=>ordemGrupo(g,-1)],['Descer',()=>ordemGrupo(g,1)],
  [g.ativo?'Inativar o grupo':'Reativar o grupo',()=>grava(`dev_grupos?id=eq.${g.id}`,{ativo:!g.ativo},g.ativo?'Grupo inativado: some do formulário.':'Grupo reativado.')]]);}
async function ordemGrupo(g,dir){const l=LG.grupos;const i=l.indexOf(g),j=i+dir;if(j<0||j>=l.length)return;
  try{await Promise.all(l.map((x,k)=>{const o=k===i?j:k===j?i:k;return x.ordem===o+1?null:sb(`dev_grupos?id=eq.${x.id}`,{method:'PATCH',body:{ordem:o+1}});}));await carregaBase(true);desenhaCfg();}catch(e){toast(e.message,true);}}
function editaGrupo(){const n=prompt('Nome do novo grupo de motivos:');if(!n||!n.trim())return;
  grava('dev_grupos',{nome:n.trim(),ordem:LG.grupos.length+1,pede_foto:/avaria/i.test(n)},'Grupo incluído. Inclua os motivos dele.','POST');}
async function grava(path,body,msg,method){
  try{await sb(path,{method:method||'PATCH',body});await carregaBase(true);desenhaCfg();if(msg)toast(msg);}catch(e){toast('Não gravou: '+e.message,true);}}
function editaCam(c,tipo){
  const ter=tipo==='terceiro';c=c||{};
  abreMod(`<h3>${c.id?'Editar':'Novo'} caminhão ${ter?'de terceiro':'próprio'}</h3>
    ${ter?`<label>Transportadora / dono</label><input class="inp" id="eT" value="${esc(c.transportadora||'')}" placeholder="TransRápido, João da Silva…">`:''}
    <label style="margin-top:10px">${ter?'Caminhão (como chamam)':'Nome do caminhão'}</label><input class="inp" id="eN" value="${esc(c.nome||'')}" placeholder="${ter?'Truck, Toco…':'3/4, Toco, Truck…'}">
    <label style="margin-top:10px">Placa</label><input class="inp" id="eP" value="${esc(c.placa||'')}" placeholder="ABC-1D23" style="text-transform:uppercase">
    <div class="lgmb"><button class="btn" id="mX">Cancelar</button><button class="btn pri" id="mOk">${c.id?'Gravar':'Cadastrar'}</button></div>`);
  $('mX').onclick=fechaMod;
  $('mOk').onclick=async()=>{const nome=$('eN').value.trim(),placa=$('eP').value.trim().toUpperCase(),tr=ter?$('eT').value.trim():null;
    if(!nome)return toast('Informe o nome do caminhão.',true);if(ter&&!tr)return toast('Informe a transportadora ou o dono.',true);
    fechaMod();await grava(c.id?`dev_caminhoes?id=eq.${c.id}`:'dev_caminhoes',{nome,placa:placa||null,tipo,transportadora:tr},c.id?'Caminhão atualizado.':'Caminhão cadastrado. Já dá para gerar o QR Code.',c.id?'PATCH':'POST');};
  setTimeout(()=>{const i=$(ter?'eT':'eN');if(i)i.focus();},50);
}
/* QR Code do caminhão, pronto para imprimir e colar */
function qrSvg(texto,tam){if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(texto);q.make();return q.createSvgTag({cellSize:Math.max(2,Math.floor(tam/(q.getModuleCount()+8))),margin:4,scalable:true});}
function qr(c){
  const l=linkDe(c);const svg=qrSvg(l,300);
  if(!svg)return toast('Não consegui carregar o gerador de QR Code. Confira a internet e tente de novo.',true);
  const folha=`<div class="qrF"><img src="${N.logo?N.logo():''}" alt="Atrius"><div class="qrT">Registro de devoluções</div><div class="qrC">Caminhão ${esc(camNome(c))}${c.placa?' · '+esc(c.placa):''}</div>
    <div class="qrQ">${svg}</div><div class="qrI">Aponte a câmera do celular e lance a devolução na hora, com a nota.<br>Precisa de internet para enviar.</div><div class="qrL">${esc(l)}</div></div>`;
  const css=`.qrF{width:150mm;margin:12mm auto;border:2px solid #1B4F9C;border-radius:8mm;padding:10mm;text-align:center;font-family:Inter,system-ui,sans-serif;color:#1A1D23}.qrF img{height:16mm}
    .qrT{font-size:20pt;font-weight:800;margin-top:4mm}.qrC{display:inline-block;margin-top:3mm;background:#EAF2FE;color:#1B4F9C;border-radius:3mm;padding:2mm 6mm;font-size:14pt;font-weight:700}
    .qrQ{width:95mm;margin:6mm auto 2mm}.qrQ svg{width:100%;height:auto}.qrI{font-size:11pt;color:#545C69;line-height:1.5}.qrL{font-size:8pt;color:#8B93A1;margin-top:3mm;word-break:break-all}`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>QR Code - ${esc(camNome(c))}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>${css}body{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:0}</style></head><body>${folha}</body></html>`;
  const P=(()=>{try{return window.parent!==window&&typeof window.parent.csFolhaModal==='function'?window.parent:null;}catch(e){return null;}})();
  if(P){try{P.csFolhaModal({titulo:'QR Code · '+camNome(c),sub:l,arquivo:'QR Code - '+camNome(c),html});return;}catch(e){}}
  const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print();},600);}
}
