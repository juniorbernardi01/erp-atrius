/* =====================================================================
   NECESSIDADE DE COMPRA (v276) · desenho aprovado
   físico (Tiny) + entradas previstas (ordens enviadas) − saídas previstas
   (pedidos em aberto e OPs) = virtual. O consumo médio vem dos pedidos de
   venda passados pela fórmula (ou, sem histórico de vendas, das OPs
   concluídas). Cobertura em dias inteiros, arredondada para baixo.
   ===================================================================== */
const NEC={q:'',tag:'',so:true,sel:{},bal:null};
const NEC_SITS=[['Em aberto','Em aberto'],['Aprovado','Aprovado'],['Preparando envio','Em separação'],['Pronto para envio','Separado'],['Faturado','Faturado'],['Enviado','Em rota']];
let NDADOS={em:0,abertos:null,mes:null,fonte:'',erro:''};
function necCfg(){const c=DB.cfg;
  if(c.nMeses==null)c.nMeses=3;if(!c.nVer)c.nVer='sem';if(c.nCampo==null)c.nCampo='faturamento';if(c.nVersoes==null)c.nVersoes=false;
  if(!Array.isArray(c.nSits))c.nSits=['Em aberto','Aprovado','Preparando envio','Pronto para envio'];if(c.nEnv==null)c.nEnv=true;if(c.nTq==null)c.nTq=true;
  if(c.cobN==null)c.cobN=2;if(!c.cobU)c.cobU='s';if(c.cresc==null)c.cresc=0;return c;}
const mesesAtras=n=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);return ymd(d).slice(0,7);};
const diasDoMes=m=>{const [a,b]=m.split('-').map(Number);return new Date(a,b,0).getDate();};
async function necCarregar(forcar){
  const c=necCfg();const chave=JSON.stringify([c.nCampo,c.nSits]);
  if(!forcar&&NDADOS.abertos&&NDADOS.chave===chave&&Date.now()-NDADOS.em<5*60000)return;
  NDADOS={em:Date.now(),chave,abertos:{},mes:{},fonte:'',erro:''};
  try{
    let ab,ms;
    if(N.teste){const ps=(N.produtos()||[]).slice(0,30);ab={itens:ps.slice(0,12).map((p,i)=>({sku:p.codigo,qtd:20+i*7,pedidos:1+i%4}))};
      ms={linhas:[]};for(let k=24;k>=0;k--){const m=mesesAtras(k);ps.forEach((p,i)=>ms.linhas.push({mes:m,sku:p.codigo,qtd:Math.round((40+i*3)*(1+0.25*Math.sin((+m.slice(5)-3)/2))*(k>12?0.85:1))}));}}
    else{[ab,ms]=await Promise.all([N.tiny({acao:'vendas_abertos',situacoes:c.nSits}),N.tiny({acao:'vendas_mes',campo:c.nCampo,de:mesesAtras(24)+'-01',ate:hojeY()})]);}
    (ab.itens||[]).forEach(x=>{NDADOS.abertos[x.sku]={qtd:+x.qtd||0,pedidos:+x.pedidos||0};});
    (ms.linhas||[]).forEach(x=>{(NDADOS.mes[x.mes]||(NDADOS.mes[x.mes]={}))[x.sku]=(+x.qtd||0);});
    NDADOS.fonte=Object.keys(NDADOS.mes).length?'vendas':'ops';
  }catch(e){NDADOS.erro=e.message;NDADOS.fonte='ops';}
}
/* consumo de cada insumo, mês a mês: pelos pedidos (fórmula) ou pelas OPs */
function necConsumoMeses(){
  const c=necCfg(),out={};
  for(let k=24;k>=0;k--){const m=mesesAtras(k);
    if(NDADOS.fonte==='vendas'){const r=N.explodir(NDADOS.mes[m]||{},m+'-15',c.nVersoes);out[m]={};Object.values(r).forEach(x=>out[m][x.sku]=x.qtd);}
    else{const de=m+'-01',ate=m+'-'+String(diasDoMes(m)).padStart(2,'0');const r=N.consumo(de,ate);out[m]={};Object.values(r).forEach(x=>out[m][x.sku]=x.qtd);}}
  return out;
}
function necLinhas(){
  const c=necCfg(),sal=N.saldos(),res=N.reservado({envase:c.nEnv,tanques:c.nTq});
  const ped={};const mapa={};Object.entries(NDADOS.abertos||{}).forEach(([k,v])=>mapa[k]=v.qtd);
  const pedIns=N.explodir(mapa,hojeY(),false);
  /* de quantos pedidos vem cada insumo */
  Object.entries(NDADOS.abertos||{}).forEach(([cod,v])=>{const r=N.explodir({[cod]:v.qtd},hojeY(),false);Object.keys(r).forEach(s=>ped[s]=(ped[s]||0)+v.pedidos);});
  const CM=necConsumoMeses();const meses=[];for(let k=c.nMeses;k>=1;k--)meses.push(mesesAtras(k));
  const diasJan=meses.reduce((s,m)=>s+diasDoMes(m),0);
  const cob=(+c.cobN||0)*({d:1,s:7,m:30}[c.cobU]||1),cr=1+(+c.cresc||0)/100;
  return N.insumos().map(x=>{
    const un=unDe(x),k=x.sku;
    const fis=x.tiny&&sal[x.tiny]!==undefined?+sal[x.tiny]:null;
    const r=res[k]||res[x.nome]||{qtd:0,ops:0};const pi=(pedIns[k]||{qtd:0}).qtd;
    const saidas=r.qtd+pi,entradas=emCompra(k),virt=(fis||0)+entradas-saidas;
    const tot=meses.reduce((s,m)=>s+((CM[m]||{})[k]||0),0),dia=diasJan?tot/diasJan:0;
    const cobre=dia>0?Math.floor(virt/dia):null;
    const min=+DB.minimos[k]||0;
    const sug=Math.max(0,dia*cr*cob+min-virt);
    return {x,un,k,fis,ops:r.ops,res:r.qtd,ped:pi,npd:ped[k]||0,saidas,entradas,virt,dia,cobre,min,
      sug:sug>0?(un==='kg'?Math.ceil(sug*10)/10:Math.ceil(sug)):0,hist:CM};
  });
}

/* previsão do item: histórico, mês em curso e quanto comprar para cada prazo */
function previsaoItem(l){
  if(!l)return;const c=necCfg();let base=NEC.base||'media';
  const hj=hojeY(),mAt=hj.slice(0,7),H=l.hist;
  const serie=[];for(let k=12;k>=1;k--){const m=mesesAtras(k);serie.push([m,(H[m]||{})[l.k]||0]);}
  const ult12=serie.reduce((s,x)=>s+x[1],0);let ant12=0;for(let k=24;k>=13;k--)ant12+=((H[mesesAtras(k)]||{})[l.k]||0);
  const yoy=ant12>0?ult12/ant12-1:(+c.cresc||0)/100;
  const cons=(H[mAt]||{})[l.k]||0,diaHj=+hj.slice(8),dm=diasDoMes(mAt);
  const falta=l.dia*(dm-diaHj),tend=cons+falta;
  const prev=k=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+k);const m=ymd(d).slice(0,7);
    if(base==='ano'){const a=new Date(d);a.setFullYear(a.getFullYear()-1);const v=(H[ymd(a).slice(0,7)]||{})[l.k];if(v)return [m,v*(1+yoy)];}
    return [m,l.dia*diasDoMes(m)*(1+(+c.cresc||0)/100)];};
  const fut=[1,2,3,4].map(prev);
  const todos=[...serie,[mAt,tend],...fut];const mx=Math.max(1,...todos.map(x=>x[1]));
  const barras=todos.map(([m,v],i)=>{const h=Math.round(v/mx*120);const f=i>=12;return `<div class="nbar"><i style="height:${h}px" class="${i===12?'at':f?'fu':''}"></i><span>${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m.slice(5)-1]}</span></div>`;}).join('');
  const hor=[['1 semana',7],['15 dias',15],['1 mês',30],['3 meses',91],['4 meses',122]].map(([r,d])=>{
    let vai=0,rest=d;vai+=Math.min(rest,dm-diaHj)*l.dia;rest-=Math.min(rest,dm-diaHj);
    for(let k=0;k<4&&rest>0;k++){const [m,v]=fut[k];const dd=diasDoMes(m);vai+=v*Math.min(rest,dd)/dd;rest-=Math.min(rest,dd);}
    if(rest>0)vai+=rest*l.dia;
    const comprar=Math.max(0,vai+l.min-l.virt);return {r,vai,comprar:l.un==='kg'?Math.ceil(comprar*10)/10:Math.ceil(comprar)};});
  gaveta(`<div class="gt"><h2>Previsão · ${esc(l.x.nome)}</h2><button class="btn sm" id="gX" style="margin-left:auto">Fechar ✕</button></div><div class="gc">
    <div class="k" style="margin-bottom:6px">consumo por mês, em ${l.un} · azul claro é a previsão · fonte: ${NDADOS.fonte==='vendas'?'pedidos de venda pela fórmula':'OPs concluídas'}</div>
    <div class="ngraf">${barras}</div>
    <div class="nmes"><div><span>${['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][+mAt.slice(5)-1]} · já consumido</span><b>${necFmt(cons)}</b><small>até dia ${diaHj}</small></div>
      <div><span>Ainda vai consumir no mês</span><b>${necFmt(falta)}</b><small>${dm-diaHj} dias na média</small></div><div><span>Tendência do mês</span><b>${necFmt(tend)}</b><small>já consumido + o que falta</small></div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0"><span class="k">Prever com</span><span class="seg"><button data-bs="media" class="${base==='media'?'on':''}">média dos últimos ${c.nMeses} meses</button><button data-bs="ano" class="${base==='ano'?'on':''}">mesmo mês do ano passado + crescimento</button></span>
      <span class="k">crescimento ${base==='ano'?(yoy*100>=0?'+':'')+nq(Math.round(yoy*1000)/10)+'% (ano contra ano)':(+c.cresc||0)+'% (dos parâmetros)'}</span></div>
    <table class="tv"><thead><tr><th>Comprar para</th><th class="n">Vai consumir</th><th class="n">Estoque físico</th><th class="n">Estoque virtual</th><th class="n">Comprar</th><th></th></tr></thead><tbody>
    ${hor.map((h,i)=>`<tr><td>${h.r}</td><td class="n">${necFmt(h.vai)}</td><td class="n">${necFmt(l.fis)}</td><td class="n">${necFmt(l.virt)}</td><td class="n"><b>${h.comprar?nq(h.comprar):'—'}</b></td><td>${h.comprar?`<button class="btn sm" data-usa="${i}">usar</button>`:''}</td></tr>`).join('')}</tbody></table>
    <div class="leg">O mês em curso é o que já foi consumido mais o que falta na média. Os meses seguintes usam a média${' '}ou o mesmo mês do ano passado vezes o crescimento, o que pega o pico de fim de ano. <b>Usar</b> leva a quantidade para a coluna Comprar.</div></div>`);
  $('gX').onclick=()=>gaveta(null);
  document.querySelectorAll('[data-bs]').forEach(b=>b.onclick=()=>{NEC.base=b.dataset.bs;previsaoItem(l);});
  document.querySelectorAll('[data-usa]').forEach(b=>b.onclick=()=>{NEC.sel[l.k]=hor[+b.dataset.usa].comprar;gaveta(null);telaNecessidade();});
}
/* Gerar OC: todos os homologados dos itens marcados; nova ordem ou incluir numa existente */
function gavetaGerar(){
  const ks=Object.keys(NEC.sel).filter(k=>+NEC.sel[k]>0);
  if(!ks.length)return toast('Digite a quantidade a comprar dos itens marcados.',true);
  const homs={};ks.forEach(k=>vinculosDoItem(k).filter(v=>v.sit!=='b'&&v.sit!=='r').forEach(v=>{(homs[v.fid]||(homs[v.fid]={n:0,tot:0}));homs[v.fid].n++;}));
  DB.fornecedores.forEach(f=>{if(!homs[f.id]&&ks.some(k=>melhorPreco(k,f.id)))homs[f.id]={n:ks.filter(k=>melhorPreco(k,f.id)).length,tot:0};});
  const lista=Object.entries(homs).map(([fid,h])=>({f:fornPorId(fid),n:h.n,tot:ks.reduce((s,k)=>{const mp=melhorPreco(k,fid)||ultimaCompra(k,fid);return s+(mp?mp.preco*(+NEC.sel[k]):0);},0)})).filter(x=>x.f).sort((a,b)=>b.n-a.n||a.tot-b.tot);
  let forn=lista.length?lista[0].f.id:'',modo='';
  const des=()=>{
    const itensTxt=ks.map(k=>`${esc((insumo(k)||{nome:k}).nome)} ${nq(NEC.sel[k])}`).join(' · ');
    let corpo='';
    if(modo==='exist'){const q=(NEC.qoc||'').toLowerCase();const soF=NEC.soF!==false;
      const ocs=DB.ocs.filter(o=>['ras','env'].includes(o.sit)&&(!soF||!forn||(o.forn&&o.forn.id===forn))&&(!q||[o.num,o.forn&&o.forn.nome,...(o.itens||[]).map(i=>i.nome)].join(' ').toLowerCase().includes(q)));
      corpo=`<div class="busca" style="margin-bottom:8px">⌕<input id="gq" placeholder="Nº da ordem, fornecedor ou item" value="${esc(NEC.qoc||'')}"></div>
      <label class="chk2"><input type="checkbox" id="gSoF" ${soF?'checked':''}> só do fornecedor escolhido</label>
      <div class="lsoc">${ocs.map(o=>`<button class="lin2" data-inc="${o.id}"><b>${esc(o.num)}</b> · ${esc(o.forn?o.forn.nome:'sem fornecedor')} <span class="k">${SIT[o.sit]} · ${(o.itens||[]).length} itens · ${rs(contaOC(o).total)}${o.prev?' · previsão '+br(o.prev):''}</span></button>`).join('')||'<div class="vazio">Nenhuma ordem aberta com esse filtro.</div>'}</div>
      <div class="leg">Aparecem as ordens em rascunho ou enviadas, de todos os fornecedores se tirar o filtro. Se o item já estiver na ordem, a quantidade soma.</div>`;}
    else corpo=`<div class="k" style="margin-bottom:8px">De quem comprar · homologados dos itens marcados, com o último preço</div>
      <div class="fr2">${lista.map(x=>`<label class="${x.f.id===forn?'on':''}"><input type="radio" name="gf" value="${x.f.id}" ${x.f.id===forn?'checked':''} hidden><span class="rd"></span><span><b>${esc(x.f.nome)}</b><small>homologado em ${x.n} de ${ks.length} ${ks.length>1?'itens':'item'}</small></span><b>${x.tot?rs(x.tot):'—'}</b></label>`).join('')||'<div class="aviso">Nenhum fornecedor homologado para estes itens. Escolha qualquer um:</div>'}
      ${!lista.length?(DB.fornecedores.length?`<select id="gF" style="width:100%">${DB.fornecedores.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select>`:'<div class="k">Nenhum fornecedor cadastrado em Compras ainda.</div>'):''}</div>
      <div style="display:grid;gap:10px;margin-top:14px"><button class="btn pri" id="gNova" style="height:44px;justify-content:center">＋ Gerar nova ordem</button><button class="btn" id="gEx" style="height:44px;justify-content:center">Incluir em ordem existente</button></div>`;
    gaveta(`<div class="gt"><h2>Gerar OC</h2><button class="btn sm" id="gX" style="margin-left:auto">Fechar ✕</button></div><div class="gc"><p class="k" style="margin-bottom:10px">${ks.length} ${ks.length>1?'itens':'item'}: ${itensTxt}</p>${corpo}</div>
      ${modo==='exist'?'<div class="gr"><button class="btn" id="gVolta">‹ Voltar</button></div>':''}`);
    $('gX').onclick=()=>gaveta(null);
    document.querySelectorAll('input[name=gf]').forEach(r=>r.closest('label').onclick=()=>{forn=r.value;des();});
    if($('gF'))$('gF').onchange=e=>{forn=e.target.value;};if($('gF')&&!forn)forn=$('gF').value;
    if($('gNova'))$('gNova').onclick=()=>{const f=fornPorId(forn||($('gF')&&$('gF').value));if(!f)return toast('Escolha o fornecedor.',true);
      const itens=ks.map(k=>itemNovo(k,f,+NEC.sel[k],null)).filter(Boolean);NEC.sel={};gaveta(null);
      novaOC({forn:{...f},prev:addDias(hojeY(),7),itens,origem:'Necessidade de compra · '+br(hojeY()),marcadores:DB.marcadores.some(m=>m.nome==='reposição')?['reposição']:[],
        pag:{cond:f.prazo||'28',forma:DB.cfg.formaPadrao||'Boleto',categoria:'',parcelas:[]}});};
    if($('gEx'))$('gEx').onclick=()=>{modo='exist';des();};if($('gVolta'))$('gVolta').onclick=()=>{modo='';des();};
    if($('gq'))$('gq').oninput=e=>{NEC.qoc=e.target.value;clearTimeout(window._tg);window._tg=setTimeout(()=>{des();const i=$('gq');i.focus();i.setSelectionRange(i.value.length,i.value.length);},250);};
    if($('gSoF'))$('gSoF').onchange=e=>{NEC.soF=e.target.checked;des();};
    document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const o=DB.ocs.find(x=>x.id===b.dataset.inc);if(!o)return;
      ks.forEach(k=>{const it=(o.itens||[]).find(i=>i.sku===k);const q=+NEC.sel[k];
        if(it){if(it.modo==='cx'&&+it.cx>0){it.qtdCx=Math.ceil(((+it.qtd||0)+q)/it.cx);it.qtd=r3(it.qtdCx*it.cx);}else it.qtd=r3((+it.qtd||0)+q);}
        else{const n=itemNovo(k,o.forn,q,null);if(n)o.itens.push(n);}});
      (o.hist=o.hist||[]).push({em:new Date().toISOString(),quem:(N.usuario&&N.usuario().nome)||'',o:'Itens incluídos pela necessidade de compra'});
      if(o.sit==='ras'&&typeof gerarParcelas==='function')try{gerarParcelas(o,o.pag.cond);}catch(e){}
      NEC.sel={};salvar();gaveta(null);toast(`Itens incluídos na ordem ${o.num}.`);abrirOC(o.id);});
  };
  des();
}

/* =====================================================================
   CONSUMO E VENDA · por produto ou insumo, com busca e período
   ===================================================================== */
const CON={ver:'prod',q:'',per:null,por:'mes'};
async function telaConsumo(){
  const c=necCfg();if(!CON.per){CON.per=perNovo('int');CON.per.de=mesesAtras(5)+'-01';CON.per.ate=hojeY();CON.per.campo=c.nCampo;}
  if(!NDADOS.abertos){$('app').innerHTML='<div class="vazio">Lendo pedidos…</div>';await necCarregar();}
  const fx=perFaixa(CON.per);const de=fx.de||mesesAtras(12)+'-01',ate=fx.ate||hojeY();
  const meses=[];{let d=new Date(de.slice(0,7)+'-15T12:00');while(ymd(d).slice(0,7)<=ate.slice(0,7)){meses.push(ymd(d).slice(0,7));d.setMonth(d.getMonth()+1);}}
  const q=(CON.q||'').toLowerCase();let linhas=[];
  if(CON.ver==='prod'){const prods=N.produtos();
    linhas=prods.filter(p=>!q||(p.codigo+' '+p.descricao).toLowerCase().includes(q)).map(p=>({k:p.codigo,n:p.descricao,un:'cx',v:meses.map(m=>(NDADOS.mes[m]||{})[p.codigo]||0)})).filter(l=>l.v.some(x=>x));}
  else{const CM=necConsumoMeses();linhas=N.insumos().filter(x=>!q||(x.sku+' '+x.nome).toLowerCase().includes(q)).map(x=>({k:x.sku,n:x.nome,un:unDe(x),v:meses.map(m=>(CM[m]||{})[x.sku]||0)})).filter(l=>l.v.some(x=>x));}
  const mAt=hojeY().slice(0,7),diaHj=+hojeY().slice(8),dm=diasDoMes(mAt);
  const proj=(l,i)=>meses[i]===mAt?l.v[i]/diaHj*dm:l.v[i];
  const tend=l=>{const n=meses.length;if(n<2)return null;const a=proj(l,n-1),b=proj(l,n-2);return b?(a/b-1)*100:null;};
  const tot=meses.map((m,i)=>linhas.reduce((s,l)=>s+l.v[i],0));const nm=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  $('app').innerHTML=`<div class="migalha">Compras › Consumo e venda</div><div class="topo"><h1>Consumo e venda</h1><span class="salvo"></span></div>
  <div class="barra"><span class="seg"><button data-cv="ins" class="${CON.ver==='ins'?'on':''}">Insumos</button><button data-cv="prod" class="${CON.ver==='prod'?'on':''}">Produtos</button></span>
    <div class="busca">⌕<input id="cq" placeholder="Escreva o produto ou insumo · ex.: amaciante" value="${esc(CON.q)}"></div>${perBotao('cPer',CON.per)}</div>
  <div class="caixa rolx">${linhas.length?`<table class="ntb"><thead><tr><th>${CON.ver==='prod'?'Produto':'Insumo'}</th>${meses.map(m=>`<th class="n">${nm[+m.slice(5)-1]}${m===mAt?'*':''}</th>`).join('')}<th class="n">Média/mês</th><th class="n">Tendência</th></tr></thead><tbody>
    ${linhas.map(l=>{const t=tend(l);const md=l.v.reduce((s,x)=>s+x,0)/meses.length;return `<tr><td><b>${esc(l.n)}</b><span class="s">${esc(l.k)} · ${l.un}</span></td>${l.v.map(x=>`<td class="n">${x?necFmt(x):'—'}</td>`).join('')}<td class="n"><b>${necFmt(md)}</b></td><td class="n" style="color:${t==null?'inherit':t>=0?'var(--ok)':'var(--danger)'}">${t==null?'—':(t>=0?'+':'')+nq(Math.round(t))+'%'}</td></tr>`;}).join('')}
    ${linhas.length>1?`<tr class="tot"><td><b>Soma${CON.q?' de “'+esc(CON.q)+'”':''}</b></td>${tot.map(x=>`<td class="n"><b>${necFmt(x)}</b></td>`).join('')}<td class="n"><b>${necFmt(tot.reduce((s,x)=>s+x,0)/meses.length)}</b></td><td></td></tr>`:''}</tbody></table>`
    :`<div class="vazio">${NDADOS.fonte==='ops'&&CON.ver==='prod'?'Ainda não há pedidos de venda no ERP. Faça a carga do Tiny em Configurações › Carga do Tiny.':'Nada com essa busca no período.'}</div>`}</div>
  <div class="leg">Em <b>Produtos</b>, as caixas vendidas; em <b>Insumos</b>, o consumo calculado pela fórmula (ou pelas OPs, sem histórico de vendas). * mês em curso: a tendência usa a projeção até o fim do mês.</div>`;
  document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{CON.ver=b.dataset.cv;telaConsumo();});
  $('cq').oninput=e=>{CON.q=e.target.value;clearTimeout(window._tc);window._tc=setTimeout(()=>{telaConsumo();const i=$('cq');i.focus();i.setSelectionRange(i.value.length,i.value.length);},300);};
  $('cPer').onclick=ev=>{ev.stopPropagation();abrirPeriodo(ev.currentTarget,CON.per,{campos:[['pedido','Data do pedido'],['faturamento','Data do faturamento'],['prevista','Data prevista']]},st=>{CON.per=st;if(st.campo&&st.campo!==necCfg().nCampo){necCfg().nCampo=st.campo;salvar();NDADOS.abertos=null;}telaConsumo();});};
}

    $('bNovaCot').onclick=()=>{DB.cotSeq++;const c={id:uid(),num:'COT-'+String(DB.cotSeq).padStart(4,'0'),nome:'Nova cotação',data:hojeY(),

    document.querySelectorAll('[data-cot]').forEach(r=>r.onclick=()=>ir('cotacoes',r.dataset.cot));

function telaMapa(id){
  const c=DB.cotacoes.find(x=>x.id===id);
  if(!c)return ir('cotacoes');
  const ed=c.sit!=='concluida';
  const cel=(it,f)=>+((c.precos||{})[it.sku+'|'+f.id]||0);
  const melhor=it=>{const v=c.forns.map(f=>cel(it,f)).filter(p=>p>0);return v.length?Math.min(...v):0;};
  /* escolha que o usuário não fez: fica no menor preço */

function telaPrecos(){

    <div><div class="caixa" style="margin-bottom:14px"><h3>${esc(it.nome)} <span style="font-size:11px;color:var(--ink3);font-weight:400">${esc(it.sku)}</span></h3>

      ${linhas.map(p=>{const uc=ultimaCompra(COT.item,p.forn);const ok=valida(p);return `<tr style="${best&&p===best?'background:#F4FBF6':''}${ok?'':';color:var(--ink3)'}">

    <tr><td><b>Total</b></td><td class="n"><b>${l.length}</b></td><td class="n"><b>${nf(tot,2)}</b></td><td></td><td></td></tr></tbody></table>`
    :'<div class="vazio">Nenhuma ordem enviada no período.</div>'}</div>

/* item para uma ordem nova, já com o nome no fornecedor e a caixa do vínculo */
function itemNovo(sku,forn,qtd,preco){
  const x=insumo(sku);if(!x)return null;const fid=forn&&forn.id;
  const imp=DB.imp[sku]||{},mp=melhorPreco(sku,fid)||melhorPreco(sku),uc=ultimaCompra(sku,fid)||ultimaCompra(sku);
  const it={sku,nome:x.nome,tiny:x.tiny||'',un:unDoItem(x),tipo:x.tipo,qtd:+qtd||0,qtdCx:0,cx:0,modo:'un',preco:preco!=null?+preco:(mp?mp.preco:(uc?uc.preco:0)),
    icms:imp.icms||0,ipi:imp.ipi||0,pis:imp.pis??1.65,cof:imp.cof??7.6,cr:imp.cr||{...CRED_PADRAO},nomeForn:'',codForn:''};
  const v=vinculo(fid,sku);
  if(v){if(v.nome)it.nomeForn=v.nome;if(v.cod)it.codForn=v.cod;if(v.modo==='cx'&&+v.cx>0){it.modo='cx';it.cx=+v.cx;it.qtdCx=Math.ceil(it.qtd/it.cx);it.qtd=r3(it.qtdCx*it.cx);}}
  return it;
}

/* =====================================================================
   IMPORTAR OCs DO TINY (planilha exportada em Suprimentos › Ordens de compra)
   Cada OC vem com o número do Tiny, fornecedor, datas e itens. O item vem
   só com o nome: casa com o insumo pelo nome, e o que não casar a pessoa
   escolhe na conferência. OC que já foi importada (mesmo número) fica de fora.
   ===================================================================== */
const nImp=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const dmyY=s=>{if(typeof s==='number'&&s>20000){const d=new Date(Math.round((s-25569)*864e5));return d.toISOString().slice(0,10);}s=String(s||'').trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:'';};
function insPorNomeImp(nome){
  const k=nImp(nome),l=N?N.insumos():[];
  return l.find(x=>nImp(x.nome)===k)||l.find(x=>nImp(x.nome).startsWith(k)||k.startsWith(nImp(x.nome)))||null;
}
async function importarOCsTiny(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.xls,.xlsx,.csv';
  inp.onchange=async()=>{
    const arq=inp.files&&inp.files[0];if(!arq)return;
    try{await carregaScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}catch(e){return toast('Não consegui abrir o leitor de planilha.',true);}
    let rows;
    try{const wb=window.XLSX.read(await arq.arrayBuffer(),{type:'array'});rows=window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});}
    catch(e){return toast('Não consegui ler a planilha: '+e.message,true);}
    conferirOCsTiny(rows,arq.name);
  };
  inp.click();
}
function lerOCsTiny(rows){
  const cab=(rows[0]||[]).map(nImp),col=re=>cab.findIndex(c=>re.test(c));
  const C={num:col(/^ordem de compra/),nf:col(/^n.*no fornecedor/),data:col(/^data$/),prev:col(/^data prevista/),forn:col(/^fornecedor$/),
    item:col(/^item$/),qtd:col(/^quantidade/),val:col(/^valor produto/),desc:col(/^desconto/),frete:col(/^frete/),ipi:col(/^valor ipi/),tot:col(/^total/)};
  if(C.num<0||C.item<0||C.qtd<0)throw new Error('a planilha não tem as colunas da exportação de ordens de compra do Tiny');
  const num=v=>{if(typeof v==='number')return v;const s=String(v||'').replace(/\./g,'').replace(',','.');return +s||0;};
  const ocs=new Map();
  rows.slice(1).forEach(r=>{const n=String(r[C.num]||'').trim();if(!n)return;
    const o=ocs.get(n)||{num:n,data:dmyY(r[C.data]),prev:dmyY(r[C.prev]),forn:String(r[C.forn]||'').trim(),numForn:C.nf>=0?String(r[C.nf]||'').replace(/^-$/,'').trim():'',itens:[],frete:0,desc:0};
    const q=num(r[C.qtd]),v=num(r[C.val]);
    o.itens.push({nome:String(r[C.item]||'').trim(),qtd:q,valor:v,preco:q?v/q:0,ipi:num(r[C.ipi]),total:num(r[C.tot])});
    o.frete+=num(r[C.frete]);o.desc+=num(r[C.desc]);ocs.set(n,o);});
  return [...ocs.values()];
}
function conferirOCsTiny(rows,nome){
  let l;try{l=lerOCsTiny(rows);}catch(e){return toast(e.message,true);}
  const ja=new Set(DB.ocs.filter(o=>o.origem==='Tiny'||o.numTiny).map(o=>String(o.numTiny||o.num)));
  l.forEach(o=>{o.ja=ja.has(o.num);o.itens.forEach(i=>{const x=insPorNomeImp(i.nome);i.sku=x?x.sku:'';});});
  const novas=l.filter(o=>!o.ja),semCasa=novas.reduce((a,o)=>a+o.itens.filter(i=>!i.sku).length,0);
  const ins=(N?N.insumos():[]).slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const opt=sel=>`<option value="">— escolha o insumo —</option>`+ins.map(x=>`<option value="${esc(x.sku)}" ${x.sku===sel?'selected':''}>${esc(x.nome)}</option>`).join('');
  gaveta(`<div class="gt"><h2>Importar OCs do Tiny</h2><button class="btn sm" id="gX" style="margin-left:auto">Fechar ✕</button></div>
    <p class="k">${esc(nome||'')} · ${l.length} OC(s) na planilha · <b>${novas.length} para importar</b>${l.length-novas.length?` · ${l.length-novas.length} já estão no ERP`:''}${semCasa?` · <b style="color:#B3261E">${semCasa} item(ns) para escolher</b>`:''}</p>
    ${l.map((o,oi)=>`<div class="caixa" style="padding:10px 12px;margin-top:10px;${o.ja?'opacity:.55':''}">
      <div style="display:flex;gap:8px;align-items:baseline"><b>OC ${esc(o.num)}</b><span>${esc(o.forn)}</span><span class="k" style="margin-left:auto">${o.data?br(o.data):''}${o.prev?' · prevista '+br(o.prev):' · sem previsão'}${o.ja?' · já importada':''}</span></div>
      <table class="tv" style="margin-top:6px"><tbody>${o.itens.map((i,ii)=>`<tr><td>${esc(i.nome)}</td><td class="n">${nf(i.qtd)}</td><td class="n">R$ ${nf(i.valor,2)}</td>
        <td>${o.ja?'':i.sku&&insumo(i.sku)&&nImp(insumo(i.sku).nome)===nImp(i.nome)?`<span class="k">✓ ${esc(insumo(i.sku).nome)}</span>`:`<select data-oi="${oi}" data-ii="${ii}" style="max-width:260px">${opt(i.sku)}</select>`}</td></tr>`).join('')}</tbody></table></div>`).join('')}
    <div class="gr"><button class="btn" id="gC">Cancelar</button><button class="btn pri" id="gOk" ${novas.length?'':'disabled'}>Importar ${novas.length} OC(s)</button></div>`);
  $('gX').onclick=$('gC').onclick=()=>gaveta(null);
  document.querySelectorAll('[data-oi]').forEach(s=>s.onchange=()=>{l[+s.dataset.oi].itens[+s.dataset.ii].sku=s.value;});
  $('gOk').onclick=()=>{
    const falta=novas.flatMap(o=>o.itens.filter(i=>!i.sku));
    if(falta.length&&!confirm(`${falta.length} item(ns) sem insumo escolhido ficam de fora das OCs. Importar assim mesmo?`))return;
    let n=0,it=0;
    novas.forEach(o=>{
      let f=DB.fornecedores.find(x=>nImp(x.nome)===nImp(o.forn));
      if(!f){f={id:uid(),nome:o.forn};DB.fornecedores.push(f);}
      const oc=Object.assign(ocVazia(),{num:o.num,numTiny:o.num,data:o.data||hojeY(),prev:o.prev||'',sit:'env',forn:{...f},origem:'Tiny',nf:'',
        obsInt:[o.numForn?'Nº no fornecedor: '+o.numForn:'',o.desc?'Desconto no Tiny: R$ '+nf(o.desc,2):''].filter(Boolean).join(' · ')});
      o.itens.filter(i=>i.sku).forEach(i=>{const x=itemNovo(i.sku,f,i.qtd,i.preco);if(!x)return;
        if(i.valor&&i.ipi)x.ipi=Math.round(i.ipi/i.valor*10000)/100;oc.itens.push(x);it++;});
      if(o.frete)oc.frete.valor=Math.round(o.frete*100)/100;
      try{oc.pag.categoria=categoriaSugerida(oc);}catch(e){}
      try{gerarParcelas(oc,oc.pag.cond);}catch(e){}
      hist(oc,'Importada do Tiny',`OC ${o.num} · ${o.itens.length} item(ns) na planilha`);
      DB.ocs.push(oc);n++;});
    DB.seq=Math.max(DB.seq||0,...DB.ocs.map(x=>+x.num||0));
    salvar();gaveta(null);render();
    try{N.logCarga&&N.logCarga('Ordens de compra',{lidos:l.length,novos:n,falhas:falta.length,det:`planilha ${nome||''} · ${it} itens`});}catch(e){}
    toast(`${n} OC(s) importadas do Tiny${falta.length?` · ${falta.length} item(ns) ficaram de fora`:''}.`);
  };
}

/* =====================================================================
   OCs DO TINY PELA API v3: abertas e em andamento, com itens, fornecedor,
   datas, frete, desconto, observações, categoria e as PARCELAS (vencimento,
   valor e meio de pagamento). Item casa pelo código do Tiny, depois pelo SKU,
   depois pelo nome. OC que já está no ERP (mesmo número) é atualizada se ainda
   não recebeu nada; recebida não é tocada.
   ===================================================================== */
const MEIO_V3={'1':'Dinheiro','2':'Cheque','3':'Cartão de crédito','4':'Cartão de débito','14':'Duplicata','15':'Boleto','16':'Depósito','17':'Pix','18':'Transferência','20':'Pix','99':'Outros','90':'Sem pagamento'};
function insumoDoTiny(p){
  const l=N?N.insumos():[];if(!p)return null;
  return l.find(x=>p.id&&String(x.tiny||'')===String(p.id))||l.find(x=>p.sku&&String(x.sku)===String(p.sku))||(p.descricao?insPorNomeImp(p.descricao):null);
}
function fornDoContatoTiny(c){
  if(!c)return null;const doc=String(c.cpfCnpj||'').replace(/\D/g,'');
  let f=DB.fornecedores.find(x=>c.id&&String(x.tinyId||'')===String(c.id))||DB.fornecedores.find(x=>doc&&String(x.cnpj||'').replace(/\D/g,'')===doc)||DB.fornecedores.find(x=>nImp(x.nome)===nImp(c.nome));
  const e=c.endereco||{};
  const d={tinyId:c.id?String(c.id):'',nome:c.nome||'',cnpj:c.cpfCnpj||'',ie:c.inscricaoEstadual||'',email:c.email||'',fone:c.telefone||c.celular||'',
    end:[e.endereco,e.numero,e.complemento,e.bairro].filter(Boolean).join(', '),cidade:e.municipio||'',uf:e.uf||'',cep:e.cep||''};
  if(f)Object.keys(d).forEach(k=>{if(d[k]&&!f[k])f[k]=d[k];});else{f={id:uid(),...d};DB.fornecedores.push(f);}
  return f;
}
function ocDoTiny(t,velha){
  const forn=fornDoContatoTiny(t.contato)||{id:uid(),nome:'(sem fornecedor)'};
  const oc=velha||ocVazia();
  const semV=[];
  oc.num=String(t.numeroPedido||t.id||oc.num);oc.numTiny=oc.num;oc.tinyOcId=t.id;oc.origem='Tiny';
  oc.data=String(t.data||oc.data||hojeY()).slice(0,10);oc.prev=String(t.dataPrevista||'').slice(0,10);
  oc.sit=String(t.situacao)==='2'?'can':'env';
  oc.forn={...forn};
  oc.itens=[];
  (t.itens||[]).forEach(i=>{const x=insumoDoTiny(i.produto);
    if(!x){semV.push(`${(i.produto&&i.produto.descricao)||'?'} (${nf(+i.quantidade||0)})`);return;}
    const it=itemNovo(x.sku,forn,+i.quantidade||0,+i.preco||0);if(!it)return;it.ipi=+i.ipi||0;oc.itens.push(it);});
  oc.frete=oc.frete||{};oc.frete.valor=+t.frete||0;
  if(t.fretePorConta)oc.frete.tipo=['D','4'].includes(String(t.fretePorConta))?'FOB':'CIF';
  oc.pag=oc.pag||{};
  if(t.categoria&&t.categoria.nome)oc.pag.categoria=t.categoria.nome;
  const parc=(t.parcelas||[]).map(p=>({d:+p.dias||0,valor:+p.valor||0,forma:MEIO_V3[String(p.meioPagamento)]||oc.pag.forma||'Boleto',obs:p.observacoes||'',tiny:null,venc:String(p.dataVencimento||'').slice(0,10)}));
  if(parc.length){oc.pag.parcelas=parc;oc.pag.cond=parc.map(p=>p.d).join('/');oc.pag.forma=parc[0].forma;}
  else{try{gerarParcelas(oc,oc.pag.cond||'28');}catch(e){}}
  oc.obs=t.observacoes||oc.obs||'';
  oc.obsInt=[t.observacoesInternas||'',+String(t.desconto||0).replace(',','.')?`Desconto no Tiny: R$ ${nf(+String(t.desconto).replace(',','.'),2)}`:'',
    t.notaFiscal&&t.notaFiscal.numero?`NF ${t.notaFiscal.numero}`:'',semV.length?`Itens do Tiny sem cadastro no ERP: ${semV.join('; ')}`:''].filter(Boolean).join(' · ');
  hist(oc,velha?'Atualizada do Tiny (API)':'Trazida do Tiny (API)',`OC ${oc.num} · ${oc.itens.length} item(ns)${semV.length?` · ${semV.length} sem cadastro`:''}${parc.length?` · ${parc.length} parcela(s)`:''}`);
  return {oc,semV:semV.length};
}
async function importarOCsTinyAPI(){
  if(N.teste)return toast('Na versão de teste não há Tiny.',true);
  const b=$('bImpA');const msg=t=>{if(b)b.textContent=t;};

    const l=(await N.tiny({acao:'ocs_v3_lista',situacoes:[0,3]})).ocs||[];
    let novas=0,atual=0,pulei=0,semV=0,fal=0;

  document.querySelectorAll('[data-ha]').forEach(b=>b.onclick=()=>{HOM.aba=b.dataset.ha;telaHomologacao();});
  if($('hF'))buscaLista($('hF'),q=>DB.fornecedores.filter(f=>(f.nome+' '+(f.cnpj||'')).toLowerCase().includes(q)).slice(0,12).map(f=>({t:f.nome,s:f.cnpj||'',v:f})),f=>{HOM.forn=f.id;telaHomologacao();});
  if($('hNovo'))$('hNovo').onclick=()=>formForn(null,f=>{HOM.forn=f.id;telaHomologacao();});
  if($('hI'))buscaLista($('hI'),q=>(N?N.insumos():[]).filter(i=>(i.sku+' '+i.nome).toLowerCase().includes(q)).slice(0,12).map(i=>({t:i.nome,s:i.sku+' · '+i.tipo,v:i})),i=>{HOM.item=i.sku;telaHomologacao();});
  document.querySelectorAll('[data-hv]').forEach(el=>el.onchange=()=>{const v=vinculo(HOM.forn,el.dataset.hv),k=el.dataset.k;v[k]=k==='cx'?Math.round(num(el.value)):el.value.trim();
    if(k==='modo'&&el.value==='un')v.cx=0;if(k==='sit'&&el.value==='h')v.desde=hojeY();salvar();telaHomologacao();});
  document.querySelectorAll('[data-hx]').forEach(b=>b.onclick=()=>{if(!confirm('Tirar este item da homologação deste fornecedor?'))return;delete DB.vinc[chaveV(HOM.forn,b.dataset.hx)];salvar();telaHomologacao();});
  if($('hAdd'))buscaLista($('hAdd'),q=>(N?N.insumos():[]).filter(i=>!vinculo(HOM.forn,i.sku)&&(i.sku+' '+i.nome+' '+i.tipo).toLowerCase().includes(q)).slice(0,12).map(i=>({t:i.nome,s:i.sku+' · '+i.tipo,v:i})),
    i=>{garanteVinculo(HOM.forn,i.sku,{sit:'h'});salvar();telaHomologacao();});
  document.querySelectorAll('[data-hgo]').forEach(b=>b.onclick=()=>{HOM.aba='forn';HOM.forn=b.dataset.hgo;telaHomologacao();});
  if($('hLote'))$('hLote').onclick=()=>{if(!ed)return;const x=insumo(HOM.item);const pad=(DB.cfg.loteTipos||[]).includes(x.tipo)&&DB.cfg.loteLigado;
    const atual=controlaLote(x);if(!atual===pad)delete DB.lote[x.sku];else DB.lote[x.sku]=!atual;salvar();telaHomologacao();};
}

/* =====================================================================

   ===================================================================== */

  const grupos={};c.categorias.forEach(x=>(grupos[x.grupo]=grupos[x.grupo]||[]).push(x));
  $('app').innerHTML=`<div class="migalha">Configurações › Compras</div><div class="topo"><h1>Configurações de compras</h1><span class="salvo"></span></div>

  <div class="bloco"><div class="t">Empresa · sai no PDF da ordem</div><div class="c"><div class="campos">

      `<div class="cmp ${cl||''}"><label>${r}</label><input data-emp="${k}" value="${esc(e[k]||'')}" ${dis}></div>`).join('')}</div>

  <div class="bloco"><div class="t">Ordem de compra</div><div class="c">
    ${op('Próximo número','Continua a numeração do Tiny. Se alguém criar ordem direto no Tiny, acerte aqui.',`<input class="inp" style="width:120px" id="cSeq" value="${DB.seq+1}" ${dis}>`)}
    ${op('Forma de pagamento padrão','Vem preenchida em toda ordem nova. As formas são as mesmas do Tiny: '+FORMAS.join(', ')+'.',`<select class="inp" style="width:200px" id="cForma" ${dis}>${FORMAS.map(x=>`<option ${c.formaPadrao===x?'selected':''}>${x}</option>`).join('')}</select>`)}
    ${op('Linha de assinatura no PDF','Mostra a assinatura do comprador e o "de acordo" do fornecedor.',sw('assinatura',c.assinatura))}</div></div>
  <div class="bloco"><div class="t">Regras de compra</div><div class="c">
    ${op('Só comprar de fornecedores homologados','Ligada, a ordem não aceita item de fornecedor que não está homologado para ele. Desligada, o item entra como "em avaliação".',sw('soHomologados',c.soHomologados))}
    ${op('Ordem só com itens e fornecedores do cadastro','Ligada, não dá para criar fornecedor de dentro da ordem: evita cadastro novo ou duplicado.',sw('soCadastro',c.soCadastro))}</div></div>
  <div class="bloco"><div class="t">Rastreabilidade de lote · só no ERP, o Tiny recebe estoque e contas</div><div class="c">
    ${op('Controlar lote','Liga o lote e a validade no recebimento dos tipos marcados abaixo. No cadastro de cada item (Homologação › Por item) dá para abrir exceção.',sw('loteLigado',c.loteLigado))}
    <div class="cores" style="margin:6px 0 10px">${tipos.map(tp=>`<span class="tp ${(c.loteTipos||[]).includes(tp)?'on':''}" data-tp="${esc(tp)}"><i></i>${esc(tp)}</span>`).join('')}</div>
    ${op('Pedir validade junto com o lote','Para vencer primeiro o que vence antes, quando o PCP passar a escolher o lote.',sw('loteValidade',c.loteValidade))}</div></div>
  <div class="bloco"><div class="t">Categorias do Tiny <span class="dir">${ed?'<label class="btn sm" style="cursor:pointer">⤒ Importar planilha do Tiny<input type="file" id="cImp" accept=".xls,.xlsx,.csv" hidden></label>':''}</span></div><div class="c">
    <div class="dica" style="margin-bottom:10px">${c.categorias.length} categorias${c.catImportadas?' · importadas em '+esc(c.catImportadas):''}. A ordem só deixa escolher estas, para o nome chegar igual no Tiny. As de receita ficam guardadas para o financeiro e não aparecem na compra. Planilha: Finanças › Categorias › exportar.</div>
    <div class="op" style="border:0"><div><b>Categoria sugerida por tipo de item</b><small>A ordem já vem com a categoria do tipo que mais pesa no valor; dá para trocar.</small></div></div>
    <div class="mapa-cat">${tipos.map(tp=>`<label><span>${esc(tp)}</span><span class="v sel-cat ${ed?'':'dis'}" data-ct="${esc(tp)}">${esc(c.catPorTipo[tp]||'—')}<small>▾</small></span></label>`).join('')}</div>
    <div class="rolx" style="max-height:300px;overflow:auto;border:1px solid var(--line2);border-radius:10px;margin-top:12px"><table class="cat-t"><thead><tr><th>Categoria</th><th>ID no Tiny</th><th>No DRE</th></tr></thead><tbody>

    ${op('Custo do dinheiro','Usado para comparar prazos de pagamento. Não aparece nas telas de compra.',`<input class="inp" style="width:100px" id="cCd" value="${nq(c.custoDinheiro)}" ${dis}> % ao mês`)}</div></div>`;

  document.querySelectorAll('[data-tp]').forEach(s=>s.onclick=()=>{const tp=s.dataset.tp;c.loteTipos=c.loteTipos||[];const i=c.loteTipos.indexOf(tp);i>=0?c.loteTipos.splice(i,1):c.loteTipos.push(tp);salvar();telaConfig();});

  $('mAdd').onclick=()=>{const n=$('mNovo').value.trim();if(!n)return;if(DB.marcadores.some(m=>m.nome.toLowerCase()===n.toLowerCase()))return toast('Esse marcador já existe.',true);
    DB.marcadores.push({nome:n,cor:CORES_MK[DB.marcadores.length%CORES_MK.length]});salvar();telaConfig();};
  $('cVal').onchange=e=>{c.valid=Math.max(1,parseInt(e.target.value)||15);salvar();};
  $('cCd').onchange=e=>{c.custoDinheiro=num(e.target.value);salvar();};
  $('cImp').onchange=e=>importarCategorias(e.target.files[0]);
}
/* a planilha que o Tiny exporta: ID, Descrição, Grupo, Considera no DRE */
async function importarCategorias(arq){
  if(!arq)return;
  try{await carregaScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const buf=await arq.arrayBuffer();const wb=window.XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const cab=rows[0].map(x=>String(x).toLowerCase());
    const ci=k=>cab.findIndex(h=>h.includes(k));const iId=ci('id'),iN=ci('descri'),iG=ci('grupo'),iD=ci('dre');
    if(iN<0||iG<0)throw new Error('a planilha precisa das colunas Descrição e Grupo');
    const l=rows.slice(1).filter(r=>String(r[iN]).trim()).map(r=>({id:String(r[iId]||''),nome:String(r[iN]).trim(),grupo:String(r[iG]).trim(),dre:iD>=0?String(r[iD]):''}));
    if(!l.length)throw new Error('nenhuma categoria na planilha');
    const rep={};l.forEach(x=>rep[x.nome.toLowerCase()]=(rep[x.nome.toLowerCase()]||0)+1);const dup=Object.keys(rep).filter(k=>rep[k]>1);
    DB.cfg.categorias=l;DB.cfg.catImportadas=br(hojeY());salvar();telaConfig();
    toast(`${l.length} categorias importadas.`+(dup.length?` Atenção: nome repetido em mais de um grupo (${dup.join(', ')}) — renomeie no Tiny.`:''),!!dup.length);
  }catch(e){toast('Não consegui ler a planilha: '+e.message,true);}
}

/* =====================================================================
   ROTAS E INÍCIO
   ===================================================================== */
let TRANSP=[];
function render(){
  const {pag,arg}=lerHash();PAG=pag;
  if(!N){$('app').innerHTML=`<div class="vazio"><b>Abra este módulo pelo ERP.</b><br>Ele usa os insumos, os saldos e a gravação do ERP.</div>`;return;}
  if(!DB){$('app').innerHTML='<div class="vazio">Carregando…</div>';return;}
  modal(null);gaveta(null);
  if(pag==='ordens')return arg?telaOC(arg):(ED=null,telaOrdens());
  if(pag==='conferir')return telaConferir(arg);
  if(pag==='necessidade')return telaNecessidade();
  if(pag==='consumo')return telaConsumo();
  if(pag==='cotacoes')return arg?telaMapa(arg):telaCotacoes();
  if(pag==='homologacao')return telaHomologacao();
  if(pag==='relatorios')return telaRelatorios();
  if(pag==='config')return telaConfig();
  ir('ordens');
}
(async function(){
  if(!N){render();return;}
  try{DB=normaliza(await N.ler(MOD_ID));}catch(e){DB=normaliza(null);toast('Não consegui ler Compras do banco: '+e.message,true);}
  /* os contatos dos Cadastros (vindos do Tiny) também servem de fornecedor na OC */
  carregaContatosCad();
  try{const t=await N.ler('transportadores');TRANSP=(t&&t.lista)||[];}catch(e){TRANSP=[];}
  render();
})();

function totaisDe(oc,t){t=t||contaOC(oc);const it=oc.itens||[];
  return {itens:it.length,qtd:it.reduce((s,x)=>s+(+x.qtd||0),0),produtos:t.produtos,ipi:t.ipi,desconto:t.desconto||0,frete:t.frete||0,
    total:t.total};}   /* o mesmo total da nota que a OC já usa (produtos + IPI − desconto) */
function totaisReceb(o,st){const c=JSON.parse(JSON.stringify(o));
  c.itens=st.linhas.map(l=>({...l.it,qtd:+l.chegou||0})).filter(x=>x.qtd>0);return totaisDe(c,contaOC(c));}
function blocoTotais(x,n,tit,dentro){
  const cel=(lb,vl,dest)=>`<div class="tt-c${dest?' dest':''}"><span>${lb}</span><b>${vl}</b></div>`;
  const corpo=`<div class="tt-g">${cel('Nº de itens',nq(x.itens))}${cel('Soma das qtdes',nq(x.qtd))}${cel('Total dos produtos',rs(x.produtos))}${cel('Desconto',rs(x.desconto))}
    ${cel('Total do IPI',rs(x.ipi))}${cel('Frete',rs(x.frete))}${cel('',' ')}${cel('Total geral',rs(x.total),true)}</div>`;
