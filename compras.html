</style>`);

const RL5={de:null,ate:null,forn:'',sku:'',q:'',sit:'tudo',base:'ordem',grupo:'forn',ord:'valor',aberto:new Set()};
function rl5Mes(d,mais){const x=new Date(d.getFullYear(),d.getMonth()+(mais||0),1);return x;}
function rl5Y(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function rl5Periodo(k){const h=new Date();
  if(k==='mes')return [rl5Y(rl5Mes(h)),rl5Y(new Date(h.getFullYear(),h.getMonth()+1,0))];
  if(k==='ant')return [rl5Y(rl5Mes(h,-1)),rl5Y(new Date(h.getFullYear(),h.getMonth(),0))];
  if(k==='3m')return [rl5Y(rl5Mes(h,-2)),rl5Y(new Date(h.getFullYear(),h.getMonth()+1,0))];
  if(k==='ano')return [h.getFullYear()+'-01-01',h.getFullYear()+'-12-31'];
}
if(!RL5.de){const p=rl5Periodo('mes');RL5.de=p[0];RL5.ate=p[1];}

/* uma linha por item de cada ordem, com valor, IPI, situação e data de chegada */
function rl5Linhas(){
  const out=[];
  (DB.ocs||[]).forEach(o=>{
    if(!o||o.sit==='can'||o.sit==='ras')return;
    const rb=(o.receb||[]).filter(r=>!r.estornado&&r.data).map(r=>r.data).sort();
    const chegou=o.sit==='rec'||o.sit==='con';
    const dChe=chegou?(rb[rb.length-1]||o.dataReceb||o.data):'';
    const nfs=[...new Set((o.receb||[]).filter(r=>!r.estornado&&r.nf).map(r=>String(r.nf).replace(/^0+/,'')))].join(', ')||(o.nf&&o.nf.numero)||'';
    const d=RL5.base==='chegada'?dChe:o.data;
    if(!d||d<RL5.de||d>RL5.ate)return;
    if(RL5.sit==='chegou'&&!chegou)return;if(RL5.sit==='caminho'&&chegou)return;
    (o.itens||[]).forEach(i=>{
      const q=+i.qtd||0;if(!q&&!(+i.preco))return;
      let c;try{c=contaItem(i);}catch(e){c={base:q*(+i.preco||0),val:{ipi:0},credito:0};}
      out.push({o,i,id:o.id,num:o.num,data:d,dataOC:o.data,dChe,nfs,chegou,sit:o.sit,
        forn:(o.forn&&o.forn.id)||((o.forn&&o.forn.nome)||'?'),fNome:(o.forn&&o.forn.nome)||'?',
        sku:i.sku||'',nome:i.nome||i.sku||'?',un:i.un||'',q,preco:+i.preco||0,
        v:c.base||0,ipi:(c.val&&c.val.ipi)||0,cred:c.credito||0,saldo:!!o.saldoDe,parcial:!!o.saldoOC});
    });
  });
  return out;
}
function rl5Soma(l){const s={q:0,v:0,ipi:0,cred:0,ocs:new Set(),chegou:0,caminho:0,vCam:0,min:Infinity,max:0,itens:new Set(),forns:new Set()};
  l.forEach(x=>{s.q+=x.q;s.v+=x.v;s.ipi+=x.ipi;s.cred+=x.cred;s.ocs.add(x.id);s.itens.add(x.sku);s.forns.add(x.forn);
    if(x.chegou)s.chegou+=x.q;else{s.caminho+=x.q;s.vCam+=x.v+x.ipi;}
    if(x.preco>0){s.min=Math.min(s.min,x.preco);s.max=Math.max(s.max,x.preco);}});
  s.pm=s.q?s.v/s.q:0;if(s.min===Infinity)s.min=0;return s;}
function rl5Agrupa(l,chave){const m=new Map();l.forEach(x=>{const k=x[chave];if(!m.has(k))m.set(k,[]);m.get(k).push(x);});
  return [...m.entries()].map(([k,ls])=>({k,ls,s:rl5Soma(ls),nome:chave==='forn'?ls[0].fNome:ls[0].nome,sku:ls[0].sku,un:ls[0].un}));}
function rl5Ordena(g){const o=RL5.ord;
  return g.sort((a,b)=>o==='qtd'?b.s.q-a.s.q:o==='ocs'?b.s.ocs.size-a.s.ocs.size:o==='nome'?String(a.nome).localeCompare(String(b.nome),'pt'):(b.s.v+b.s.ipi)-(a.s.v+a.s.ipi));}
const rl5P=v=>nf(v,v>0&&v<1?4:v<10?3:2);
const rl5Q=v=>nf(v,Math.abs(v-Math.round(v))>1e-6?3:0);

function telaRelatorios(){
  const todas=rl5Linhas();
  /* opções dos filtros: só quem aparece no período */
  const fOps=rl5Agrupa(todas,'forn').sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt'));
  if(RL5.forn&&!fOps.some(f=>f.k===RL5.forn)&&!(DB.fornecedores||[]).some(f=>f.id===RL5.forn))RL5.forn='';
  const doF=RL5.forn?todas.filter(x=>x.forn===RL5.forn):todas;
  const iOps=rl5Agrupa(doF,'sku').sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt'));
  if(RL5.sku&&!iOps.some(i=>i.k===RL5.sku))RL5.sku='';
  let l=RL5.sku?doF.filter(x=>x.sku===RL5.sku):doF;
  const k=RL5.q.trim().toLowerCase();if(k)l=l.filter(x=>(x.nome+' '+x.sku+' '+x.fNome+' '+x.num).toLowerCase().includes(k));
  const S=rl5Soma(l),totV=S.v+S.ipi;
  const grupo=RL5.forn?'item':RL5.grupo;
  const fNome=RL5.forn?((fOps.find(f=>f.k===RL5.forn)||{}).nome||((DB.fornecedores||[]).find(f=>f.id===RL5.forn)||{}).nome||''):'';
  const perTxt=`${br(RL5.de)} a ${br(RL5.ate)}`;
  const sel=(v,a)=>v===a?'on':'';
  const subLinhas=ls=>ls.sort((a,b)=>String(b.data).localeCompare(String(a.data))||(+b.num-+a.num)).map(x=>`<tr class="sub">
      <td>${br(x.data)} · <a data-r5oc="${esc(x.id)}">OC ${esc(x.num)}</a>${grupo==='item'&&!RL5.forn?' · '+esc(x.fNome):''}${grupo==='forn'||RL5.forn?'':''}${x.saldo?' <span class="pill p-par">saldo</span>':''}${x.parcial?' <span class="pill p-par">entrega parcial</span>':''}</td>
      <td class="n">${rl5Q(x.q)} ${esc(x.un)}</td><td class="n">${rl5P(x.preco)}</td><td class="n">—</td>
      <td class="n">${nf(x.v,2)}</td><td class="n">${nf(x.v+x.ipi,2)}</td>
      <td>${x.chegou?`<span class="r5ok">chegou ${br(x.dChe)}</span>${x.nfs?' · NF '+esc(x.nfs):''}`:`<span class="${x.o.prev&&x.o.prev<hojeY()?'r5atr':'r5cam'}">${x.o.prev&&x.o.prev<hojeY()?'atrasada':'a caminho'}${x.o.prev?' · prev. '+br(x.o.prev):''}</span>`}</td></tr>`).join('');
  let corpo='';
  if(grupo==='item'||grupo==='itemTodos'){
    const g=rl5Ordena(rl5Agrupa(l,'sku'));
    corpo=`<table class="r5t"><thead><tr><th>Item</th><th class="n">Qtde comprada</th><th class="n">Preço médio</th><th class="n">Menor · maior</th><th class="n">Valor produtos</th><th class="n">Valor com IPI</th><th>Chegada</th></tr></thead><tbody>
    ${g.map(x=>{const ab=RL5.aberto.has('i|'+x.k),p=totV?(x.s.v+x.s.ipi)/totV*100:0;return `<tr class="g ${ab?'ab':''}" data-r5g="i|${esc(x.k)}">
      <td><b>${esc(x.nome)}</b><small>${esc(x.sku)} · ${x.s.ocs.size} ordem(ns)${!RL5.forn&&x.s.forns.size>1?' · '+x.s.forns.size+' fornecedores':''}</small><div class="bar"><i style="width:${Math.max(1,p).toFixed(1)}%"></i></div></td>
      <td class="n"><b>${rl5Q(x.s.q)}</b> ${esc(x.un)}</td><td class="n">${rl5P(x.s.pm)}</td>
      <td class="n">${x.s.min===x.s.max?rl5P(x.s.min):rl5P(x.s.min)+' · '+rl5P(x.s.max)}</td>
      <td class="n">${nf(x.s.v,2)}</td><td class="n"><b>${nf(x.s.v+x.s.ipi,2)}</b><small>${nf(p,1)}% do total</small></td>
      <td>${x.s.caminho?`<span class="r5ok">${rl5Q(x.s.chegou)} chegou</span><small class="r5cam">${rl5Q(x.s.caminho)} a caminho</small>`:'<span class="r5ok">tudo chegou</span>'}</td></tr>
      ${ab?subLinhas(x.ls):''}`;}).join('')}
    <tr class="tot"><td>Total · ${g.length} item(ns)</td><td class="n">—</td><td></td><td></td><td class="n">${nf(S.v,2)}</td><td class="n">${nf(totV,2)}</td><td></td></tr></tbody></table>`;
  }else{
    const g=rl5Ordena(rl5Agrupa(l,'forn'));
    corpo=`<table class="r5t"><thead><tr><th>Fornecedor</th><th class="n">Ordens</th><th class="n">Itens</th><th class="n">Valor produtos</th><th class="n">IPI</th><th class="n">Valor com IPI</th><th class="n">Créditos</th></tr></thead><tbody>
    ${g.map(x=>{const ab=RL5.aberto.has('f|'+x.k),p=totV?(x.s.v+x.s.ipi)/totV*100:0;
      const its=ab?rl5Ordena(rl5Agrupa(x.ls,'sku')):[];
      return `<tr class="g ${ab?'ab':''}" data-r5g="f|${esc(x.k)}">
      <td><b>${esc(x.nome)}</b><small>${x.s.caminho?'tem item a caminho':'tudo chegou'}</small><div class="bar"><i style="width:${Math.max(1,p).toFixed(1)}%"></i></div></td>
      <td class="n">${x.s.ocs.size}</td><td class="n">${x.s.itens.size}</td><td class="n">${nf(x.s.v,2)}</td><td class="n">${nf(x.s.ipi,2)}</td>
      <td class="n"><b>${nf(x.s.v+x.s.ipi,2)}</b><small>${nf(p,1)}% do total</small></td><td class="n">${nf(x.s.cred,2)}</td></tr>
      ${ab?its.map(y=>`<tr class="sub"><td><b style="color:var(--ink)">${esc(y.nome)}</b> <span style="color:var(--ink3)">${esc(y.sku)}</span> · <a data-r5ver="${esc(x.k)}|${esc(y.k)}">ver ordens</a></td>
        <td class="n">${y.s.ocs.size}</td><td class="n">${rl5Q(y.s.q)} ${esc(y.un)}</td><td class="n">${nf(y.s.v,2)}</td><td class="n">${nf(y.s.ipi,2)}</td>
        <td class="n">${nf(y.s.v+y.s.ipi,2)}</td><td class="n">pm ${rl5P(y.s.pm)}</td></tr>`).join(''):''}`;}).join('')}
    <tr class="tot"><td>Total · ${g.length} fornecedor(es)</td><td class="n">${S.ocs.size}</td><td class="n">${S.itens.size}</td><td class="n">${nf(S.v,2)}</td><td class="n">${nf(S.ipi,2)}</td><td class="n">${nf(totV,2)}</td><td class="n">${nf(S.cred,2)}</td></tr></tbody></table>`;
  }
  $('app').innerHTML=`<div class="migalha">Compras › Relatórios</div>
  <div class="topo"><h1>Compras do período</h1><span style="flex:1"></span>
    <button class="btn" id="r5Xls">⤓ Baixar Excel</button><button class="btn" id="r5Pdf">⎙ Imprimir / PDF</button></div>
  <div class="r5per">
    <div><label>Período</label><div class="r5s">${[['mes','Este mês'],['ant','Mês passado'],['3m','Últimos 3 meses'],['ano','Este ano']].map(([v,r])=>{const p=rl5Periodo(v);return `<button data-r5p="${v}" class="${p[0]===RL5.de&&p[1]===RL5.ate?'on':''}">${r}</button>`;}).join('')}</div></div>
    <div class="dt"><label>De</label><input class="dt-in" data-cal="1" id="rDe" value="${br(RL5.de)}"></div>
    <div class="dt"><label>Até</label><input class="dt-in" data-cal="1" id="rAte" value="${br(RL5.ate)}"></div>
    <div><label>Contar pela data</label><div class="r5s"><button data-r5b="ordem" class="${sel(RL5.base,'ordem')}">da ordem</button><button data-r5b="chegada" class="${sel(RL5.base,'chegada')}">da chegada</button></div></div>
  </div>
  <div class="r5f">
    <div><label>Fornecedor</label><select id="r5F"><option value="">Todos os fornecedores (${fOps.length})</option>${fOps.map(f=>`<option value="${esc(f.k)}" ${f.k===RL5.forn?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></div>
    <div><label>Item ${RL5.forn?'deste fornecedor':''}</label><select id="r5I"><option value="">Todos os itens (${iOps.length})</option>${iOps.map(i=>`<option value="${esc(i.k)}" ${i.k===RL5.sku?'selected':''}>${esc(i.nome)} · ${esc(i.k)}</option>`).join('')}</select></div>
    <div><label>Buscar</label><input id="r5Q" value="${esc(RL5.q)}" placeholder="nome, código ou nº da ordem"></div>
    <div><label>Ordenar por</label><select id="r5O">${[['valor','Maior valor'],['qtd','Maior quantidade'],['ocs','Mais ordens'],['nome','Nome (A a Z)']].map(([v,r])=>`<option value="${v}" ${RL5.ord===v?'selected':''}>${r}</option>`).join('')}</select></div>
    <div><label>Situação</label><div class="r5s">${[['tudo','Tudo'],['chegou','Já chegou'],['caminho','A caminho']].map(([v,r])=>`<button data-r5s="${v}" class="${sel(RL5.sit,v)}">${r}</button>`).join('')}</div></div>
    ${RL5.forn?'':`<div><label>Mostrar</label><div class="r5s"><button data-r5m="forn" class="${sel(RL5.grupo,'forn')}">Por fornecedor</button><button data-r5m="itemTodos" class="${sel(RL5.grupo,'itemTodos')}">Por item</button></div></div>`}
  </div>
  <div class="r5k">
    <div class="card"><small>Total comprado</small><b>R$ ${nf(totV,2)}</b><span>produtos ${nf(S.v,2)} · IPI ${nf(S.ipi,2)}</span></div>
    <div class="card"><small>Ordens</small><b>${S.ocs.size}</b><span>${perTxt}</span></div>
    <div class="card"><small>Itens diferentes</small><b>${S.itens.size}</b><span>${RL5.sku?'item escolhido':'no filtro'}</span></div>
    <div class="card"><small>Fornecedores</small><b>${S.forns.size}</b><span>${fNome?esc(fNome):'no filtro'}</span></div>
    <div class="card"><small>A caminho</small><b class="r5cam">R$ ${nf(S.vCam,2)}</b><span>ainda não chegou</span></div>
  </div>
  <div class="caixa" style="overflow:auto">${l.length?corpo:'<div class="vazio">Nenhuma compra nesse filtro e período.</div>'}</div>
  <div class="leg" style="margin-top:10px">Clique na linha para ver as ordens. Quantidade comprada é o que ficou em cada ordem: numa entrega parcial, a ordem fica com o que chegou e o resto vai para a ordem de saldo — nada conta duas vezes. Rascunho e cancelada não entram.</div>`;
  ligaCalendarios($('app'));
  const re=()=>telaRelatorios();
  $('rDe').onchange=e=>{RL5.de=deBR(e.target.value)||RL5.de;re();};
  $('rAte').onchange=e=>{RL5.ate=deBR(e.target.value)||RL5.ate;re();};
  document.querySelectorAll('[data-r5p]').forEach(b=>b.onclick=()=>{const p=rl5Periodo(b.dataset.r5p);RL5.de=p[0];RL5.ate=p[1];re();});
  document.querySelectorAll('[data-r5b]').forEach(b=>b.onclick=()=>{RL5.base=b.dataset.r5b;re();});
  document.querySelectorAll('[data-r5s]').forEach(b=>b.onclick=()=>{RL5.sit=b.dataset.r5s;re();});

  const fornDe=o=>(o.forn&&o.forn.id)||((o.forn&&o.forn.nome)||'?');
  function fornOps(){const m=new Map();(DB.fornecedores||[]).forEach(f=>{if(f&&f.id)m.set(f.id,f.nome||f.fantasia||f.id);});
    (DB.ocs||[]).forEach(o=>{if(o&&o.forn){const k=fornDe(o);if(!m.has(k))m.set(k,o.forn.nome||k);}});
    return [...m.entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'pt'));}
  function itemOps(forn){const m=new Map();(DB.ocs||[]).forEach(o=>{if(!o||(forn&&fornDe(o)!==forn))return;(o.itens||[]).forEach(i=>{const k=i.sku||i.nome;if(k&&!m.has(k))m.set(k,[k,i.nome||i.sku,i.sku&&i.nome?i.sku:'']);});});
    return [...m.values()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'pt'));}
  const SIT_OPS=[['todas','Todas'],['aberto','Em aberto (rascunho e enviada)'],['ras','Rascunho'],['env','Enviada ao fornecedor'],['rec','Recebida · a conferir'],['con','Concluída'],['can','Cancelada']];
  const sitPassa=(o,s)=>s==='todas'?o.sit!=='can':s==='aberto'?(o.sit==='ras'||o.sit==='env'):o.sit===s;
  const BASE_OPS=[['emissao','Data de emissão'],['prevista','Data prevista de entrega'],['chegada','Data de chegada']];

  const mudou=()=>{const b=$('q1Gerar');if(b)b.classList.add('mud');};

  /* ---------- Compras do período ---------- */
  const CP={d:{per:null,base:'emissao',sit:'todas',forn:'',sku:'',grupo:'forn',ord:'valor'},g:null,aberto:new Set()};
  function cpLinhas(G){
    const f=perFaixa(G.per),out=[];
    (DB.ocs||[]).forEach(o=>{
      if(!o||!sitPassa(o,G.sit))return;if(G.forn&&fornDe(o)!==G.forn)return;
      const rb=(o.receb||[]).filter(r=>!r.estornado&&r.data).map(r=>r.data).sort();
      const chegou=o.sit==='rec'||o.sit==='con';
      const dChe=chegou?(rb[rb.length-1]||o.dataReceb||o.data):'';
      const nfs=[...new Set((o.receb||[]).filter(r=>!r.estornado&&r.nf).map(r=>String(r.nf).replace(/^0+/,'')))].join(', ')||(o.nf&&o.nf.numero)||'';
      const d=G.base==='chegada'?dChe:G.base==='prevista'?(o.prev||''):o.data;
      if(f.de&&(!d||d<f.de||d>f.ate))return;
      (o.itens||[]).forEach(i=>{
        if(G.sku&&(i.sku||i.nome)!==G.sku)return;
        const q=+i.qtd||0;if(!q&&!(+i.preco))return;
        let c;try{c=contaItem(i);}catch(e){c={base:q*(+i.preco||0),val:{ipi:0},credito:0};}
        out.push({o,i,id:o.id,num:o.num,data:d,dataOC:o.data,dChe,nfs,chegou,sit:o.sit,
          forn:fornDe(o),fNome:(o.forn&&o.forn.nome)||'?',sku:i.sku||'',nome:i.nome||i.sku||'?',un:i.un||'',q,preco:+i.preco||0,
          v:c.base||0,ipi:(c.val&&c.val.ipi)||0,cred:c.credito||0,saldo:!!o.saldoDe,parcial:!!o.saldoOC});});});
    return out;}

        <div><label>Item</label>${cbHtml('q1I',io,D.sku,'Todos os itens')}</div>
        <div><label>Mostrar</label>${selHtml('q1M',[['forn','Por fornecedor'],['item','Por item']],D.grupo)}</div>
        <div><label>Ordenar por</label>${selHtml('q1O',[['valor','Maior valor'],['qtd','Maior quantidade'],['ocs','Mais ordens'],['nome','Nome (A a Z)']],D.ord)}</div>
        <div class="q1g"><button id="q1Gerar">Gerar</button></div>
      </div><div id="q1Res">${CP.g?'':vazioGerar()}</div>`;
    $('q1Per').onclick=()=>abrirPeriodo($('q1Per'),D.per,{},p=>{D.per=p;$('q1Per').outerHTML=perBotao('q1Per',p);telaComprasLigaPer();mudou();});
    telaComprasLigaPer();
    $('q1Base').onchange=e=>{D.base=e.target.value;mudou();};$('q1Sit').onchange=e=>{D.sit=e.target.value;mudou();};
    $('q1M').onchange=e=>{D.grupo=e.target.value;mudou();};$('q1O').onchange=e=>{D.ord=e.target.value;mudou();};
    cbLiga('q1F',fo,D.forn,'Todos os fornecedores',v=>{D.forn=v;D.sku='';const io2=itemOps(v);$('q1IW').outerHTML=cbHtml('q1I',io2,'','Todos os itens');cbLiga('q1I',io2,'','Todos os itens',x=>{D.sku=x;mudou();});mudou();});
    cbLiga('q1I',io,D.sku,'Todos os itens',v=>{D.sku=v;mudou();});
    $('q1Gerar').onclick=()=>{CP.g=JSON.parse(JSON.stringify(D));CP.aberto.clear();$('q1Gerar').classList.remove('mud');cpMostra();};
    $('r5Xls').onclick=()=>{if(!CP.g)return toast('Clique em Gerar primeiro.',true);const r=cpRes();rl5Excel(r.l,r.fNome,r.perTxt);};
    $('r5Pdf').onclick=()=>{if(!CP.g)return toast('Clique em Gerar primeiro.',true);const r=cpRes();rl5Imprimir(r.l,r.fNome,r.perTxt,r.grupo==='forn'?'forn':'itemTodos');};
    if(CP.g)cpMostra();
  }
  function telaComprasLigaPer(){const b=$('q1Per');if(b)b.onclick=()=>abrirPeriodo(b,CP.d.per,{},p=>{CP.d.per=p;b.outerHTML=perBotao('q1Per',p);telaComprasLigaPer();mudou();});}
  function cpRes(){const G=CP.g;const l=cpLinhas(G);const fo=fornOps();const fNome=G.forn?((fo.find(f=>f[0]===G.forn)||[])[1]||''):'';
    const pr=perRotulo(G.per);const perTxt=pr==='Período'?'todo o período':pr;return {l,fNome,perTxt,grupo:G.forn&&G.grupo==='forn'?'item':G.grupo};}
  function cpMostra(){
    const G=CP.g;const {l,fNome,perTxt,grupo}=cpRes();RL5.ord=G.ord;
    const S=rl5Soma(l),totV=S.v+S.ipi;
    const sitTxt=x=>x.chegou?`<span class="r5ok">chegou ${br(x.dChe)}</span>${x.nfs?' · NF '+esc(x.nfs):''}`:x.sit==='ras'?'<span>rascunho</span>':x.sit==='can'?'<span>cancelada</span>':`<span class="${x.o.prev&&x.o.prev<hojeY()?'r5atr':'r5cam'}">${x.o.prev&&x.o.prev<hojeY()?'atrasada':'a caminho'}${x.o.prev?' · prev. '+br(x.o.prev):''}</span>`;
    const subLinhas=ls=>ls.sort((a,b)=>String(b.data).localeCompare(String(a.data))||(+b.num-+a.num)).map(x=>`<tr class="sub">
      <td>${br(x.data)} · <a data-r5oc="${esc(x.id)}">OC ${esc(x.num)}</a>${!G.forn?' · '+esc(x.fNome):''}${x.saldo?' <span class="pill p-par">saldo</span>':''}</td>
      <td class="n">${rl5Q(x.q)} ${esc(x.un)}</td><td class="n">${rl5P(x.preco)}</td><td class="n">—</td><td class="n">${nf(x.v,2)}</td><td class="n">${nf(x.v+x.ipi,2)}</td><td>${sitTxt(x)}</td></tr>`).join('');
    let corpo='';
    if(grupo==='item'){
      const g=rl5Ordena(rl5Agrupa(l,'sku'));
      corpo=`<table class="r5t"><thead><tr><th>Item</th><th class="n">Qtde comprada</th><th class="n">Preço médio</th><th class="n">Menor · maior</th><th class="n">Valor produtos</th><th class="n">Valor com IPI</th><th>Chegada</th></tr></thead><tbody>
      ${g.map(x=>{const ab=CP.aberto.has('i|'+x.k),p=totV?(x.s.v+x.s.ipi)/totV*100:0;return `<tr class="g ${ab?'ab':''}" data-r5g="i|${esc(x.k)}">
        <td><b>${esc(x.nome)}</b><small>${esc(x.sku)} · ${x.s.ocs.size} ordem(ns)${!G.forn&&x.s.forns.size>1?' · '+x.s.forns.size+' fornecedores':''}</small><div class="bar"><i style="width:${Math.max(1,p).toFixed(1)}%"></i></div></td>
        <td class="n"><b>${rl5Q(x.s.q)}</b> ${esc(x.un)}</td><td class="n">${rl5P(x.s.pm)}</td>
        <td class="n">${x.s.min===x.s.max?rl5P(x.s.min):rl5P(x.s.min)+' · '+rl5P(x.s.max)}</td>
        <td class="n">${nf(x.s.v,2)}</td><td class="n"><b>${nf(x.s.v+x.s.ipi,2)}</b><small>${nf(p,1)}% do total</small></td>
        <td>${x.s.caminho?`<span class="r5ok">${rl5Q(x.s.chegou)} chegou</span><small class="r5cam">${rl5Q(x.s.caminho)} a caminho</small>`:'<span class="r5ok">tudo chegou</span>'}</td></tr>
        ${ab?subLinhas(x.ls):''}`;}).join('')}
      </tbody><tfoot><tr class="tot"><td>Total · ${g.length} item(ns)</td><td class="n">—</td><td></td><td></td><td class="n">${nf(S.v,2)}</td><td class="n">${nf(totV,2)}</td><td></td></tr></tfoot></table>`;
    }else{
      const g=rl5Ordena(rl5Agrupa(l,'forn'));
      corpo=`<table class="r5t"><thead><tr><th>Fornecedor</th><th class="n">Ordens</th><th class="n">Itens</th><th class="n">Valor produtos</th><th class="n">IPI</th><th class="n">Valor com IPI</th><th class="n">Créditos</th></tr></thead><tbody>
      ${g.map(x=>{const ab=CP.aberto.has('f|'+x.k),p=totV?(x.s.v+x.s.ipi)/totV*100:0;const its=ab?rl5Ordena(rl5Agrupa(x.ls,'sku')):[];
        return `<tr class="g ${ab?'ab':''}" data-r5g="f|${esc(x.k)}">
        <td><b>${esc(x.nome)}</b><small>${x.s.caminho?'tem item a caminho':'tudo chegou'}</small><div class="bar"><i style="width:${Math.max(1,p).toFixed(1)}%"></i></div></td>
        <td class="n">${x.s.ocs.size}</td><td class="n">${x.s.itens.size}</td><td class="n">${nf(x.s.v,2)}</td><td class="n">${nf(x.s.ipi,2)}</td>
        <td class="n"><b>${nf(x.s.v+x.s.ipi,2)}</b><small>${nf(p,1)}% do total</small></td><td class="n">${nf(x.s.cred,2)}</td></tr>
        ${ab?its.map(y=>`<tr class="sub"><td><b style="color:var(--ink)">${esc(y.nome)}</b> <span style="color:var(--ink3)">${esc(y.sku)}</span></td>
          <td class="n">${y.s.ocs.size}</td><td class="n">${rl5Q(y.s.q)} ${esc(y.un)}</td><td class="n">${nf(y.s.v,2)}</td><td class="n">${nf(y.s.ipi,2)}</td>
          <td class="n">${nf(y.s.v+y.s.ipi,2)}</td><td class="n">pm ${rl5P(y.s.pm)}</td></tr>`).join(''):''}`;}).join('')}
      </tbody><tfoot><tr class="tot"><td>Total · ${g.length} fornecedor(es)</td><td class="n">${S.ocs.size}</td><td class="n">${S.itens.size}</td><td class="n">${nf(S.v,2)}</td><td class="n">${nf(S.ipi,2)}</td><td class="n">${nf(totV,2)}</td><td class="n">${nf(S.cred,2)}</td></tr></tfoot></table>`;
    }
    $('q1Res').innerHTML=`<div class="r5k">
      <div class="card"><small>Total comprado</small><b>R$ ${nf(totV,2)}</b><span>produtos ${nf(S.v,2)} · IPI ${nf(S.ipi,2)}</span></div>
      <div class="card"><small>Ordens</small><b>${S.ocs.size}</b><span>${esc(perTxt)}</span></div>
      <div class="card"><small>Itens diferentes</small><b>${S.itens.size}</b><span>no filtro</span></div>
      <div class="card"><small>Fornecedores</small><b>${S.forns.size}</b><span>${fNome?esc(fNome):'no filtro'}</span></div>

      <div class="caixa" style="overflow:auto">${l.length?corpo:'<div class="vazio">Nenhuma compra nesse filtro e período.</div>'}</div>`;
    document.querySelectorAll('#q1Res [data-r5g]').forEach(r=>r.onclick=e=>{if(e.target.closest('a,.cfb'))return;const k=r.dataset.r5g;CP.aberto.has(k)?CP.aberto.delete(k):CP.aberto.add(k);cpMostra();});
    document.querySelectorAll('#q1Res [data-r5oc]').forEach(a=>a.onclick=e=>{e.stopPropagation();abrirOC(a.dataset.r5oc);});
  }

  document.addEventListener('mousedown',e=>{if(POP&&!POP.contains(e.target))fecha();},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});
  window.addEventListener('scroll',e=>{if(POP&&!POP.contains(e.target))fecha();},true);
  function abre(t,k,bt){
    fecha();const s=est(t),c=t._cf.cols[k],f=s.f[k]||{};
    const gs=t._cf.ordem;const vals=[...new Set(gs.map(g=>textoCel(g.rs[0].cells[k])))].sort((a,b)=>{const x=numero(a),y=numero(b);if(c.tipo!=='t'&&x&&y)return (x.n??x.d)-(y.n??y.d);return a.localeCompare(b,'pt');});
    const p=document.createElement('div');p.className='cfpop';POP=p;
    const num=c.tipo==='n';
    p.innerHTML=`<div class="cfo"><button type="button" data-o="1" class="${s.sort&&s.sort.c===k&&s.sort.dir>0?'on':''}">${num?'Menor → maior':c.tipo==='d'?'Mais antigo':'A → Z'}</button><button type="button" data-o="-1" class="${s.sort&&s.sort.c===k&&s.sort.dir<0?'on':''}">${num?'Maior → menor':c.tipo==='d'?'Mais recente':'Z → A'}</button></div>
      ${num?`<div class="cfn"><label><span>De</span><input id="cfDe" inputmode="decimal" value="${f.de!=null?String(f.de).replace('.',','):''}"></label><label><span>Até</span><input id="cfAte" inputmode="decimal" value="${f.ate!=null?String(f.ate).replace('.',','):''}"></label></div>`:''}
      <input class="cfq" placeholder="Buscar" id="cfQ"><div class="cfl" id="cfL"></div>
      <div class="cfa"><button type="button" id="cfLimpa">Limpar</button><button type="button" class="pri" id="cfOk">Aplicar</button></div>`;
    document.body.appendChild(p);
    const r=bt.getBoundingClientRect();const w=270;let x=Math.min(window.innerWidth-w-10,Math.max(10,r.right-w+20));let y=r.bottom+6;
    p.style.left=x+'px';p.style.top=y+'px';
    const h=p.offsetHeight;if(y+h>window.innerHeight-10)p.style.top=Math.max(10,r.top-h-6)+'px';
    const marcados=new Set(f.vals?[...f.vals]:vals);
    const lista=()=>{const q=semAc(p.querySelector('#cfQ').value);const vs=vals.filter(v=>!q||semAc(v).includes(q));
      const todos=vs.length&&vs.every(v=>marcados.has(v));
      p.querySelector('#cfL').innerHTML=`<label class="tds"><input type="checkbox" data-t="1" ${todos?'checked':''}> Selecionar todos</label>`+vs.slice(0,400).map((v,i)=>`<label title="${esc(v)}"><input type="checkbox" data-i="${vals.indexOf(v)}" ${marcados.has(v)?'checked':''}> ${esc(v||'(vazio)')}</label>`).join('');
      p.querySelector('[data-t]').onchange=e=>{vs.forEach(v=>e.target.checked?marcados.add(v):marcados.delete(v));lista();};
      p.querySelectorAll('[data-i]').forEach(cb=>cb.onchange=()=>{const v=vals[+cb.dataset.i];cb.checked?marcados.add(v):marcados.delete(v);lista();});};
    lista();p.querySelector('#cfQ').oninput=lista;
    p.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const d=+b.dataset.o;s.sort=s.sort&&s.sort.c===k&&s.sort.dir===d?null:{c:k,dir:d};aplica(t);fecha();});
    p.querySelector('#cfLimpa').onclick=()=>{delete s.f[k];if(s.sort&&s.sort.c===k)s.sort=null;aplica(t);fecha();};
    p.querySelector('#cfOk').onclick=()=>{const nv=v=>{v=String(v||'').trim();if(!v)return null;const n=parseFloat(v.replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n;};
      const de=num?nv(p.querySelector('#cfDe').value):null,ate=num?nv(p.querySelector('#cfAte').value):null;
      const tudo=vals.every(v=>marcados.has(v));
      if(de!=null||ate!=null)s.f[k]={de,ate};else if(!tudo)s.f[k]={vals:new Set(marcados)};else delete s.f[k];
      aplica(t);fecha();};
    p.addEventListener('keydown',e=>{if(e.key==='Enter')p.querySelector('#cfOk').click();});
    setTimeout(()=>{const i=p.querySelector(num?'#cfDe':'#cfQ');if(i)i.focus();},30);
  }

  /* ---------- procurar as tabelas ---------- */
  function varre(){
    let ts=[];try{ts=window.CF_ONDE?[...window.CF_ONDE()]:[];}catch(e){ts=[];}
    ts.forEach((t,i)=>{if(!t||t.dataset.cfok||t.dataset.nofiltro!=null||t.closest('#fmPg,.csprev,.cfpop'))return;try{prepara(t,i);}catch(e){console.warn('[filtro]',e);}});
  }
  let tm=null;const ob=new MutationObserver(ms=>{if(ms.every(m=>m.target.closest&&m.target.closest('.cfpop,.cfbar')))return;clearTimeout(tm);tm=setTimeout(varre,120);});
  const liga=()=>{try{ob.observe(document.body,{childList:true,subtree:true});}catch(e){}varre();};
  if(document.body)liga();else document.addEventListener('DOMContentLoaded',liga);
  window.addEventListener('hashchange',()=>setTimeout(varre,200));
  window.CF_VARRE=varre;
})();

</script>
</body></html>
