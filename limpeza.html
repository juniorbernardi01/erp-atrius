<script>
/* =====================================================================
   Checklist de limpeza · ERP Atrius · módulo do ERP Atrius
   Arquivo próprio, que abre na moldura do ERP. Não carrega o motor do PCP:
   pede ao núcleo (window.parent.csNucleo) os insumos, os saldos do Tiny, o
   que as OPs vão consumir e a gravação. Assim uma mudança aqui não mexe no
   PCP que está rodando, e vice-versa.
   ===================================================================== */
const MOD_TESTE=false;
const MOD_ID='limpeza';
const N=(()=>{try{if(window.parent!==window&&window.parent.csNucleo)return window.parent.csNucleo;}catch(e){}
  return window.csNucleo||null;})();
const $=id=>document.getElementById(id);
/* dentro do ERP a pílula TESTE já está no canto da casca: aqui ela sobraria em dobro */
try{if(window.parent!==window){const p=document.querySelector('.teste-pill');if(p)p.remove();}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=0)=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const nq=v=>{const n=Math.round((+v||0)*1000)/1000;return Number.isInteger(n)?nf(n):n.toLocaleString('pt-BR',{maximumFractionDigits:3});};
const rs=v=>'R$ '+nf(v,2);
/* número digitado à brasileira: "1.234,5" vira 1234.5 */
const num=s=>{if(typeof s==='number')return s;s=String(s||'').trim();if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0;};
const ymd=d=>{d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const hojeY=()=>ymd(new Date());
const br=y=>y?y.split('-').reverse().join('/'):'—';
const addDias=(y,n)=>{const d=new Date(y+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const agora=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const usuario=()=>N?N.usuario():'Teste';
const pode=(k,nv)=>N?N.pode(k,nv):true;
function toast(m,erro){const t=document.createElement('div');t.className='toast'+(erro?' erro':'');t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),erro?5200:2800);}
/* unidade: o que se pesa é kg, o resto é unidade */
const unDe=x=>/mat[ée]ria|fragr|corante/i.test((x&&x.tipo)||'')?'kg':'un';

/* ---------- gravação ---------- */
let DB=null,tGrava=null,GRAVANDO=false,SUJO=false;
function salvar(){SUJO=true;clearTimeout(tGrava);tGrava=setTimeout(gravarAgora,500);marcaSalvo('salvando…');}
async function gravarAgora(){
  if(!N||GRAVANDO)return;GRAVANDO=true;SUJO=false;
  try{
    const r=await N.gravar(MOD_ID,DB);
    if(r&&r.conflito){toast('Outra pessoa gravou antes. Recarreguei o que está no banco.',true);DB=normaliza(await N.ler(MOD_ID));render();}
    else marcaSalvo(r&&r.local?'salvo neste navegador '+agora().slice(-5):'salvo no banco '+agora().slice(-5));
  }catch(e){marcaSalvo('NÃO SALVOU');toast('Não consegui gravar: '+e.message,true);}
  GRAVANDO=false;if(SUJO)salvar();
}
function marcaSalvo(t){document.querySelectorAll('.salvo').forEach(e=>e.textContent=t);}
window.addEventListener('beforeunload',e=>{if(SUJO){e.preventDefault();e.returnValue='';}});

/* ---------- página pelo endereço (#ordens, #necessidade…) ---------- */
let PAG='';
function lerHash(){const h=(location.hash||'').replace('#','').split('/');return {pag:h[0]||PAGINA_INICIAL,arg:h.slice(1).join('/')};}
window.addEventListener('hashchange',()=>{const {pag}=lerHash();if(pag!==PAG){PAG=pag;try{N&&N.pagina(PAG);}catch(e){}}render();});
function ir(pag,arg){location.hash='#'+pag+(arg?'/'+arg:'');}

/* ---------- gaveta e popups ---------- */
function gaveta(html){const g=$('gav');if(html==null){g.classList.remove('on');$('veu').classList.remove('on');return;}
  g.innerHTML=html;g.classList.add('on');$('veu').classList.add('on');}
$('veu').onclick=()=>gaveta(null);

/* ---------- busca de insumo com lista embaixo do campo ---------- */
function buscaInsumo(input,escolhe,filtro){
  const caixa=input.parentNode;caixa.classList.add('rel');
  let lista=null;
  const fecha=()=>{if(lista){lista.remove();lista=null;}};
  input.addEventListener('input',()=>{
    fecha();const q=input.value.trim().toLowerCase();if(q.length<2)return;
    const achados=(N?N.insumos():[]).filter(x=>(!filtro||filtro(x))&&(x.sku+' '+x.nome+' '+x.tipo).toLowerCase().includes(q)).slice(0,12);
    if(!achados.length)return;
    lista=document.createElement('div');lista.className='lista-sug';
    lista.innerHTML=achados.map((x,i)=>`<button data-i="${i}"><b>${esc(x.nome)}</b><small>${esc(x.sku)} · ${esc(x.tipo)}${x.tiny?'':' · sem código do Tiny'}</small></button>`).join('');
    caixa.appendChild(lista);
    lista.querySelectorAll('button').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();escolhe(achados[+b.dataset.i]);input.value='';fecha();});
  });
  input.addEventListener('blur',()=>setTimeout(fecha,150));
}

<script>
/* =====================================================================
   PERÍODO · o mesmo filtro de datas em todo o sistema (desenho aprovado)
   estado: {m:'sem'|'dia'|'mes'|'int'|'prev', dia, mes:'aaaa-mm', de, ate, campo}
   abrirPeriodo(botão, estado, {prev:true|false, campos:[[valor,rótulo]]}, aplicar)
   ===================================================================== */
const PER_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PER_MC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const perHoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const perYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const perD=s=>{const [a,m,d]=String(s).split('-').map(Number);return new Date(a,(m||1)-1,d||1);};
const perBr=s=>s?String(s).split('-').reverse().join('/'):'';
const perLe=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;};
const perAdd=(s,n)=>{const d=perD(s);d.setDate(d.getDate()+n);return perYmd(d);};
function perNovo(m){const h=perHoje();return {m:m||'sem',dia:h,mes:h.slice(0,7),de:perAdd(h,-29),ate:h,campo:''};}
function perRotulo(p){if(!p||p.m==='sem')return 'Período';const h=perHoje();
  if(p.m==='dia')return p.dia===h?'Hoje':perBr(p.dia);
  if(p.m==='mes'){const [a,m]=p.mes.split('-');return PER_MES[+m-1]+' de '+a;}
  const ano=p.de.slice(0,4)!==p.ate.slice(0,4)||p.ate.slice(0,4)!==h.slice(0,4);
  const r=p.de===p.ate?perBr(p.de):perBr(p.de).slice(0,ano?10:5)+' a '+perBr(p.ate).slice(0,ano?10:5);
  return p.m==='prev'?'Previstos '+r:r;}
/* o intervalo efetivo, para quem filtra: {de, ate} (vazio = sem limite) */
function perFaixa(p){if(!p||p.m==='sem')return {de:'',ate:''};
  if(p.m==='dia')return {de:p.dia,ate:p.dia};
  if(p.m==='mes'){const [a,m]=p.mes.split('-').map(Number);return {de:p.mes+'-01',ate:perYmd(new Date(a,m,0))};}
  return {de:p.de<=p.ate?p.de:p.ate,ate:p.de<=p.ate?p.ate:p.de};}
function perBotao(id,p){return `<button class="perb2 ${p&&p.m!=='sem'?'ativo':''}" id="${id}" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg> ${perRotulo(p)}</button>`;}
function abrirPeriodo(botao,estado,opts,aplicar){
  opts=opts||{};
  const velho=document.getElementById('perPop');if(velho){const mesmo=velho._dono===botao;velho.remove();if(mesmo)return;}
  const t=JSON.parse(JSON.stringify(estado||perNovo()));if(!t.campo&&opts.campos)t.campo=opts.campos[0][0];
  let alvo='de',view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);
  const p=document.createElement('div');p.id='perPop';p.className='perpop';p._dono=botao;document.body.appendChild(p);
  const modos=[['sem','sem filtro'],['dia','do dia'],['mes','do mês'],['int','do intervalo'],...(opts.prev?[['prev','previstos para']]:[])];
  const cal=()=>{const y=view.getFullYear(),m=view.getMonth(),ini=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const faixa=t.m==='int'||t.m==='prev';
    const cls=s=>{if(!faixa)return s===t.dia?'on':'';const a=t.de<=t.ate?t.de:t.ate,b=t.de<=t.ate?t.ate:t.de;if(s===a&&s===b)return 'on';if(s===a)return 'on ini';if(s===b)return 'on fim';return s>a&&s<b?'fx':'';};
    return `<div class="pcal"><div class="pch"><button data-nv="-1" type="button">‹</button><b>${PER_MES[m]} ${y}</b><button data-nv="1" type="button">›</button></div><div class="pcg">${'DSTQQSS'.split('').map(x=>'<span>'+x+'</span>').join('')}${'<i></i>'.repeat(ini)}${Array.from({length:n},(_,i)=>{const s=perYmd(new Date(y,m,i+1));return `<button type="button" class="${cls(s)} ${s===perHoje()?'hj':''}" data-dd="${s}">${i+1}</button>`;}).join('')}</div></div>`;};
  const res=()=>{const f=perFaixa(t);if(t.m==='sem')return 'mostra tudo, sem limitar por data';
    const dias=Math.round((perD(f.ate)-perD(f.de))/864e5)+1;return `<b>${perRotulo(t)}</b>${dias>1?` · ${dias} dias`:''}`;};
  const des=()=>{
    let c='';
    if(t.m==='dia')c=`<div class="pdf"><button data-dia="-1" type="button">‹</button><input id="pdDia" value="${perBr(t.dia)}"><button data-dia="1" type="button">›</button></div>${cal()}`;
    else if(t.m==='mes'){const [a,mm]=t.mes.split('-').map(Number);c=`<div class="pdf sm"><button data-ano="-1" type="button">‹</button><input value="${a}" readonly><button data-ano="1" type="button">›</button></div><div class="pmes">${PER_MC.map((x,i)=>`<button type="button" data-ms="${i+1}" class="${i+1===mm?'on':''}">${x}</button>`).join('')}</div>`;}
    else if(t.m==='int'||t.m==='prev'){const h=perHoje();
      const at=t.m==='prev'?[['hoje',h,h],['amanhã',perAdd(h,1),perAdd(h,1)],['próximos 7 dias',h,perAdd(h,6)]]:[['últimos 7 dias',perAdd(h,-6),h],['últimos 30 dias',perAdd(h,-29),h],['este mês',h.slice(0,8)+'01',perFaixa({m:'mes',mes:h.slice(0,7)}).ate],['mês passado',perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth()-1,1)),perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth(),0))]];
      c=`${t.m==='prev'?'<div class="pdica">Entrega prevista entre as duas datas. Para um dia só, deixe as duas iguais.</div>':''}<div class="patal">${at.map(([r,a,b],i)=>`<button type="button" data-at="${i}">${r}</button>`).join('')}</div>
      <div class="pdois"><div><small>de</small><div class="pdf sm ${alvo==='de'?'at':''}" data-alvo="de"><input id="pdDe" value="${perBr(t.de)}"></div></div><div><small>até</small><div class="pdf sm ${alvo==='ate'?'at':''}" data-alvo="ate"><input id="pdAte" value="${perBr(t.ate)}"></div></div></div>
      <div class="pdica">${alvo==='de'?'clique no primeiro dia':'agora clique no último dia'}</div>${cal()}`;
      p._at=at;}
    else c='<div class="pdica" style="margin:6px 0 10px">Mostra tudo, sem limitar por data.</div>';
    p.innerHTML=`<div class="pmodos">${modos.map(([k,r])=>`<button type="button" data-md="${k}" class="${t.m===k?'on':''}">${r}</button>`).join('')}</div>
      <div class="pcorpo">${c}${opts.campos&&t.m!=='sem'?`<div class="pcampo"><small>Data a considerar</small><select id="pdCampo">${opts.campos.filter(x=>t.m==='prev'?true:!x[2]).map(([v,r])=>`<option value="${v}" ${t.campo===v?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
      <div class="pres">${res()}</div><div class="pbot"><button type="button" class="btn" id="pdLimpa">limpar</button><button type="button" class="btn pri" id="pdOk">aplicar</button></div></div>`;
    p.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{t.m=b.dataset.md;alvo='de';if(t.m==='prev'&&!(estado&&estado.m==='prev')){t.de=t.ate=perHoje();}
      view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{view.setMonth(view.getMonth()+(+b.dataset.nv));des();});
    p.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{const s=b.dataset.dd;if(t.m==='dia'){t.dia=s;}else if(alvo==='de'){t.de=s;if(t.ate<s)t.ate=s;alvo='ate';}else{if(s<t.de){t.ate=t.de;t.de=s;}else t.ate=s;alvo='de';}des();});
    p.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{t.dia=perAdd(t.dia,+b.dataset.dia);view=perD(t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-ano]').forEach(b=>b.onclick=()=>{const [a,mm]=t.mes.split('-');t.mes=(+a+(+b.dataset.ano))+'-'+mm;des();});
    p.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{t.mes=t.mes.slice(0,4)+'-'+String(b.dataset.ms).padStart(2,'0');des();});
    p.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{const x=p._at[+b.dataset.at];t.de=x[1];t.ate=x[2];alvo='de';view=perD(t.de);view.setDate(1);des();});
    p.querySelectorAll('[data-alvo]').forEach(b=>b.onclick=()=>{if(alvo!==b.dataset.alvo){alvo=b.dataset.alvo;des();const i=p.querySelector(alvo==='de'?'#pdDe':'#pdAte');if(i)i.focus();}});
    const inp=(id,f)=>{const i=p.querySelector(id);if(i)i.onchange=()=>{const v=perLe(i.value);if(v){f(v);view=perD(v);view.setDate(1);}des();};};
    inp('#pdDia',v=>t.dia=v);inp('#pdDe',v=>t.de=v);inp('#pdAte',v=>t.ate=v);
    const cs=p.querySelector('#pdCampo');if(cs)cs.onchange=()=>{t.campo=cs.value;};
    p.querySelector('#pdLimpa').onclick=()=>{p.remove();aplicar(Object.assign(perNovo('sem'),{campo:t.campo}));};
    p.querySelector('#pdOk').onclick=()=>{p.remove();if(t.m!=='prev'&&opts.campos&&opts.campos.some(x=>x[0]===t.campo&&x[2]))t.campo=opts.campos[0][0];aplicar(t);};
    posiciona();
  };
  const posiciona=()=>{const r=botao.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
    let l=r.left;if(l+w>innerWidth-8)l=Math.max(8,innerWidth-w-8);let tp=r.bottom+6;if(tp+h>innerHeight-8)tp=Math.max(8,innerHeight-h-8);
    p.style.left=l+'px';p.style.top=tp+'px';};
  p.onclick=ev=>ev.stopPropagation();
  p.onkeydown=ev=>{if(ev.key==='Escape')p.remove();if(ev.key==='Enter'&&ev.target.tagName!=='SELECT'){ev.preventDefault();p.querySelector('#pdOk').click();}};
  des();
}
document.addEventListener('click',ev=>{const p=document.getElementById('perPop');if(p&&!p.contains(ev.target)&&ev.target!==p._dono&&!(p._dono&&p._dono.contains(ev.target)))p.remove();});

/* =====================================================================
   COLUNAS VISÍVEIS · o botão do Tiny que escolhe o que aparece na lista
   Cada lista tem uma chave (vendas, compras, ordens...). A escolha fica
   guardada no aparelho, por lista. Funciona olhando o cabeçalho da tabela:
   não precisa mexer em quem desenha a lista — some a coluna com o título
   que a pessoa desligou. Coluna sem título (marcar, três pontinhos) fica.
   ===================================================================== */
const COLS_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="9" r="2" fill="#fff"/><circle cx="12" cy="15" r="2" fill="#fff"/><circle cx="18" cy="8" r="2" fill="#fff"/></svg>';
const colsNorm=s=>String(s||'').replace(/[↑↓▲▼⇅]/g,'').replace(/\s+/g,' ').trim();
function colsOcultas(k,pad){try{const v=JSON.parse(localStorage.getItem('erp.cols.'+k)||'null');return Array.isArray(v)?v:(pad||[]);}catch(e){return pad||[];}}
function colsGravar(k,l){try{localStorage.setItem('erp.cols.'+k,JSON.stringify(l));}catch(e){}}
function colsBotao(id){return `<button type="button" class="colbt" id="${id}" title="Escolher as colunas que aparecem">${COLS_SVG}</button>`;}
/* painel: lista de rótulos com chave liga/desliga; fixas não desligam */
function colsPainel(k,rotulos,pad,fixas,aoAplicar){
  const velho=document.getElementById('colsP');if(velho){velho.remove();document.getElementById('colsV')&&document.getElementById('colsV').remove();}
  const oc=new Set(colsOcultas(k,pad));fixas=fixas||[];
  const v=document.createElement('div');v.id='colsV';v.className='colsv';
  const p=document.createElement('div');p.id='colsP';p.className='colsp';
  const lin=()=>rotulos.map(r=>`<label class="${fixas.includes(r)?'fx':''}"><span class="sw ${oc.has(r)?'':'on'}" data-cr="${r.replace(/"/g,'&quot;')}"></span>${r}</label>`).join('');
  p.innerHTML=`<div class="ch"><b>Informações visíveis</b><button type="button" class="x" id="colsX">fechar ✕</button></div>
    <p>Escolha as colunas que aparecem nesta lista. Fica guardado neste aparelho.</p>
    <div class="cl" id="colsL">${lin()}</div>
    <div class="cf"><button type="button" class="btn pri" id="colsOk">Aplicar</button><button type="button" class="btn" id="colsPad">Voltar ao padrão</button><button type="button" class="btn lk" id="colsC">Cancelar</button></div>`;
  document.body.appendChild(v);document.body.appendChild(p);
  const fecha=()=>{p.remove();v.remove();};
  const liga=()=>p.querySelectorAll('[data-cr]').forEach(s=>s.onclick=()=>{const r=s.dataset.cr;if(fixas.includes(r))return;oc.has(r)?oc.delete(r):oc.add(r);s.classList.toggle('on',!oc.has(r));});
  liga();v.onclick=fecha;p.querySelector('#colsX').onclick=fecha;p.querySelector('#colsC').onclick=fecha;
  p.querySelector('#colsPad').onclick=()=>{oc.clear();(pad||[]).forEach(r=>oc.add(r));p.querySelector('#colsL').innerHTML=lin();liga();};
  p.querySelector('#colsOk').onclick=()=>{colsGravar(k,[...oc]);fecha();if(aoAplicar)aoAplicar();};
}
/* tabela <table>: some a coluna pelo título do cabeçalho */
function colsTabela(tab,k,pad){
  if(!tab)return [];
  const oc=new Set(colsOcultas(k,pad)),ths=[...tab.querySelectorAll('thead tr:first-child > th')];
  const rot=ths.map(t=>colsNorm(t.textContent));const esc=[];
  rot.forEach((r,i)=>{if(r&&oc.has(r))esc.push(i);});
  ths.forEach((t,i)=>t.style.display=esc.includes(i)?'none':'');
  tab.querySelectorAll('tbody > tr, tfoot > tr').forEach(tr=>{const tds=[...tr.children];if(tds.length!==ths.length)return;
    tds.forEach((td,i)=>td.style.display=esc.includes(i)?'none':'');});
  return rot.filter(Boolean);
}
/* lista em grade (div.h + div.r): some a coluna e refaz as trilhas */
function colsGrade(caixa,k,trilhas,pad){
  if(!caixa)return [];
  const h=caixa.querySelector('.h');if(!h)return [];
  const oc=new Set(colsOcultas(k,pad)),cel=[...h.children],rot=cel.map(c=>colsNorm(c.textContent));
  const esc=[];rot.forEach((r,i)=>{if(r&&oc.has(r))esc.push(i);});
  const tpl=trilhas.filter((t,i)=>!esc.includes(i)).join(' ');
  [h,...caixa.querySelectorAll('.r')].forEach(r=>{if(r.children.length!==cel.length)return;
    r.style.gridTemplateColumns=tpl;[...r.children].forEach((c,i)=>c.style.display=esc.includes(i)?'none':'');});
  return rot.filter(Boolean);
}

const deBR=s=>{const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(!m)return '';
  const a=m[3].length===2?'20'+m[3]:m[3];const d=new Date(+a,+m[2]-1,+m[1]);
  if(d.getDate()!==+m[1]||d.getMonth()!==+m[2]-1)return '';return ymd(d);};
/* calendário: o mesmo modelo em todo campo de data */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function ligaCalendarios(raiz){
  (raiz||document).querySelectorAll('input[data-cal]').forEach(inp=>{
    if(inp._cal)return;inp._cal=1;inp.autocomplete='off';
    inp.addEventListener('click',ev=>{ev.stopPropagation();if(inp.disabled)return;abreCalendario(inp);});
  });
}
function abreCalendario(inp){
  document.querySelectorAll('.cal-pop').forEach(c=>c.remove());
  const sel=deBR(inp.value)||hojeY();let mes=new Date(sel+'T12:00');mes.setDate(1);
  const p=document.createElement('div');p.className='cal-pop';document.body.appendChild(p);
  const r=inp.getBoundingClientRect();p.style.left=(r.left+window.scrollX)+'px';p.style.top=(r.bottom+window.scrollY+4)+'px';
  const des=()=>{const y=mes.getFullYear(),m=mes.getMonth();const ini=new Date(y,m,1).getDay(),dias=new Date(y,m+1,0).getDate();
    p.innerHTML=`<div class="ch"><button data-n="-1">‹</button><b>${MESES[m]} ${y}</b><button data-n="1">›</button></div><div class="cg">${'DSTQQSS'.split('').map(d=>`<span>${d}</span>`).join('')}${'<i></i>'.repeat(ini)}${
      Array.from({length:dias},(_,i)=>{const d=ymd(new Date(y,m,i+1));return `<button data-d="${d}" class="${d===sel?'on':''} ${d===hojeY()?'hj':''}">${i+1}</button>`;}).join('')}</div>`;
    p.querySelectorAll('[data-n]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();mes.setMonth(mes.getMonth()+ +b.dataset.n);des();});
    p.querySelectorAll('[data-d]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();inp.value=br(b.dataset.d);p.remove();inp.dispatchEvent(new Event('change',{bubbles:true}));});};
  des();p.onclick=ev=>ev.stopPropagation();
  if(r.bottom+p.offsetHeight>window.innerHeight)p.style.top=Math.max(8,r.top+window.scrollY-p.offsetHeight-4)+'px';
}


</script>
<script data-v512="periodo">
/* v5.1.2 · PERÍODO NOVO (todas as páginas) — pedido do Junior em 06/11
   - abas em cima (Dia · Mês · Intervalo · Previstos · Sem filtro), no lugar do menu do lado;
   - data digitada só com números: 01012026 vira 01/01/2026 enquanto digita (não volta mais para hoje);
   - sem os atalhos "últimos 7 dias / 30 dias / este mês / mês passado";
   - o calendário passa de mês rolando a roda do mouse;
   - Mês: ‹ Novembro/2026 › com flechas; dá para digitar 01/2026 ou 012026. */
(function(){
  if(typeof abrirPeriodo!=='function'||window.__per512)return;window.__per512=1;
  const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const p2=n=>String(n).padStart(2,'0');
  const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const hoje=()=>ymd(new Date());
  const D=s=>{const [a,m,d]=String(s).split('-').map(Number);return new Date(a,(m||1)-1,d||1);};
  const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d);};
  const br=s=>s?String(s).split('-').reverse().join('/'):'';
  /* máscara: só números → dd/mm/aaaa */
  const mascDia=v=>{const d=String(v).replace(/\D/g,'').slice(0,8);return d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;};
  const leDia=v=>{let d=String(v).replace(/\D/g,'');if(d.length===6)d=d.slice(0,4)+'20'+d.slice(4);if(d.length!==8)return null;
    const dd=+d.slice(0,2),mm=+d.slice(2,4),aa=+d.slice(4);const x=new Date(aa,mm-1,dd);
    return x.getFullYear()===aa&&x.getMonth()===mm-1&&x.getDate()===dd?ymd(x):null;};
  const mascMes=v=>{const d=String(v).replace(/\D/g,'').slice(0,6);return d.length>2?d.slice(0,2)+'/'+d.slice(2):d;};
  const leMes=v=>{const d=String(v).replace(/\D/g,'');if(d.length!==6)return null;const mm=+d.slice(0,2),aa=+d.slice(2);return mm>=1&&mm<=12&&aa>1900?aa+'-'+p2(mm):null;};
  const rot=p=>{try{return perRotulo(p);}catch(e){return '';}};
  const faixa=p=>{try{return perFaixa(p);}catch(e){return {de:'',ate:''};}};
  const novo=m=>{try{return perNovo(m);}catch(e){const h=hoje();return {m:m||'sem',dia:h,mes:h.slice(0,7),de:add(h,-29),ate:h,campo:''};}};

  abrirPeriodo=function(botao,estado,opts,aplicar){
    opts=opts||{};
    const velho=document.getElementById('perPop');if(velho){const mesmo=velho._dono===botao;velho.remove();if(mesmo)return;}
    const t=JSON.parse(JSON.stringify(estado||novo()));if(!t.campo&&opts.campos)t.campo=opts.campos[0][0];
    if(t.m==='sem')t.m='dia';            /* abre já num modo de escolher; "Sem filtro" é uma aba */
    let alvo='de',view=D(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);let foco=null;
    const p=document.createElement('div');p.id='perPop';p.className='perpop p512';p._dono=botao;document.body.appendChild(p);
    const modos=[['dia','Dia'],['mes','Mês'],['int','Intervalo'],...(opts.prev?[['prev','Previstos']]:[]),['sem','Sem filtro']];
    const cal=()=>{const y=view.getFullYear(),m=view.getMonth(),ini=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const fx=t.m==='int'||t.m==='prev';const h=hoje();
      const cls=s=>{let c=s===h?'hj ':'';if(!fx)return c+(s===t.dia?'on':'');const a=t.de<=t.ate?t.de:t.ate,b=t.de<=t.ate?t.ate:t.de;
        if(s===a&&s===b)return c+'on';if(s===a)return c+'on ini';if(s===b)return c+'on fim';return c+(s>a&&s<b?'fx':'');};
      let g='';for(let i=0;i<ini;i++)g+='<i></i>';for(let d=1;d<=n;d++){const s=y+'-'+p2(m+1)+'-'+p2(d);g+=`<button type="button" data-dd="${s}" class="${cls(s)}">${d}</button>`;}
      return `<div class="pcal" id="pdCal"><div class="pch"><button data-nv="-1" type="button" title="mês anterior">‹</button><b>${MES[m]} ${y}</b><button data-nv="1" type="button" title="próximo mês">›</button></div>
        <div class="pcg">${'DSTQQSS'.split('').map(x=>'<span>'+x+'</span>').join('')}${g}</div></div>`;};
    const res=()=>{if(t.m==='sem')return 'mostra tudo, sem limitar por data';const f=faixa(t);if(!f.de)return '';
      const dias=Math.round((D(f.ate)-D(f.de))/864e5)+1;return `<b>${rot(t)}</b>${dias>1?` · ${dias} dias`:''}`;};
    const des=()=>{
      let c='';
      if(t.m==='dia')c=`<div class="pdf"><button data-dia="-1" type="button">‹</button><input id="pdDia" inputmode="numeric" value="${br(t.dia)}" placeholder="dd/mm/aaaa"><button data-dia="1" type="button">›</button></div>${cal()}`;
      else if(t.m==='mes'){const [a,mm]=t.mes.split('-').map(Number);
        c=`<div class="pdf pmz"><button data-mz="-1" type="button" title="mês anterior">‹</button><input id="pdMes" inputmode="numeric" value="${p2(mm)}/${a}" placeholder="mm/aaaa"><button data-mz="1" type="button" title="próximo mês">›</button></div>`;}
      else if(t.m==='int'||t.m==='prev'){
        c=`
        <div class="pdois"><div><small>de</small><div class="pdf sm ${alvo==='de'?'at':''}" data-alvo="de"><input id="pdDe" inputmode="numeric" value="${br(t.de)}" placeholder="dd/mm/aaaa"></div></div>
          <div><small>até</small><div class="pdf sm ${alvo==='ate'?'at':''}" data-alvo="ate"><input id="pdAte" inputmode="numeric" value="${br(t.ate)}" placeholder="dd/mm/aaaa"></div></div></div>${cal()}`;}
      else c='<div class="pdica" style="margin:14px 0 18px;text-align:center">Mostra tudo, sem limitar por data.</div>';
      p.innerHTML=`<div class="pab">${modos.map(([k,r])=>`<button type="button" data-md="${k}" class="${t.m===k?'on':''}">${r}</button>`).join('')}</div>
        <div class="pcorpo">${c}${opts.campos&&t.m!=='sem'?`<div class="pcampo"><small>Data a considerar</small><select id="pdCampo">${opts.campos.filter(x=>t.m==='prev'?true:!x[2]).map(([v,r])=>`<option value="${v}" ${t.campo===v?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
        <div class="pbot" style="margin-top:10px"><button type="button" class="btn" id="pdLimpa">limpar</button><button type="button" class="btn pri" id="pdOk">aplicar</button></div></div>`;
      p.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{t.m=b.dataset.md;alvo='de';if(t.m==='prev'&&!(estado&&estado.m==='prev')){t.de=t.ate=hoje();}
        view=D(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);foco=null;des();});
      p.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{view.setMonth(view.getMonth()+(+b.dataset.nv));des();});
      p.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{const s=b.dataset.dd;if(t.m==='dia'){t.dia=s;}else if(alvo==='de'){t.de=s;if(t.ate<s)t.ate=s;alvo='ate';}else{if(s<t.de){t.ate=t.de;t.de=s;}else t.ate=s;alvo='de';}foco=null;des();});
      p.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{t.dia=add(t.dia,+b.dataset.dia);view=D(t.dia);view.setDate(1);des();});
      p.querySelectorAll('[data-mz]').forEach(b=>b.onclick=()=>{const [a,mm]=t.mes.split('-').map(Number);const x=new Date(a,mm-1+(+b.dataset.mz),1);t.mes=x.getFullYear()+'-'+p2(x.getMonth()+1);des();});
      p.querySelectorAll('[data-alvo]').forEach(b=>b.onclick=()=>{if(alvo!==b.dataset.alvo){alvo=b.dataset.alvo;foco=alvo==='de'?'#pdDe':'#pdAte';des();}});
      /* digitação: a máscara põe as barras; com a data completa já vale (sem voltar para hoje) */
      const dig=(id,f,prox)=>{const i=p.querySelector(id);if(!i)return;
        i.onfocus=()=>{if(id==='#pdDe'&&alvo!=='de'){alvo='de';p.querySelector('[data-alvo="de"]').classList.add('at');p.querySelector('[data-alvo="ate"]').classList.remove('at');}
          if(id==='#pdAte'&&alvo!=='ate'){alvo='ate';p.querySelector('[data-alvo="ate"]').classList.add('at');p.querySelector('[data-alvo="de"]').classList.remove('at');}
          i._fresh=true;};
        i.onkeydown=ev=>{if(i._fresh&&/^\d$/.test(ev.key)&&i.selectionStart===i.selectionEnd){i.value='';}if(ev.key.length===1||ev.key==='Backspace')i._fresh=false;};
        i.oninput=()=>{const v=mascDia(i.value);i.value=v;const s=leDia(v);if(s&&v.length===10){f(s);view=D(s);view.setDate(1);foco=prox||id;p._ultFoco=id;des();}};
        i.onblur=()=>{if(!leDia(i.value))setTimeout(()=>{if(document.body.contains(i))i.value=br(id==='#pdDia'?t.dia:id==='#pdDe'?t.de:t.ate);},120);};};
      dig('#pdDia',v=>t.dia=v);
      dig('#pdDe',v=>{t.de=v;if(t.ate<v)t.ate=v;alvo='ate';},'#pdAte');
      dig('#pdAte',v=>{if(v<t.de){t.ate=t.de;t.de=v;}else t.ate=v;},'#pdAte');
      const im=p.querySelector('#pdMes');if(im){im.onfocus=()=>{im._fresh=true;};im.onkeydown=ev=>{if(im._fresh&&/^\d$/.test(ev.key)&&im.selectionStart===im.selectionEnd)im.value='';if(ev.key.length===1||ev.key==='Backspace')im._fresh=false;};
        im.oninput=()=>{const v=mascMes(im.value);im.value=v;const s=leMes(v);if(s&&v.length===7){t.mes=s;foco='#pdMes';p._ultFoco='#pdMes';des();}};
        im.onblur=()=>{if(!leMes(im.value))setTimeout(()=>{if(document.body.contains(im)){const [a,mm]=t.mes.split('-');im.value=mm+'/'+a;}},120);};}
      /* roda do mouse no calendário: troca o mês */
      const cg=p.querySelector('#pdCal');if(cg)cg.addEventListener('wheel',ev=>{ev.preventDefault();const now=Date.now();if(p._wh&&now-p._wh<140)return;p._wh=now;
        view.setMonth(view.getMonth()+(ev.deltaY>0?1:-1));des();},{passive:false});
      const pm=p.querySelector('.pmz');if(pm)pm.addEventListener('wheel',ev=>{ev.preventDefault();const now=Date.now();if(p._wh&&now-p._wh<140)return;p._wh=now;
        const [a,mm]=t.mes.split('-').map(Number);const x=new Date(a,mm-1+(ev.deltaY>0?1:-1),1);t.mes=x.getFullYear()+'-'+p2(x.getMonth()+1);des();},{passive:false});
      const cs=p.querySelector('#pdCampo');if(cs)cs.onchange=()=>{t.campo=cs.value;};
      p.querySelector('#pdLimpa').onclick=()=>{p.remove();aplicar(Object.assign(novo('sem'),{campo:t.campo}));};
      p.querySelector('#pdOk').onclick=()=>{p.remove();if(t.m!=='prev'&&opts.campos&&opts.campos.some(x=>x[0]===t.campo&&x[2]))t.campo=opts.campos[0][0];aplicar(t);};
      posiciona();
      if(foco){const i=p.querySelector(foco);if(i){i.focus();i._fresh=foco!==p._ultFoco;const L=i.value.length;try{i.setSelectionRange(L,L);}catch(e){}}foco=null;}
    };
    const posiciona=()=>{const r=botao.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
      let l=r.left;if(l+w>innerWidth-8)l=Math.max(8,innerWidth-w-8);let tp=r.bottom+6;if(tp+h>innerHeight-8)tp=Math.max(8,innerHeight-h-8);
      p.style.left=l+'px';p.style.top=tp+'px';};
    p.onclick=ev=>ev.stopPropagation();
    p.onkeydown=ev=>{if(ev.key==='Escape')p.remove();if(ev.key==='Enter'&&ev.target.tagName!=='SELECT'){ev.preventDefault();p.querySelector('#pdOk').click();}};
    des();
    const f0=p.querySelector('#pdDia,#pdMes,#pdDe');if(f0)setTimeout(()=>{try{f0.focus();}catch(e){}},30);
  };
  document.head.insertAdjacentHTML('beforeend',`<style>

<script>
/* =====================================================================
   PCP · v5.3.0 · Checklist semanal de limpeza
   #lista          as vistorias, uma por semana (só dados)
   #lista/<nº>     a vistoria aberta (o menu continua marcando o Checklist) · em andamento: cada um preenche os setores que são dele, um setor por página;
                   fechada: a ciência do Neuci (Confere / Não confere, gravidade)
   #relatorio      PCP › Relatórios › Limpeza e conservação
   #config         Configurações › PCP › Checklist semanal de limpeza
   Tabelas do supabase-v5.3.0-checklist-limpeza.sql, pelo núcleo do ERP (N.sb), com o login
   de quem usa. As travas (fechada não muda, nada se apaga) estão no banco, não só aqui.
   ===================================================================== */
const PAGINA_INICIAL='lista';
const CK='limpeza';
const semAc=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const mesmo=(a,b)=>!!a&&!!b&&semAc(a)===semAc(b);
const n4=n=>n?String(n).padStart(4,'0'):'—';
const pri=n=>String(n||'').split(' ')[0];
const GRAV=[['baixa','Baixa'],['media','Média'],['alta','Alta']];
const gRot=g=>(GRAV.find(x=>x[0]===g)||['',''])[1];
const gCls=g=>({baixa:'Baixa',media:'Média',alta:'Alta'})[g]||'';
const hm=iso=>iso?new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const dh=iso=>iso?new Date(iso).toLocaleDateString('pt-BR')+' '+hm(iso):'';
const agoraIso=()=>new Date().toISOString();
const eu=()=>usuario();
const CAM='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.5-2.5h5L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>';

const LP={base:null,vists:null,erro:'',per:perNovo('mes'),q:'',V:null,cur:0,errSet:'',cfgAba:'itens',
  rel:{per:Object.assign(perNovo('int'),{de:addDias(hojeY(),-55)}),setor:'',tipo:'',grav:''},cols:null};   /* relatório abre nas últimas 8 semanas */

/* ---------- banco ---------- */
async function sb(path,op){
  if(!N||!N.sb)throw new Error('Atualize o ERP (Ctrl+Shift+R): o núcleo ainda não tem o banco novo.');
  try{return await N.sb(path,op);}
  catch(e){if(/(vistori|checklist|tipos_problema)/i.test(e.message)&&/(does not exist|não existe|42P01|42883|PGRST20)/i.test(e.message))throw new Error('falta rodar o supabase-v5.3.0-checklist-limpeza.sql no Supabase');throw e;}
}
const lista=v=>'('+v.map(x=>encodeURIComponent(x)).join(',')+')';
async function carregaBase(forca){
  if(LP.base&&!forca)return LP.base;
  const [st,it,tp,rg]=await Promise.all([
    sb(`checklist_setores?checklist_id=eq.${CK}&select=*&order=ordem.asc`),
    sb(`checklist_itens?select=*&order=ordem.asc`),
    sb(`tipos_problema?checklist_id=eq.${CK}&select=*&order=ordem.asc`),
    sb(`checklist_regras?checklist_id=eq.${CK}&select=*`)]);
  const ids=new Set((st||[]).map(s=>s.id));
  LP.base={setores:st||[],itens:(it||[]).filter(i=>ids.has(i.setor_id)),tipos:tp||[],regras:Object.fromEntries((rg||[]).map(r=>[r.chave,r]))};

}

function situacao(x){

const ncsDe=V=>V.resp.filter(r=>r.resposta==='nao_conforme');
const pcConf=V=>Math.round((V.resp.length-ncsDe(V).length)/Math.max(1,V.resp.length)*100);
function quebraTipos(L){if(!L.length)return '';const t={};L.forEach(x=>{const k=x.tipo_nome||'—';t[k]=(t[k]||0)+1;});
  return `<div class="tipos">${Object.entries(t).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div><b>${Math.round(v/L.length*100)}%</b>${esc(n)}<small>${v} de ${L.length}</small></div>`).join('')}</div>`;}
function porSetor(V){return `<div class="cards sets">${V.sets.map((s,i)=>{const R=respDe(s),n=R.filter(r=>r.resposta==='nao_conforme').length;return `<div class="card ${n?'a':'g'}"><span>${i+1}. ${esc(s.setor_nome)}</span><b>${n?n+' NC':'100%'}</b><small>${Math.round((R.length-n)/Math.max(1,R.length)*100)}% conforme</small></div>`;}).join('')}</div>`;}
const fotosHtml=r=>r.fotos.length?`<div class="fotos">${r.fotos.map(f=>`<img class="ft" data-ft="${esc(f.caminho)}" alt="Foto">`).join('')}</div>`:'<span style="color:var(--ink3)">sem foto</span>';
function resumo(){const V=V_(),L=ncsDe(V),pc=pcConf(V),alta=L.filter(x=>x.gravidade==='alta').length,ehP=pode('pcp.limp','editar');
  return `<div class="sethead" style="background:${pc>=90?'var(--ok)':'var(--amb)'}"><div><h2>Resumo da vistoria</h2><small>confira antes de fechar · depois de fechada não muda mais</small></div><div class="st"><b>${pc}%</b>conforme</div></div>
   <div class="cards"><div class="card"><span>Itens vistoriados</span><b>${V.resp.length}</b></div><div class="card ${L.length?'a':'g'}"><span>Não conformes</span><b>${L.length}</b></div><div class="card ${alta?'r':''}"><span>Gravidade alta</span><b>${alta}</b></div><div class="card"><span>Reincidentes</span><b>${L.filter(x=>x.reincidente_de).length}</b></div></div>
   ${porSetor(V)}
   <div class="caixa"><h3>Não conformidades da semana<span class="dir">por tipo de problema</span></h3><div class="cp">${L.length?quebraTipos(L)+tabNC(L,false):'<div class="vazio" style="color:var(--ok);font-weight:600">Nenhuma não conformidade nesta semana.</div>'}</div></div>
   ${ehP?`<div class="caixa"><h3>Fechar a vistoria</h3><div class="cp"><div class="leg">Depois de fechada, a vistoria não pode ser alterada.${ligada('realizada')?' O aviso de vistoria realizada sai por e-mail na hora.':''}</div><button class="btn pri gr" id="bFechar">Fechar vistoria com meu PIN</button></div></div>`
     :`<div class="lpav">Para fechar a vistoria é preciso ter a permissão de preencher o checklist.</div>`}`;}
function tabNC(L,cienc){const V=V_(),sets=Object.fromEntries(V.sets.map(s=>[s.setor_id,s]));
  return `<div class="rolx"><table class="tv lpt"><thead><tr><th>Setor</th><th>Item</th><th>Tipo</th><th>Observação</th><th>Gravidade</th><th>Fotos</th>${cienc?'<th style="min-width:170px">Conferência</th>':''}</tr></thead><tbody>
  ${L.map(r=>{const s=sets[r.setor_id]||{},outro=s.concluido_por&&!mesmo(s.concluido_por,v_fechou());
    return `<tr data-r="${r.id}"><td>${esc(r.setor_nome)}${outro?`<span class="tag n">${esc(pri(s.concluido_por))}</span>`:''}</td><td>${esc(r.item_nome)}${r.reincidente_de?'<span class="tag">Reincidente</span>':''}</td><td>${esc(r.tipo_nome||'')}${r.tipo_outro?'<span class="gmud">'+esc(r.tipo_outro)+'</span>':''}</td><td>${esc(r.observacao||'')}</td>
    <td>${cienc?gravCiencia(r,s):`<span class="pill ${gCls(r.gravidade)}">${gRot(r.gravidade)}</span>`}</td><td>${fotosHtml(r)}</td>${cienc?`<td>${confCiencia(r,s)}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`;}

/* ---------- fotos: comprimidas no aparelho (~1.280 px) e guardadas no Storage, nunca no banco ---------- */
function comprime(file){return new Promise((ok,erro)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=1280,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):erro(new Error('não consegui ler a foto')),'image/jpeg',.8);};
  im.onerror=()=>{URL.revokeObjectURL(u);erro(new Error('arquivo não é uma foto'));};im.src=u;});}
async function subirFotos(r,files){
  if(!N.sbUp){toast('Atualize o ERP (Ctrl+Shift+R) para enviar fotos.',true);return;}
  const v=V_().v;let n=0;marcaSalvo('enviando foto…');
  for(const f of files){try{const b=await comprime(f);const cam=`${v.numero}/${r.id}/${uid()}.jpg`;
      await N.sbUp('vistorias',cam,b,'image/jpeg');
      const x=await sb('vistoria_fotos',{method:'POST',body:{resposta_id:r.id,caminho:cam,criado_por:eu()},prefer:'return=representation'});
      if(x&&x[0])r.fotos.push(x[0]);n++;}catch(e){toast('Foto não subiu: '+e.message,true);}}
  if(n)marcaSalvo('foto salva '+agora().slice(-5));desenhaVist();
}
const FURL={};
async function urlFoto(c){if(FURL[c])return FURL[c];try{FURL[c]=await N.sbAssina('vistorias',c);}catch(e){FURL[c]='';}return FURL[c];}
function pintaFotos(raiz){raiz.querySelectorAll('img[data-ft]').forEach(async im=>{const u=await urlFoto(im.dataset.ft);if(u)im.src=u;
  im.onclick=ev=>{ev.preventDefault();ev.stopPropagation();verFoto(im.dataset.ft,im.dataset.fid);};});}
async function verFoto(c,fid){const u=await urlFoto(c);const V=V_();const r=fid&&V?V.resp.find(x=>x.fotos.some(f=>f.id===fid)):null;
  const tira=r&&V.v.situacao==='andamento'&&podeSetor(V.sets.find(s=>s.setor_id===r.setor_id)||{});
  abreMod(`<h3>Foto<button class="x" data-fx>×</button></h3><div class="cp"><img src="${esc(u)}" alt="Foto" style="width:100%;border-radius:10px"></div>${tira?'<div class="ff"><button class="btn del" id="bTira">Tirar esta foto</button></div>':''}`);
  $('lpMod').querySelector('[data-fx]').onclick=fechaMod;
  if($('bTira'))$('bTira').onclick=async()=>{try{await sb(`vistoria_fotos?id=eq.${fid}`,{method:'DELETE'});try{await N.sbTira('vistorias',c);}catch(e){}
    r.fotos=r.fotos.filter(f=>f.id!==fid);fechaMod();desenhaVist();}catch(e){toast(e.message,true);}};}

/* ---------- PIN: assina quem está logado, com o PIN dele ---------- */
function pedePin(tit,txt,ok){
  abreMod(`<h3>${esc(tit)}<button class="x" data-fx>×</button></h3><div class="cp"><div class="leg">${txt}</div><div class="pin"><input id="pinM" inputmode="numeric" type="password" autocomplete="off" placeholder="PIN"><span id="pinE" class="perr"></span></div></div><div class="ff"><button class="btn" data-fx>Voltar</button><button class="btn pri" id="pinOk">Confirmar</button></div>`);
  const m=$('lpMod');m.querySelectorAll('[data-fx]').forEach(b=>b.onclick=fechaMod);
  const vai=async()=>{const p=$('pinM').value.trim();if(!p){$('pinE').textContent='Digite o PIN';return;}
    if(!N.quem){$('pinE').textContent='Atualize o ERP (Ctrl+Shift+R).';return;}
    $('pinOk').disabled=true;$('pinE').textContent='Conferindo…';let q=null;try{q=await N.quem(p);}catch(e){}$('pinOk').disabled=false;
    if(!q){$('pinE').textContent='PIN não encontrado.';$('pinM').select();return;}
    if(!mesmo(q.nome,eu())){$('pinE').textContent=`Esse PIN é de ${q.nome}. Assina quem está no sistema: ${eu()}.`;$('pinM').select();return;}
    fechaMod();ok(q.nome);};
  $('pinOk').onclick=vai;$('pinM').onkeydown=e=>{if(e.key==='Enter')vai();};setTimeout(()=>$('pinM')&&$('pinM').focus(),50);
}
function fecharVist(){const v=V_().v;
  pedePin('Fechar a vistoria Nº '+n4(v.numero),'Depois de fechada não muda mais.',async nome=>{
    try{const x=await sb(`vistorias?id=eq.${v.id}`,{method:'PATCH',body:{situacao:'fechada',fechada_por:nome},prefer:'return=representation'});if(x&&x[0])Object.assign(v,x[0]);
      toast('Vistoria fechada.');LP.cur=-1;desenhaVist();topo();}catch(e){toast(e.message,true);}});}

/* =====================================================================
   CIÊNCIA (vistoria fechada)
   ===================================================================== */
const ehCiencia=()=>V_().v.situacao==='fechada'&&pode('pcp.limp.ciencia');
/* o não conforme que a própria pessoa vistoriou entra direto: ninguém confere o próprio trabalho */
const autoItem=s=>mesmo(s.concluido_por,eu());
function gravCiencia(r,s){
  const g=ehCiencia()&&!autoItem(s)?`<div class="seg mini">${GRAV.map(([k,n])=>`<button data-cg="${k}" class="${r.gravidade===k?'on':''}">${n}</button>`).join('')}</div>`:`<span class="pill ${gCls(r.gravidade)}">${gRot(r.gravidade)}</span>`;
  return g+(r.gravidade_orig&&r.gravidade_orig!==r.gravidade?`<span class="gmud">${esc(pri(s.concluido_por||s.responsavel))} marcou <s>${gRot(r.gravidade_orig)}</s> · mudado por ${esc(pri(r.gravidade_por))}</span>`:'');}
function confCiencia(r,s){
  const vc=V_().v.situacao;
  if(vc==='fechada'&&ehCiencia()&&autoItem(s))return `<span class="tag n" style="margin-left:0">Você vistoriou</span><span class="gmud">entra direto, sem conferência</span>`;
  if(ehCiencia()){const loc=r._conf||r.confere;
    return `<div class="conf"><button class="s ${loc==='sim'?'on':''}" data-cf="sim">Confere</button><button class="n ${loc==='nao'?'on':''}" data-cf="nao">Não confere</button></div>${loc==='nao'?`<input data-just="1" value="${esc(r.justificativa_confere||'')}" placeholder="Justificativa *" style="margin-top:6px;width:100%;height:32px;font-size:12.5px">`:''}`;}
  if(r.confere==='sim')return `<span class="pill p-ok">Confere</span>${r.conferido_por?'<span class="gmud">'+esc(pri(r.conferido_por))+'</span>':''}`;
  if(r.confere==='nao')return `<span class="pill Baixa">Não confere</span><span class="gmud">${esc(r.justificativa_confere||'')}</span>`;
  return '<span style="color:var(--ink3)">a conferir</span>';}
function telaCiencia(){
  const V=V_(),v=V.v,L=ncsDe(V),sets=Object.fromEntries(V.sets.map(s=>[s.setor_id,s]));
  const pend=ehCiencia()?L.filter(r=>!autoItem(sets[r.setor_id]||{})&&!(r.confere==='sim'||(r.confere==='nao'&&String(r.justificativa_confere||'').trim()))).length:0;
  const cab=`<div class="migalha"><a data-volta="1">PCP › Checklist semanal de limpeza</a> › Nº ${n4(v.numero)}</div><div class="topo"><h1>Checklist semanal de limpeza · Nº ${n4(v.numero)}</h1><button class="btn" id="bPdfV">Salvar PDF</button><div class="dir">Semana de ${br(v.semana)} · Fechada por ${esc(pri(v.fechada_por))} em ${dh(v.fechada_em)} · ${pcConf(V)}% conforme<br>${L.length} não conformes</div></div>`;
  $('app').innerHTML=`<div class="lp">${cab}${porSetor(V)}
   <div class="caixa"><h3>Não conformidades<span class="dir">${ehCiencia()?'Confere / Não confere em cada uma · a gravidade pode ser corrigida':'conferência'}</span></h3><div class="cp">${L.length?quebraTipos(L)+tabNC(L,true):'<div class="vazio" style="color:var(--ok);font-weight:600">Nenhuma não conformidade. Só dar ciência.</div>'}</div></div>
   ${v.situacao==='ciencia'?`<div class="caixa"><div class="feito"><div class="bola">&#10003;</div><b>Ciência de ${esc(v.ciencia_por)} em ${dh(v.ciencia_em)}</b><span>Os não conformes com Confere entram nos indicadores. A correção é cobrada fora do sistema; na próxima vistoria, item que voltar não conforme aparece como reincidente.</span></div></div>`
    :ehCiencia()?`<div class="caixa"><h3>Dar ciência</h3><div class="cp"><div class="leg">Só libera com todos os não conformes conferidos (Não confere precisa de justificativa). Os dos setores que você mesmo vistoriou entram direto. A cobrança da correção é feita fora do sistema.</div><div class="pin"><button class="btn pri gr" id="bCien" ${pend?'disabled':''}>Dar ciência com meu PIN</button>${pend?`<span style="color:var(--ink3)">${pend} item(ns) sem conferência</span>`:''}</div></div></div>`
    :'<div class="lpav">Aguardando a ciência de quem confere o checklist.</div>'}</div>`;
  const a=$('app');a.querySelectorAll('[data-volta]').forEach(x=>x.onclick=()=>ir('lista'));
  $('bPdfV').onclick=pdfVist;
  a.querySelectorAll('tr[data-r]').forEach(tr=>{const r=V.resp.find(x=>x.id===tr.dataset.r);if(!r)return;
    tr.querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>gravaC(r,{gravidade:b.dataset.cg,gravidade_por:eu()}));
    tr.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{const c=b.dataset.cf;
      if(c==='sim'){r._conf=null;gravaC(r,{confere:'sim',justificativa_confere:null,conferido_por:eu(),conferido_em:agoraIso()});}
      else{r._conf='nao';if(String(r.justificativa_confere||'').trim())gravaC(r,{confere:'nao',conferido_por:eu(),conferido_em:agoraIso()});else telaCiencia();}});
    tr.querySelectorAll('[data-just]').forEach(i=>{i.oninput=()=>{clearTimeout(i._t);i._t=setTimeout(()=>{const t=i.value.trim();
        if(t)gravaC(r,{confere:'nao',justificativa_confere:t,conferido_por:eu(),conferido_em:agoraIso()},true);
        else if(r.confere==='nao')gravaC(r,{confere:'pendente',justificativa_confere:null,conferido_por:null,conferido_em:null},true);},700);};});});
  pintaFotos(a);
  if($('bCien'))$('bCien').onclick=()=>pedePin('Dar ciência · Nº '+n4(v.numero),'Registra que você conferiu a vistoria. Depois disso não muda mais.',async nome=>{
    try{const x=await sb(`vistorias?id=eq.${v.id}`,{method:'PATCH',body:{situacao:'ciencia',ciencia_por:nome},prefer:'return=representation'});if(x&&x[0])Object.assign(v,x[0]);
      const rs=await sb(`vistoria_respostas?vistoria_id=eq.${v.id}&select=*&order=item_ordem.asc`);(rs||[]).forEach(n=>{const o=V.resp.find(y=>y.id===n.id);if(o){const f=o.fotos;Object.assign(o,n);o.fotos=f;}});
      toast('Ciência registrada.');telaCiencia();}catch(e){toast(e.message,true);}});
}
async function gravaC(r,campos,semRedesenho){
  const antes={...r};Object.assign(r,campos);if(campos.confere)r._conf=null;if(!semRedesenho)telaCiencia();
  try{const x=await sb(`vistoria_respostas?id=eq.${r.id}`,{method:'PATCH',body:campos,prefer:'return=representation'});if(x&&x[0]){const f=r.fotos;Object.assign(r,x[0]);r.fotos=f;}
    marcaSalvo('salvo '+agora().slice(-5));if(semRedesenho){const b=$('bCien');if(b){telaCienciaMantemFoco();}}}
  catch(e){Object.assign(r,antes);toast('Não gravou: '+e.message,true);telaCiencia();}
}
function telaCienciaMantemFoco(){const a=document.activeElement,id=a&&a.closest&&a.closest('tr[data-r]')?a.closest('tr[data-r]').dataset.r:null,pos=a&&a.selectionStart;
  telaCiencia();if(id){const i=document.querySelector(`tr[data-r="${id}"] [data-just]`);if(i){i.focus();try{i.setSelectionRange(pos,pos);}catch(e){}}}}

/* ---------- PDF da vistoria (modal padrão do ERP) ---------- */
async function dataUrl(u){try{const b=await (await fetch(u)).blob();return await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b);});}catch(e){return '';}}
function folhaModal(titulo,sub,arquivo,corpo,css){
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(arquivo)}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${$('cssFolha').textContent}${css||''}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.folha{box-shadow:none!important;margin:0!important}@page{size:A4;margin:0}</style></head><body>${corpo}</body></html>`;
  const P=(()=>{try{return window.parent!==window&&typeof window.parent.csFolhaModal==='function'?window.parent:null;}catch(e){return null;}})();
  if(P){try{P.csFolhaModal({titulo,sub,arquivo,html});return;}catch(e){}}
  const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}
}
const CSSREL=`.rel .empd b{font-size:12pt}.rk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.rk div{border:1px solid #1A1D23;border-radius:6px;padding:6px 10px}.rk span{display:block;font-size:6.8pt;text-transform:uppercase;letter-spacing:.04em;color:#545C69}.rk b{font-size:13pt}
.rt{width:100%;border-collapse:collapse;font-size:8.2pt;margin:6px 0 10px}.rt th{text-align:left;font-size:6.8pt;text-transform:uppercase;letter-spacing:.04em;color:#545C69;border-bottom:1.2px solid #1A1D23;padding:4px 5px}.rt td{padding:4px 5px;border-bottom:1px solid #E4E2DC;vertical-align:top}.rt .n{text-align:right}
.rh{font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}.rb{display:grid;grid-template-columns:38mm 1fr 14mm;gap:6px;align-items:center;font-size:8pt;margin:3px 0}.rb i{display:block;height:8px;background:#1A1D23;border-radius:2px}.rb em{font-style:normal;text-align:right}
.pf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pf figure{margin:0;width:42mm}.pf img{width:42mm;height:32mm;object-fit:cover;border-radius:4px;border:1px solid #E4E2DC}.pf figcaption{font-size:6.8pt;color:#545C69;margin-top:2px}`;
async function pdfVist(){const V=V_(),v=V.v,L=ncsDe(V);toast('Montando o PDF…');
  const fotos=[];for(const r of L)for(const f of r.fotos){const u=await urlFoto(f.caminho);if(u)fotos.push({src:await dataUrl(u),leg:r.setor_nome+' · '+r.item_nome});}
  const corpo=`<div class="folha f2 rel"><div class="c1">${N.logo?`<img src="${N.logo()}" alt="Atrius">`:''}<div class="empd"><b>Checklist semanal de limpeza · Nº ${n4(v.numero)}</b>Semana de ${br(v.semana)} · fechada por ${esc(v.fechada_por||'—')} em ${dh(v.fechada_em)||'—'}${v.ciencia_em?' · ciência de '+esc(v.ciencia_por)+' em '+dh(v.ciencia_em):''}<br>Gerado em ${new Date().toLocaleString('pt-BR')} por ${esc(usuario())}</div></div>
   <div class="rk"><div><span>Itens</span><b>${V.resp.length}</b></div><div><span>% conforme</span><b>${pcConf(V)}%</b></div><div><span>Não conformes</span><b>${L.length}</b></div><div><span>Gravidade alta</span><b>${L.filter(r=>r.gravidade==='alta').length}</b></div><div><span>Reincidentes</span><b>${L.filter(r=>r.reincidente_de).length}</b></div></div>
   <div class="rh">Por setor</div><table class="rt"><thead><tr><th>Setor</th><th>Vistoriado por</th><th class="n">Itens</th><th class="n">Não conformes</th><th class="n">% conforme</th></tr></thead><tbody>${V.sets.map(s=>{const R=respDe(s),n=R.filter(r=>r.resposta==='nao_conforme').length;return `<tr><td>${esc(s.setor_nome)}</td><td>${esc(s.concluido_por||s.responsavel)}</td><td class="n">${R.length}</td><td class="n">${n}</td><td class="n">${Math.round((R.length-n)/Math.max(1,R.length)*100)}%</td></tr>`;}).join('')}</tbody></table>
   <div class="rh">Não conformidades</div>${L.length?`<table class="rt"><thead><tr><th>Setor</th><th>Item</th><th>Tipo</th><th>Observação</th><th>Gravidade</th><th>Conferência</th></tr></thead><tbody>${L.map(r=>`<tr><td>${esc(r.setor_nome)}</td><td>${esc(r.item_nome)}${r.reincidente_de?' (reincidente)':''}</td><td>${esc(r.tipo_nome||'')}${r.tipo_outro?': '+esc(r.tipo_outro):''}</td><td>${esc(r.observacao||'')}</td><td>${gRot(r.gravidade)}${r.gravidade_orig?' (era '+gRot(r.gravidade_orig)+')':''}</td><td>${r.confere==='sim'?'Confere':r.confere==='nao'?'Não confere: '+esc(r.justificativa_confere||''):'—'}</td></tr>`).join('')}</tbody></table>`:'<p style="font-size:9pt">Nenhuma não conformidade.</p>'}
   ${fotos.length?`<div class="rh">Fotos</div><div class="pf">${fotos.map(f=>`<figure><img src="${f.src}"><figcaption>${esc(f.leg)}</figcaption></figure>`).join('')}</div>`:''}</div>`;
  folhaModal('Checklist de limpeza · Nº '+n4(v.numero),'Semana de '+br(v.semana),'Checklist de limpeza '+n4(v.numero),corpo,CSSREL);
}

/* ---------- modal pequeno ---------- */
function abreMod(html){fechaMod();const v=document.createElement('div');v.id='lpVeu';v.className='lpVeu';v.onclick=fechaMod;
  const m=document.createElement('div');m.id='lpMod';m.className='lpMod';m.innerHTML=html;m.onclick=e=>e.stopPropagation();document.body.append(v,m);}
function fechaMod(){['lpVeu','lpMod'].forEach(i=>{const x=document.getElementById(i);if(x)x.remove();});}

/* =====================================================================

function contaRel(){
  const F=LP.rel,vs=RD.vs||[],rs=(RD.rs||[]).filter(r=>!F.setor||r.setor_nome===F.setor);
  /* só entra o não conforme com Confere: o "Não confere" do Neuci sai da conta */
  const nc=rs.filter(r=>r.resposta==='nao_conforme'&&r.confere==='sim'&&(!F.tipo||r.tipo_nome===F.tipo)&&(!F.grav||r.gravidade===F.grav));
  const ncTodos=rs.filter(r=>r.resposta==='nao_conforme'&&r.confere==='sim');
  const sem=vs.map(v=>{const R=rs.filter(r=>r.vistoria_id===v.id),n=ncTodos.filter(r=>r.vistoria_id===v.id).length;return {v,tot:R.length,n,pc:R.length?Math.round((R.length-n)/R.length*1000)/10:null};}).filter(x=>x.tot);
  const conta=(L,k)=>{const c={};L.forEach(r=>{const x=typeof k==='function'?k(r):r[k];c[x]=(c[x]||0)+1;});return Object.entries(c).sort((a,b)=>b[1]-a[1]);};

    itens:conta(nc,r=>r.item_nome).slice(0,8),reinc:nc.filter(r=>r.reincidente_de),media:tot?Math.round((tot-totN)/tot*1000)/10:null};
}

    el.addEventListener('dragstart',e=>{arr=el;el.classList.add('arr0');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.dataset.it);}catch(_){} });
    el.addEventListener('dragend',()=>{el.classList.remove('arr0');arr=null;});
    el.addEventListener('dragover',e=>{if(!arr||arr.parentNode!==el.parentNode||arr===el)return;e.preventDefault();const r=el.getBoundingClientRect();el.parentNode.insertBefore(arr,e.clientY<r.top+r.height/2?el:el.nextSibling);});
    el.addEventListener('drop',async e=>{e.preventDefault();const box=el.parentNode;const ids=[...box.querySelectorAll('[data-it]')].map(x=>x.dataset.it);
      for(let k=0;k<ids.length;k++){const x=it(ids[k]);if(x&&x.ordem!==k+1){const r=await patch('checklist_itens',x.id,{ordem:k+1});if(r)Object.assign(x,r);}}desenhaCfg();});
  });
}
function cfgTipos(){const T=LP.base.tipos;
  return `<div class="caixa"><h3>Tipos de problema<span class="dir">o que aparece na lista do não conforme</span><button class="btn sm" id="bNovoTipo" style="margin-left:10px">Adicionar tipo</button></h3><div class="cp" style="padding:6px 16px">${T.map(t=>`<div class="cfgit ${t.ativo?'':'inat'}"><span class="arr"></span><input data-tnome="${t.id}" value="${esc(t.nome)}" ${t.fixo||!t.ativo?'disabled':''}>${t.fixo?'<span class="leg" style="margin:0">fixo: pede para escrever qual é o problema</span>':t.ativo?`<button class="lk" data-tinat="${t.id}">Inativar</button>`:`<span class="tag">Inativo</span><button class="lk az" data-treat="${t.id}">Reativar</button>`}</div>`).join('')}</div></div>`;}
function ligaTipos(){const T=LP.base.tipos,a=$('app'),tp=id=>T.find(x=>x.id===id);
  a.querySelectorAll('[data-tnome]').forEach(i=>i.onchange=async()=>{const x=tp(i.dataset.tnome),v=i.value.trim();if(!v){i.value=x.nome;return;}const r=await patch('tipos_problema',x.id,{nome:v});if(r)Object.assign(x,r);});
  a.querySelectorAll('[data-tinat],[data-treat]').forEach(b=>b.onclick=async()=>{const x=tp(b.dataset.tinat||b.dataset.treat);const r=await patch('tipos_problema',x.id,{ativo:!!b.dataset.treat});if(r){Object.assign(x,r);desenhaCfg();}});
  $('bNovoTipo').onclick=async()=>{const o=Math.max(0,...T.filter(t=>!t.fixo).map(t=>t.ordem))+1;const r=await post('tipos_problema',{checklist_id:CK,nome:'Novo tipo',ordem:o});
    if(r){T.push(r);T.sort((a,b)=>a.ordem-b.ordem);desenhaCfg();const i=document.querySelector(`[data-tnome="${r.id}"]`);if(i){i.focus();i.select();}}};
}
const DIAS=[[1,'Segunda'],[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta'],[6,'Sábado'],[0,'Domingo']];
/* os quatro avisos (decisão de 11/11): realizada, não realizada, cobrança da ciência (repete até a ciência) e ciência registrada */
const AVISOS=[
 {k:'realizada',t:'Vistoria realizada',d:'Sai na hora em que a vistoria é fechada, com o resultado: % conforme e os não conformes.',quando:'Na hora do fechamento'},
 {k:'nao_realizada',t:'Vistoria não realizada',d:'Sai se a vistoria não foi fechada até o dia e a hora. A partir daí ela aparece como Atrasada na lista.',dia:5,hora:'17:30'},
 {k:'cobranca',t:'Cobrança da ciência',d:'"Você ainda não conferiu o checklist semanal." Repete no intervalo até a ciência ser dada.',dia:1,hora:'12:00',rep:48},
 {k:'ciencia',t:'Ciência registrada',d:'Sai na hora em que a ciência é dada, seja por quem for, com o resultado da conferência.',quando:'Na hora da ciência'}];
const AUTO='#responsaveis';
const CONT=()=>{let l=[];try{l=N.contatos?N.contatos():PESSOAS().map(n=>({nome:n,funcao:'',email:''}));}catch(e){}return l;};
const ehMail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v||'').trim());
const iniciais=n=>String(n).split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');
function cfgRegras(){const R=LP.base.regras,C=CONT(),resp=[...new Set(LP.base.setores.filter(s=>s.ativo).map(s=>pri(s.responsavel)))].join(' e ');
  const tk=(v,k,c,i)=>{
    if(v===AUTO)return `<span class="tk" title="Muda sozinho se trocar quem vistoria o setor"><span class="av2">⚙</span><b>Quem vistoria os setores</b><span>${esc(resp||'automático')}</span><button data-tira="${k}|${c}|${i}" title="Tirar">×</button></span>`;
    const p=ehMail(v)?null:C.find(x=>mesmo(x.nome,v));
    const sub=ehMail(v)?'e-mail digitado':p&&p.email?esc(p.email):'<em class="semail">sem e-mail no cadastro</em>';
    return `<span class="tk"><span class="av2 ${ehMail(v)?'m':''}">${esc(iniciais(v))}</span><b>${esc(v)}</b><span>${sub}</span><button data-tira="${k}|${c}|${i}" title="Tirar">×</button></span>`;};
  const dest=(a,c,rot)=>{const L=((R[a.k]||{}).valor||{})[c]||[];
    return `<div class="dst"><div class="rot">${rot}</div><div class="lin">${L.map((v,i)=>tk(v,a.k,c,i)).join('')}<input class="add" data-a="${a.k}" data-c="${c}" placeholder="Adicionar pessoa ou e-mail" autocomplete="off"><div class="sug"></div></div></div>`;};
  const quandoH=a=>{const v=(R[a.k]||{}).valor||{};if(a.quando)return `<div class="quando"><span class="qtx">${a.quando}</span></div>`;
    return `<div class="quando"><select data-rg="${a.k}" data-c="dia">${DIAS.map(([n,r])=>`<option value="${n}" ${+(v.dia??a.dia)===n?'selected':''}>${r}</option>`).join('')}</select><input type="time" data-rg="${a.k}" data-c="hora" value="${esc(v.hora||a.hora)}">${a.rep?`<select class="rep" data-rg="${a.k}" data-c="intervalo_h">${[24,48,72].map(h=>`<option value="${h}" ${+(v.intervalo_h||a.rep)===h?'selected':''}>Repete a cada ${h} h até a ciência</option>`).join('')}</select>`:''}</div>`;};
  const rm=((R.remetente||{}).valor||{}).nome||'ERP Atrius · Checklist de limpeza',gf=((R.guarda_fotos||{}).valor||{}).meses||6;
  return `<div class="envio"><div><div class="rot">Envio de e-mails</div><div class="st" id="envSt"><i class="cinza"></i>Conferindo…</div><small id="envUlt"></small></div>
     <div><div class="rot">Nome do remetente</div><input data-rg="remetente" data-c="nome" value="${esc(rm)}"></div>
     <div><div class="rot">Testar o envio</div><div class="tl"><input id="tsMail" type="email" placeholder="e-mail para receber o teste"><button class="btn" id="bTeste">Enviar teste</button></div><small id="tsRes">Manda um e-mail de exemplo agora, para conferir se chega.</small></div></div>
   ${AVISOS.map(a=>{const r=R[a.k]||{ligado:true,valor:{}};
     return `<div class="avc ${r.ligado?'':'off'}"><div class="cab"><button class="sw ${r.ligado?'on':''}" data-sw="${a.k}" title="${r.ligado?'Desligar':'Ligar'}"></button><div class="t"><b>${a.t}</b><small>${a.d}</small></div><div class="dir"><button class="lkm" data-ver="${a.k}">Ver o e-mail</button></div></div>
       <div class="corpo"><div><div class="rot">Quando</div>${quandoH(a)}</div><div>${dest(a,'para','Para')}${dest(a,'copia','Cópia')}</div></div></div>`;}).join('')}
   <div class="avc"><div class="cab"><div class="t"><b>Fotos das vistorias</b><small>Depois do prazo a foto sai do Storage; o item, a observação e o tipo continuam no histórico.</small></div><div class="dir"><select data-rg="guarda_fotos" data-c="meses">${[3,6,12,24].map(h=>`<option value="${h}" ${+gf===h?'selected':''}>Guardar por ${h} meses</option>`).join('')}</select></div></div></div>
   <div class="caixa" style="margin-top:14px"><h3>Histórico de envios<span class="dir">os últimos 15</span></h3><div id="lgAv"><div class="vazio">Carregando…</div></div></div>
   <div class="leg">Cada mudança grava na hora e vale a partir do próximo envio. O e-mail de quem está em Pessoas e permissões vem do cadastro; qualquer outro endereço pode ser digitado direto.</div>`;}
async function gravaRegra(k,ligado,valor){const R=LP.base.regras,r=R[k];
  try{let x;if(r)x=await sb(`checklist_regras?checklist_id=eq.${CK}&chave=eq.${k}`,{method:'PATCH',body:{ligado,valor,alterado_em:agoraIso(),alterado_por:usuario()},prefer:'return=representation'});
    else x=await sb('checklist_regras',{method:'POST',body:{checklist_id:CK,chave:k,ligado,valor,alterado_por:usuario()},prefer:'return=representation'});
    if(x&&x[0])R[k]=x[0];marcaSalvo('salvo '+agora().slice(-5));}catch(e){toast(e.message,true);}}
function ligaRegras(){const R=LP.base.regras,a=$('app');
  const cur=k=>R[k]||{ligado:true,valor:{}};
  const lst=(k,c)=>[...(((cur(k).valor||{})[c])||[])];
  const grava=async(k,c,L)=>{const r=cur(k);await gravaRegra(k,r.ligado,{...(r.valor||{}),[c]:L});};
  a.querySelectorAll('[data-sw]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,r=cur(k);await gravaRegra(k,!r.ligado,r.valor||{});desenhaCfg();});
  a.querySelectorAll('[data-rg]').forEach(i=>i.onchange=async()=>{const k=i.dataset.rg,c=i.dataset.c,r=cur(k);let v=i.value;if(['dia','intervalo_h','meses'].includes(c))v=+v;
    if(c==='nome'&&!String(v).trim()){i.value=(r.valor||{}).nome||'';return;}
    await gravaRegra(k,r.ligado,{...(r.valor||{}),[c]:v});});
  a.querySelectorAll('[data-tira]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const [k,c,i]=b.dataset.tira.split('|');const L=lst(k,c);L.splice(+i,1);await grava(k,c,L);desenhaCfg();});
  const C=CONT();
  a.querySelectorAll('input.add').forEach(inp=>{const box=inp.parentNode.querySelector('.sug'),k=inp.dataset.a,c=inp.dataset.c;let f=0;
    inp.parentNode.onclick=()=>inp.focus();
    const poe=async v=>{const ja=[...lst(k,'para'),...lst(k,'copia')];if(ja.some(x=>mesmo(x,v)))return toast('Já está neste aviso.',true);const L=lst(k,c);L.push(v);await grava(k,c,L);desenhaCfg();
      const n=document.querySelector(`input.add[data-a="${k}"][data-c="${c}"]`);if(n)n.focus();};
    const mostra=()=>{const q=semAc(inp.value),ja=[...lst(k,'para'),...lst(k,'copia')];
      const L=C.filter(p=>!ja.some(x=>mesmo(x,p.nome))&&(!q||semAc(p.nome+' '+p.funcao+' '+p.email).includes(q))).slice(0,8);
      const auto=!ja.includes(AUTO)&&(!q||'quem vistoria os setores responsaveis'.includes(q));
      const mail=ehMail(inp.value)&&!ja.some(x=>mesmo(x,inp.value.trim()));
      const ops=[...(auto?[{v:AUTO,a:'⚙',n:'Quem vistoria os setores',s:'automático, muda se trocar o responsável'}]:[]),...L.map(p=>({v:p.nome,a:iniciais(p.nome),n:p.nome,s:(p.funcao?p.funcao+' · ':'')+(p.email||'sem e-mail no cadastro')})),...(mail?[{v:inp.value.trim().toLowerCase(),a:'@',m:1,n:'Adicionar '+inp.value.trim().toLowerCase(),s:'e-mail digitado'}]:[])];
      if(f>=ops.length)f=Math.max(0,ops.length-1);
      box.innerHTML=ops.map((o,i)=>`<button type="button" data-v="${esc(o.v)}" class="${i===f?'f':''}"><span class="av2 ${o.m?'m':''}">${esc(o.a)}</span><div>${esc(o.n)}<small>${esc(o.s)}</small></div></button>`).join('')||(q?'<div class="sugv">Digite o e-mail completo para adicionar quem não está no cadastro.</div>':'');
      box.classList.toggle('on',!!box.innerHTML);
      box.querySelectorAll('[data-v]').forEach(b=>b.onmousedown=e=>{e.preventDefault();poe(b.dataset.v);});};
    inp.onfocus=mostra;inp.oninput=()=>{f=0;mostra();};inp.onblur=()=>setTimeout(()=>box.classList.remove('on'),150);
    inp.onkeydown=e=>{const bs=[...box.querySelectorAll('[data-v]')];
      if(e.key==='ArrowDown'){f=Math.min(f+1,bs.length-1);mostra();e.preventDefault();}
      else if(e.key==='ArrowUp'){f=Math.max(f-1,0);mostra();e.preventDefault();}
      else if(e.key==='Enter'){e.preventDefault();if(bs.length)poe(bs[Math.min(f,bs.length-1)].dataset.v);}
      else if(e.key==='Backspace'&&!inp.value){const L=lst(k,c);if(L.length){L.pop();grava(k,c,L).then(()=>{desenhaCfg();const n=document.querySelector(`input.add[data-a="${k}"][data-c="${c}"]`);if(n)n.focus();});}}};
  });
  a.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verModelo(b.dataset.ver));
  $('bTeste').onclick=async()=>{const v=$('tsMail').value.trim();if(!ehMail(v)){$('tsRes').textContent='Digite um e-mail válido.';return;}
    if(!N.fn){$('tsRes').textContent='Atualize o ERP (Ctrl+Shift+R).';return;}
    $('bTeste').disabled=true;$('tsRes').textContent='Enviando…';
    try{const r=await N.fn('checklist-avisos',{teste:v});$('tsRes').textContent=r&&r.ok?'Enviado para '+v+'. Confira a caixa de entrada (e o spam).':'Não enviou: '+((r&&r.erro)||'sem resposta');}
    catch(e){$('tsRes').textContent='Não enviou: '+e.message+(/404|Failed to fetch/i.test(e.message)?' (a função checklist-avisos ainda não foi publicada no Supabase)':'');}
    $('bTeste').disabled=false;carregaLog();};
  carregaLog();
}
/* como chega o e-mail: o mesmo texto que a função checklist-avisos manda */
function verModelo(k){const R=LP.base.regras,v=(R[k]||{}).valor||{},a=AVISOS.find(x=>x.k===k),C=CONT();
  const resp=[...new Set(LP.base.setores.filter(s=>s.ativo).map(s=>s.responsavel))];
  const nomes=L=>(L||[]).flatMap(x=>x===AUTO?resp:[x]).map(x=>{const p=C.find(c=>mesmo(c.nome,x));return p&&p.email?`${p.nome} <${p.email}>`:x;}).join(', ')||'ninguém';
  const M={realizada:['Checklist de limpeza Nº 0012 realizado','<p>A vistoria de limpeza da semana de 10/11/2026 foi realizada e fechada por Mariane Kluge em 14/11 09:40.</p><p><b>96% conforme</b> · 3 não conformes (alta 1, média 1, baixa 1) · 1 reincidente</p><p>Produção · Ausência de vazamentos aparentes · Vazamento · Alta<br>Expedição · Paletes organizados e em boas condições · Desorganização · Média<br>Copa · Piso limpo e seco · Sujeira · Baixa</p>'],
    nao_realizada:['Checklist de limpeza Nº 0012 não foi realizado','<p>A vistoria de limpeza da semana de 10/11/2026 não foi realizada no prazo.</p><p>Falta concluir: Copa (Mariane Kluge).</p>'],
    cobranca:['Você ainda não conferiu o checklist semanal de limpeza Nº 0012','<p>Você ainda não conferiu o checklist semanal de limpeza da semana de 10/11/2026.</p><p>Ele foi fechado em 14/11 09:40 e está esperando a conferência e a ciência (3 não conformes para conferir). Esta é a 2ª cobrança.</p>'],
    ciencia:['Ciência dada no checklist de limpeza Nº 0012','<p>Neuci Bernardi deu ciência no checklist semanal de limpeza da semana de 10/11/2026 em 17/11 10:15.</p><p>3 não conformes: 2 confere, 1 não confere.</p>']}[k];
  abreMod(`<h3>Como chega o e-mail · ${esc(a.t)}<button class="x" data-fx>×</button></h3><div class="mail"><div class="hd"><b>De:</b> ${esc(((R.remetente||{}).valor||{}).nome||'ERP Atrius')}<br><b>Para:</b> ${esc(nomes(v.para))}${(v.copia||[]).length?'<br><b>Cópia:</b> '+esc(nomes(v.copia)):''}<br><b>Assunto:</b> ${esc(M[0])}</div><div class="bd">${M[1]}<p><a>Abrir o ERP</a> (PCP › Checklist semanal de limpeza)</p><div class="rod">Enviado pelo ERP Atrius. As regras deste aviso ficam em Configurações › Produção › Checklist semanal de limpeza.</div></div></div><div class="leg" style="padding:0 20px 16px">Exemplo com dados fictícios da Nº 0012; o e-mail de verdade sai com os dados da vistoria.</div>`);
  $('lpMod').classList.add('larga');$('lpMod').querySelector('[data-fx]').onclick=fechaMod;}
const TIPO_AV={realizada:'Vistoria realizada',nao_realizada:'Vistoria não realizada',cobranca:'Cobrança da ciência',ciencia:'Ciência registrada',teste:'Teste de envio'};
async function carregaLog(){const el=$('lgAv');if(!el)return;
  try{const L=await sb('notificacoes_log?select=*&order=enviado_em.desc&limit=40')||[];
    const ok=L.find(x=>x.ok),st=$('envSt'),u=$('envUlt');
    if(st){st.innerHTML=ok?'<i></i>Funcionando':L.length?'<i class="verm"></i>Com falha':'<i class="cinza"></i>Ainda sem envios';if(u)u.textContent=ok?'Último envio: '+dh(ok.enviado_em)+' · '+(TIPO_AV[ok.tipo]||ok.tipo):L.length?'Veja o erro no histórico abaixo.':'Mande um teste para conferir.';}
    /* um envio vai para várias pessoas: junta numa linha só */
    const G=[];L.forEach(x=>{const g=G.find(y=>y.tipo===x.tipo&&y.vistoria_id===x.vistoria_id&&y.ok===x.ok&&Math.abs(new Date(y.enviado_em)-new Date(x.enviado_em))<120000);if(g)g.destinatario+=', '+x.destinatario;else G.push({...x});});
    el.innerHTML=G.length?`<table class="tv"><thead><tr><th>Quando</th><th>Aviso</th><th>Para</th><th>Resultado</th></tr></thead><tbody>${G.map(x=>`<tr><td class="m">${dh(x.enviado_em)}</td><td>${esc(TIPO_AV[x.tipo]||(/^resumo_/.test(x.tipo)?'Resumo semanal':x.tipo))}</td><td>${esc(x.destinatario)}</td><td>${x.ok?'<span class="pill p-ok">Enviado</span>':`<span class="pill Alta">Falhou</span><span class="gmud">${esc(x.erro||'')}</span>`}</td></tr>`).join('')}</tbody></table>`:'<div class="vazio">Nenhum aviso enviado ainda.</div>';}
  catch(e){el.innerHTML=avisoErro(e.message);}}

render();

</script>
