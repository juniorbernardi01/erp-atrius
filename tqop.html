<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: tablet 10,1" deitado (1280×800), interativo: os botões mudam o status, os três pontinhos abrem a barra lateral, Formulação e Modo de Fazer e Análise abrem na tela toda. Foco do cartão: status, produto, tanque, volume, hora de pronto, máquina e o botão. */
:root{--bg:#F3F4F6;--card:#fff;--fg:#0E1B33;--ink2:#374151;--ink3:#6B7280;--line:#E5E7EB;--line2:#F1F2F4;--navy:#0E1B33;--azul:#1B4F9C;--ok:#15803D;--okbg:#DCFCE7;--amb:#B45309;--ambbg:#FEF3C7;--mau:#B91C1C;--maubg:#FEE2E2;--cinza:#6B7280;--cinzabg:#E5E7EB;--roxo:#6D28D9;--roxobg:#EDE9FE;--lar:#EA580C;--azbg:#DBEAFE;--az:#1D4ED8;--proxbg:#D9DDE4;--proxfg:#374151;--larbg:#FFEDD5;--font:Inter,system-ui,sans-serif;--mono:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0F17;--card:#1F2636;--fg:#E7E9EE;--ink2:#C9CDD6;--ink3:#8B93A1;--line:#3A4558;--line2:#2C3546;--okbg:#16432B;--ok:#4ADE80;--ambbg:#4A360C;--amb:#FBBF24;--maubg:#4C1D21;--mau:#F87171;--cinzabg:#384255;--cinza:#9CA3AF;--roxobg:#36295E;--roxo:#C4B5FD;--azbg:#1A3260;--az:#93C5FD;--proxbg:#141A26;--proxfg:#AEB5C2;--larbg:#4D2810;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F17;--card:#1F2636;--fg:#E7E9EE;--ink2:#C9CDD6;--ink3:#8B93A1;--line:#3A4558;--line2:#2C3546;--okbg:#16432B;--ok:#4ADE80;--ambbg:#4A360C;--amb:#FBBF24;--maubg:#4C1D21;--mau:#F87171;--cinzabg:#384255;--cinza:#9CA3AF;--roxobg:#36295E;--roxo:#C4B5FD;--azbg:#1A3260;--az:#93C5FD;--proxbg:#141A26;--proxfg:#AEB5C2;--larbg:#4D2810;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--font)}
.wrap{max-width:1300px;margin:0 auto;padding-block:12px 50px;padding-inline:16px}
.nota{font-size:12px;color:var(--ink3);margin-bottom:10px}.nota b{color:var(--fg)}
.tablet{width:1280px;max-width:100%;margin:0 auto 20px;background:var(--bg);border:10px solid #111;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.tela{width:1260px;max-width:100%;height:780px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;height:62px;flex:none}
.top .logo{background:#fff;border-radius:8px;padding:3px 10px;font:800 20px var(--font);color:#1B4F9C;letter-spacing:-.02em}
.top .ola{font-size:16px;color:#C9D4EA}.top .ola b{color:#fff}
.top .res{display:flex;gap:6px;margin:0 auto}.top .res span{font-size:12px;padding:5px 10px;border-radius:999px;font-weight:600}.top .res span b{font-family:var(--mono)}
.top .res .ok{background:var(--okbg);color:var(--ok)}.top .res .amb{background:var(--ambbg);color:var(--amb)}.top .res .az{background:#DBEAFE;color:#1D4ED8}.top .res .rx{background:var(--roxobg);color:var(--roxo)}.top .res .cz{background:rgba(255,255,255,.14);color:#fff}
.top .hora{text-align:right}.top .hora b{display:block;font:700 26px/1 var(--mono)}.top .hora small{font-size:11px;color:#C9D4EA}
.top .menu{width:38px;height:38px;border-radius:50%;background:#2B3A57;display:grid;place-items:center;font-size:20px;color:#fff}
.grade{flex:1;display:grid;grid-template-columns:repeat(24,1fr);grid-template-rows:1fr 1fr;gap:10px;padding:10px 12px;min-height:0}
.tq{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tq.c8{grid-column:span 8}.tq.c7{grid-column:span 7}.tq.c5{grid-column:span 5}
.tq .cab{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:46px;flex:none}
.tq .cab b{font:800 24px/1 var(--font)}
.tq .cab .pts{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#2B3A57;display:grid;place-items:center;font-size:18px;cursor:pointer}
.st{margin:8px 12px 0;padding:8px 12px;border-radius:10px;font:800 13.5px var(--font);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap}
.st span:first-child{overflow:hidden;text-overflow:ellipsis}.st .t{font:700 14px var(--mono)}
.st.ok{background:var(--okbg);color:var(--ok)}.st.amb{background:var(--ambbg);color:var(--amb)}.st.mau{background:var(--maubg);color:var(--mau)}.st.cz{background:var(--cinzabg);color:var(--cinza)}.st.az{background:var(--azbg);color:var(--az)}.st.rx{background:var(--roxobg);color:var(--roxo)}
.prod{padding:9px 14px 0;font:800 22px/1.05 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}.tiles,.st,.prox{flex:none}.prod small{display:block;font:500 12px var(--font);color:var(--ink3);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;padding:9px 12px 0}
.tiles div{background:var(--line2);border-radius:10px;padding:7px 10px;min-width:0}
.tiles div span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700;white-space:nowrap}
.tiles div b{display:block;font:700 19px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.tiles div.dest b{font-size:26px;font-weight:800;color:var(--fg)}.tiles div.dest span{color:var(--ink2)}
.acoes{margin:auto 12px 8px;display:flex;flex-direction:column;gap:6px;padding-top:9px}
.acao{height:48px;border-radius:12px;border:0;font:800 16px var(--font);color:#fff;background:var(--ok);display:grid;place-items:center;text-align:center;line-height:1.1;padding:0 8px;cursor:pointer;user-select:none}
.acao.amb{background:var(--amb)}.acao.az{background:var(--azul)}.acao.rx{background:var(--roxo)}.acao.off{background:var(--cinzabg);color:var(--ink3);cursor:default}
.sub2{display:flex;gap:6px}.sub2 div{flex:1;height:34px;white-space:nowrap;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 12.5px var(--font);color:var(--ink2);background:var(--card);cursor:pointer}
.sub2 div.feito{border-color:var(--okbg);background:var(--okbg);color:var(--ok)}.sub2 div.pend{border-color:#FDE68A;background:#FFFBEB;color:#92400E}.pd{font-style:normal;color:#F59E0B;margin-left:4px;font-size:15px;line-height:1}.sub2 div{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:3px}.sub2 .pd{display:inline;height:auto;background:none;border:0;padding:0}
.prox{background:var(--proxbg);padding:8px 12px;font-size:12px;color:var(--proxfg);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.prox i{font-style:normal;border:1.5px solid var(--proxfg);color:var(--proxfg);font:700 10px var(--font);letter-spacing:.05em;padding:2px 8px;border-radius:999px;flex:none}
.prox b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}.prox .h{margin-left:auto;font:700 12.5px var(--mono);color:var(--fg)}
.tq.c5 .cab{height:42px}.tq.c5 .cab b{font-size:21px}.tq.c5 .st{font-size:12.5px;padding:8px 10px}.tq.c5 .st .t{font-size:13px}
.tq.c5 .prod{font-size:17px}.tq.c5 .tiles{grid-template-columns:1fr 1.15fr 0.9fr;gap:5px;padding:9px 8px 0}.tq.c5 .tiles div{padding:6px 7px}.tq.c5 .tiles div b{font-size:14px}.tq.c5 .tiles div.dest b{font-size:19px}.tq.c5 .acoes{margin:auto 8px 8px}
.tq.c5 .acao{height:44px;font-size:14px}.tq.c5 .sub2 div{font-size:11.5px;padding:0 4px}.tq.c5 .prox{font-size:11.5px}
.acao small{display:block;font:500 10px var(--font);color:var(--ink3);margin-top:1px}.acao.off{cursor:pointer}
/* barra lateral */
.sombra{position:absolute;inset:0;background:rgba(14,27,51,.45);display:none}.sombra.on{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:520px;background:var(--card);box-shadow:-20px 0 40px rgba(0,0,0,.25);display:none;flex-direction:column}.drawer.on{display:flex}
.drawer .dh{background:var(--navy);color:#fff;padding:14px 16px;position:relative}.drawer .dh b{display:block;font-size:26px}.drawer .dh small{color:#C9D4EA;font-size:13px}.drawer .dh .x{position:absolute;right:14px;top:16px;width:32px;height:32px;border-radius:50%;background:#2B3A57;display:grid;place-items:center;cursor:pointer}
.dbtn{display:flex;gap:10px;padding:14px 16px 6px}.dbtn .acao{flex:1;height:56px;font-size:15.5px}
.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 16px 0}.meta div{background:var(--line2);border-radius:10px;padding:9px 10px}.meta span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700}.meta b{display:block;font:800 22px var(--mono)}.meta small{color:var(--ink3);font-size:11.5px}
.dbar{height:8px;background:var(--line2);border-radius:4px;margin:10px 16px 0;overflow:hidden}.dbar i{display:block;height:100%;background:var(--ok)}
.lista{flex:1;overflow:auto;padding:0 16px 14px;font-size:13.5px}.lista h4{margin:14px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.lista .li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}.lista .li.agora{background:var(--okbg);margin:0 -8px;padding:9px 8px;border-radius:8px;border:0}
.lista em{font-style:normal;font:700 14px var(--mono);width:48px;color:var(--ink2);flex:none}.lista .li>div{flex:1;min-width:0}.lista small{display:block;color:var(--ink3);font-size:11.5px}.lista s{color:var(--ink3)}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font:700 12px var(--font)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.mau{background:var(--maubg);color:var(--mau)}.pill.cz{background:var(--cinzabg);color:var(--cinza)}.pill.amb{background:var(--ambbg);color:var(--amb)}
/* tela cheia */
.full{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column}.full.on{display:flex}
.full .fh{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;height:62px;flex:none}.full .fh b{font-size:19px}.full .fh small{color:#C9D4EA;font-size:13px}.full .fh .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#2B3A57;display:grid;place-items:center;font-size:18px;cursor:pointer}
.full .fb{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:12px;padding:12px;min-height:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.box h3{margin:0;padding:10px 14px;font:800 12px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.box h3 span{margin-left:auto;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink2)}
.box .bb{padding:6px 14px;overflow:auto;flex:1}
.box .bf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex:none}.box .bf .acao{height:48px;padding:0 18px}.box .bf .acao.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink2)}.box .bf .acao.lar{background:var(--lar);width:48px;padding:0;font-size:22px}
table.t{width:100%;border-collapse:collapse;font-size:14px}.t th{font:600 10.5px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.t td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t td.m{font:700 14px var(--mono)}.t .in{display:inline-block;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;min-width:96px;font:700 15px var(--mono);background:var(--bg);color:var(--fg)}
.t .in.vazio{color:var(--ink3);font-weight:500}.ck{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);color:#fff;font-weight:800;cursor:pointer}.ck.on{background:var(--ok);border-color:var(--ok)}
.modo{list-style:none;margin:0;padding:0}.modo li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px;line-height:1.4;cursor:pointer}.modo li em{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 13px var(--font);flex:none}.modo li.feito em{background:var(--ok)}.modo li.feito{color:var(--ink3)}
.modo li small{display:block;color:var(--ink3);font-size:12px}
.full .ff{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--card);flex:none}.full .ff .acao{height:50px;padding:0 22px}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none}
.leg{font-size:13px;color:var(--ink2);line-height:1.6;max-width:1280px;margin:0 auto}
@keyframes pisca{0%,100%{background:#F97316;color:#fff}50%{background:#FFEDD5;color:#C2410C}}.tiles .pisca{animation:pisca 1s steps(1,end) infinite}.tiles .pisca span,.tiles .pisca b{color:inherit}@media (prefers-reduced-motion:reduce){.tiles .pisca{animation:none;background:#F97316;color:#fff}}

:root{--bok:#15803D;--brx:#6D28D9;--bamb:#B45309;--baz:#1B4F9C}
.acao{background:var(--bok)}.acao.amb{background:var(--bamb)}.acao.az{background:var(--baz)}.acao.rx{background:var(--brx)}.acao.off{background:var(--cinzabg);color:var(--ink3)}.ic.ok{background:var(--bok)!important}.ck.on{background:var(--bok);border-color:var(--bok)}.dbar i{background:var(--bok)}

.ic{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font:800 12px/1 var(--font)}

.lh,.lr{display:grid;grid-template-columns:52px 1fr 74px 62px 96px;gap:8px;align-items:center}
.lh{font:700 10px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:4px 8px;border-bottom:1px solid var(--line)}
.lr{padding:9px 8px;border-bottom:1px solid var(--line2)}.lr.agora{background:var(--okbg);border-radius:8px;border:0}
.lr em{font:700 14px var(--mono);font-style:normal;color:var(--ink2)}.lr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr small{display:block;color:var(--ink3);font-size:11.5px}.lr .m{font:600 12.5px var(--mono);color:var(--ink2)}.lr i{font-style:normal}.lr.feito b{color:var(--ink3)}
.pill.amb{background:var(--larbg);color:var(--lar)}
.vz{padding:12px 8px;color:var(--ink3)}
:root[data-theme="dark"] .tablet{border-color:#000}:root[data-theme="dark"] body{background:var(--bg)}
:root[data-theme="dark"] .tq{border-color:#3A4558}:root[data-theme="dark"] .tq .cab,:root[data-theme="dark"] .top,:root[data-theme="dark"] .drawer .dh,:root[data-theme="dark"] .full .fh{background:#0F1F3D}

.st{color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.12)}.st .t{color:#fff;opacity:.95}
.st.ok{background:#16A34A}.st.amb{background:#F59E0B;color:#1F1300!important}.st.amb .t{color:#1F1300}.st.mau{background:#DC2626}.st.cz{background:#64748B}.st.az{background:#2563EB}.st.rx{background:#7C3AED}

  <div class="top"><img class="logo" id="logo" alt="Atrius"><span class="ola"><b id="sauda">Bom dia!</b></span><div class="dias" id="dias"></div><span class="titc" id="titc">Tanques — Programação do dia</span><span style="flex:1"></span><div class="tema" id="tema" title="Claro / escuro"></div><div class="hora"><b id="relogio">--:--</b><small></small></div><div class="menu" id="menuTop" title="Produção do dia">⋮</div></div>
  <div class="grade" id="grade"></div>

  <div class="full" id="fHist"></div>

  <div class="modal" id="mCalc"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ===================== tqop.html · tablet do operador dos tanques =====================
   Mesmo desenho da tela de teste aprovada (tanqueteste.html), agora com a programação de verdade:
   os lotes vêm do PCP (N.tqDados) e cada botão grava no lote (N.tqAcao), com o PIN de quem fez.
   Abre em tela cheia dentro do ERP (tanques.html → #optq). */
const N=(()=>{try{return window.parent&&window.parent!==window?window.parent.csNucleo:null;}catch(e){return null;}})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const nl=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return p2(Math.floor(m/60))+':'+p2(m%60);};
const dur=m=>{m=Math.max(0,Math.round(+m||0));return Math.floor(m/60)+':'+p2(m%60);};
const min=h=>{const x=/^(\d{1,2}):(\d{2})/.exec(String(h||''));return x?(+x[1])*60+(+x[2]):null;};
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const amanha=()=>{const d=new Date();d.setDate(d.getDate()+1);return ymd(d);};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600);}

const ST={limpar:['rx','Liberado para limpeza'],limpando:['rx','Limpando'],encher:['cz','Limpo · encher'],enchendo:['az','Enchendo'],cheio:['cz','Cheio · aguardando preparo'],atras:['mau','Atrasado · cheio'],prep:['ok','Preparando'],descanso:['ok','Em descanso'],analise:['amb','Descansou · fazer análise'],naolib:['amb','Tanque não liberado'],liberado:['az','Tanque liberado'],envasando:['az','Envasando'],livre:['cz','Livre'],ajuste:['mau','Ajuste pedido pelo químico'],pausa:['cz','Pausado']};
const NAO_COMECOU=['limpar','encher','livre'],PRODUZIDO=['descanso','analise','naolib','liberado','ajuste'];
let DIA=null;            /* null = hoje; senão a data (amanhã) */
let D=null,T=[],AGORA=0;
const RASC={};           /* separação sendo digitada, por lote */

/* ---------- dados ---------- */
function carrega(){
  if(!N||!N.tqDados){T=[];return false;}
  try{D=N.tqDados(DIA||undefined);T=D.T;AGORA=D.agora;return true;}catch(e){console.warn(e);T=[];return false;}
}
const ehAmanha=()=>!!DIA;
function lote(t){return t.fila[0];}
function statusDe(t){const l=lote(t);if(!l)return 'livre';if(l.pausa)return 'pausa';return l.st;}
const sepDe=l=>{const r=RASC[l.k]||{};const it={};(l.mp||[]).forEach(m=>{const v=(r.itens&&r.itens[m.nome])||l.sep[m.nome]||{};it[m.nome]={lote:v.lote||l.lotesMP[m.nome]||'',kg:v.kg||'',ok:!!v.ok};});return it;};
const sepOk=l=>{const it=sepDe(l);return Object.values(it).filter(v=>v.ok).length;};
const pausaMin=p=>p&&p.ini?Math.max(0,Math.round((Date.now()-p.ini)/60000)):0;

/* ---------- cartão ---------- */
function cartao(t){const l=lote(t);const s=statusDe(t);const [cor,rot]=ST[s]||['cz',s];
  let tempo='';
  if(l){
    if(s==='limpando')tempo=dur(l.desde)+(l.plan.limp?' / '+dur(l.plan.limp.min):'');
    else if(s==='enchendo')tempo=dur(l.desde)+(l.plan.ench?' / '+dur(l.plan.ench.min):'');
    else if(s==='prep')tempo=dur(l.desde)+(l.prev?' / '+dur(l.prev):'');
    else if(s==='descanso')tempo=dur(l.desde)+(l.desc?' / '+dur(l.desc):'');
    else if(s==='atras')tempo='+'+dur(l.desde);
    else if(s==='pausa')tempo=dur(pausaMin(l.pausa));
    else if(l.ini)tempo=(s==='envasando'||s==='cheio'?'desde ':'')+l.ini;
  }
  let rotulo=rot;if(s==='envasando')rotulo='Envasando · '+(l.maqEnv||l.maq);
  if(s==='pausa')rotulo='Pausado · '+(l.pausa.mot||l.pausa.grupo||'');
  if(t.pul&&s==='livre')rotulo='Vazio · pronto para receber';
  if(s==='analise'&&l&&l.reana)rotulo='Ajustado · refazer análise';
  /* passou da hora: só laranja, sem piscar */
  const atr=l&&!ehAmanha()&&!['liberado','envasando','livre'].includes(s)&&l.prontoMin!=null&&(l.data<D.hoje||AGORA>=l.prontoMin-5);
  const descAte=l&&s==='descanso'&&l.ini?hm(min(l.ini)+(l.desc||0)):'';
  const B={limpar:`<div class="acao rx" data-a="limpIni">Iniciar limpeza</div>`,limpando:`<div class="acao rx" data-a="limpFim">Concluir limpeza</div>`,
    encher:`<div class="acao az" data-a="enchIni">Iniciar enchimento</div>`,enchendo:`<div class="acao az" data-a="enchFim">Concluir enchimento</div>`,
    cheio:`<div class="acao" data-a="prepIni">Iniciar preparo</div>`,atras:`<div class="acao" data-a="prepIni">Iniciar preparo</div>`,
    prep:`<div class="acao" data-a="prepFim">Concluir preparo</div>`,
    descanso:`<div class="acao off">Descansando · análise às ${descAte}</div>`,
    analise:`<div class="acao amb" data-a="ana">${l&&l.reana?'Refazer análise':'Preencher análise'}</div>`,
    ajuste:`<div class="acao mau" data-a="form">Lançar ajuste</div>`,
    naolib:`<div class="acao off">Esperando a liberação<small>o químico libera ou pede ajuste</small></div>`,
    liberado:`<div class="acao off">Esperando o envase puxar<small>quando a máquina começar, vira Envasando</small></div>`,
    envasando:`<div class="acao off">O envase conclui o tanque<small>ao concluir, o próximo lote aparece aqui</small></div>`,
    livre:`<div class="acao off">Nenhum lote na fila</div>`};
  let btn=B[s]||'';if(s==='pausa')btn=`<div class="acao az" data-a="retomar">Retomar</div>`;
  if(t.pul&&s==='livre')btn=`<div class="acao off">Recebe quando um tanque transferir</div>`;
  const sub=s==='limpar'?`<div class="sub2"><div data-a="limpNao">Não precisa limpar</div></div>`:'';
  const ANTES=['limpar','limpando','encher','enchendo','cheio','atras','prep'];
  const ajp=l?(l.ajPed||[]).filter(a=>!a.lanc):[];
  const tot=l?(l.mp||[]).length:0,feit=l?sepOk(l):0,fOk=tot>0&&feit>=tot;
  const passos=l?(l.proc||[]).length:0;
  const ck=s==='ajuste'&&ajp.length?`<div class="ckl aj" data-a="form"><i class="ic pend"></i><span>+ ${nl(ajp[0].kg)} ${esc(ajp[0].un||'kg')} ${esc(ajp[0].nome)} · ${esc(ajp[0].por||'')}</span></div>`
    :l&&ANTES.includes(s)&&!l.de&&tot?`<div class="ckl ${fOk?'ok':'pend'}" data-a="form">${fOk?'<i class="ic ok">✓</i>':'<i class="ic pend"></i>'}<span>${fOk?'Matérias-primas separadas':'Separar matérias-primas'}${s==='prep'&&passos?' · passo '+Math.min(l.passo+1,passos)+' de '+passos:''}</span><em>${feit}/${tot}</em></div>`:'';
  const prox=t.fila[1];
  return `<div class="tq c6${t.pul?' pul':''}${ehAmanha()?' amh':''}" data-t="${esc(t.id)}"><div class="cab"><b>${esc(t.id)}</b>${t.pul?'<span class="tag">descanso</span>':''}<span class="pts" data-a="menu">⋮</span></div>
    <div class="st ${cor}"><span>${esc(rotulo)}</span><span class="t">${tempo}</span></div>
    ${l?`<div class="prod">${esc(l.p)}<small>${l.lote?'lote '+esc(l.lote)+' · ':''}OP ${esc(l.op)}${l.de?' · veio do '+esc(l.de):''}${l.data!==(DIA||D.hoje)?' · de '+l.data.slice(8,10)+'/'+l.data.slice(5,7):''}</small></div>
    <div class="tiles"><div><span>Volume (L)</span><b>${nl(l.vol)}</b></div><div class="dest${atr?' atr':''}"><span>${s==='envasando'?'Envase até':'Pronto até'}</span><b>${esc(l.pronto)}</b></div><div><span>${s==='envasando'?'Máquina':'Vai para'}</span><b>${esc(s==='envasando'?(l.maqEnv||l.maq):l.maq)}</b></div></div>`
    :`<div class="prod" style="color:var(--ink3)">—</div><div class="tiles"></div>`}
    <div class="acoes">${ck}${btn}${sub}</div>
    <div class="prox"><i>DEPOIS</i>${prox?`<b>${esc(prox.p)}</b> · ${nl(prox.vol)} L<span class="h">${esc(prox.pronto)}</span>`:'nada mais '+(ehAmanha()?'amanhã':'hoje')}</div></div>`;}
function topo(){
  const dt=DIA?new Date(DIA+'T12:00:00'):new Date();
  $('titc').innerHTML=`Tanques — ${DIA?'<em class="amh">Amanhã</em>':'Programação do dia'}`;
  $('dias').innerHTML=`<button type="button" class="${DIA?'':'on'}" data-dia="">Hoje</button><button type="button" class="${DIA?'on':''}" data-dia="amanha">Amanhã</button>`;
  $('dias').querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{DIA=b.dataset.dia?amanha():null;atualiza();if(DIA)toast('Vendo a programação de amanhã. O que fizer aqui já vale para o lote de amanhã.');});
  document.querySelector('.top .hora small').textContent=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('relogio').textContent=hm(AGORA);
  const h=Math.floor(AGORA/60);$('sauda').textContent=h<12?'Bom dia!':h<18?'Boa tarde!':'Boa noite!';
  document.body.classList.toggle('vamh',!!DIA);
}
function desenha(){
  topo();
  if(!N){$('grade').innerHTML='<div class="semn">Esta tela abre pelo sistema: no tablet, use o link <b>tanques.html</b>.</div>';return;}
  if(!T.length){$('grade').innerHTML=`<div class="semn">${D&&!D.pronto?'Carregando a programação…':'Nenhum tanque cadastrado.'}</div>`;return;}
  $('grade').innerHTML=T.map(cartao).join('');
  $('grade').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>acao(b.closest('.tq').dataset.t,b.dataset.a));
}
function atualiza(){carrega();desenha();}
window.tqAtualiza=()=>{try{atualiza();}catch(e){}};

/* ---------- ações ---------- */
const REG={limpIni:'Iniciar limpeza',limpFim:'Concluir limpeza',limpNao:'Não precisa limpar',enchIni:'Iniciar enchimento',enchFim:'Concluir enchimento',prepIni:'Iniciar preparo',prepFim:'Concluir preparo'};
function acao(id,a){const t=T.find(x=>x.id===id);if(!t)return;const s=statusDe(t);const l=lote(t);
  if(a==='menu')return abrirDrawer(t);
  if(a==='retomar')return pedirPin(t.id+' · Retomar',pin=>exec(t,'retomar',pin));
  if(l&&l.pausa&&a!=='form'&&a!=='ana')return toast(t.id+' está pausado. Toque em Retomar.');
  if(!l)return toast('Sem lote neste tanque.');
  if(a==='form')return abrirForm(t,'sep');
  if(a==='ana'){if(!['analise','naolib','liberado','envasando'].includes(s))return toast('A análise é depois do descanso.');return abrirAna(t);}
  if(a==='prepIni'&&(l.mp||[]).length&&sepOk(l)<l.mp.length)return toast('Separe as '+(l.mp.length-sepOk(l))+' matérias-primas que faltam antes de iniciar o preparo.');

function exec(t,a,pin,x){const l=lote(t);if(!l)return;

/* ---------- calculadora ---------- */
function abrirCalc(){const m=$('mCalc');$('tela').appendChild(m);let e='';let ant='';
  const num=x=>x.replace(/\./g,'');
  const calc=x=>{const y=x.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.');if(!/^[0-9.+\-*/ ]+$/.test(y))return null;try{const z=Function('return ('+y+')')();return isFinite(z)?z:null;}catch(_){return null;}};
  const fmt=z=>(+z.toFixed(4)).toLocaleString('pt-BR',{maximumFractionDigits:4});
  const pinta=()=>{m.innerHTML=`<div class="mc calc"><div class="mh"><span><b>Calculadora</b></span><span class="x" data-k="x">×</span></div>
    <div class="vis"><small>${esc(ant)||'&nbsp;'}</small><b>${esc(e)||'0'}</b></div>
    <div class="kp k4">${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0',',','='].map(k=>`<div data-k="${k}" class="${'÷×−+'.includes(k)?'op':''}${k==='='?'ig':''}${k==='C'?' c':''}${k==='0'?' z':''}">${k}</div>`).join('')}</div></div>`;
    m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>tecla(b.dataset.k));};
  const tecla=k=>{if(k==='x'){m.classList.remove('on');return;}
    if(k==='C'){e='';ant='';}else if(k==='⌫'){e=e.slice(0,-1);}
    else if(k==='='){const z=calc(num(e));if(z!==null){ant=e+' =';e=num(fmt(z));}}
    else if(k==='%'){const z=calc(num(e));if(z!==null){ant=e+' %';e=num(fmt(z/100));}}
    else e+=k;pinta();};
  pinta();m.classList.add('on');}

  const pinta=()=>{const l=CAD.filter(m=>(m.sku+' '+m.nome).toLowerCase().includes(q.toLowerCase())).slice(0,80);
    const m=modal(`<div class="mc pick"><div class="mh"><span><b>${esc(titulo)}</b><small>lista do cadastro de matérias-primas · não dá para digitar um nome novo</small></span><span class="x" data-fechar>×</span></div>
      <input class="in busca" id="pkQ" placeholder="buscar pelo nome ou código" value="${esc(q)}"><div class="pkl">${l.map(m=>`<div class="pki" data-c="${esc(m.sku)}"><em>${esc(m.sku)}</em><b>${esc(m.nome)}</b></div>`).join('')||'<div class="vz">nada encontrado</div>'}</div></div>`);
    const i=m.querySelector('#pkQ');i.oninput=()=>{q=i.value;const p=i.selectionStart;pinta();const j=document.querySelector('#pkQ');j.focus();j.setSelectionRange(p,p);};
    m.querySelectorAll('.pki').forEach(e=>e.onclick=()=>{m.classList.remove('on');const x=CAD.find(c=>c.sku===e.dataset.c);ok({sku:x.sku,nome:x.nome});});};
  pinta();}

/* ---------- formulação: separação, ajustes e Modo de Fazer ---------- */
const ICALC='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><rect x="8" y="5.5" width="8" height="4" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>';
function abrirForm(t,aba){const l=lote(t);if(!l)return toast('Sem lote neste tanque.');const f=$('fForm');const s=statusDe(t);const modoAj=s==='ajuste';
  const r=RASC[l.k]||(RASC[l.k]={itens:sepDe(l),aj:{},ext:[]});
  const pend=(l.ajPed||[]).map((a,i)=>({...a,i})).filter(a=>!a.lanc);
  const feitos=(l.ajPed||[]).filter(a=>a.lanc);
  const proc=l.proc||[];
  const tot=(l.mp||[]).length,ok=Object.values(r.itens).filter(v=>v.ok).length;
  f.innerHTML=`<div class="fh"><b>Formulação e Modo de Fazer · ${esc(l.p)}</b><small>${esc(t.id)}${l.lote?' · lote '+esc(l.lote):''} · ${nl(l.vol)} L · ${ok} de ${tot} separadas</small><span class="x" id="fX">×</span></div>
  <div class="fb"><div class="box"><h3>Separação das matérias-primas <span>previsto para ${nl(l.vol)} L · água não pesa: completa no tanque</span></h3><div class="bb"><table class="t form"><thead><tr><th>Matéria-prima</th><th>Previsto</th><th>Lote da MP</th><th>Separado</th><th></th></tr></thead><tbody>
    ${(l.mp||[]).map((m,i)=>{const v=r.itens[m.nome]||{};return `<tr class="${v.ok?'okr':''}"><td>${esc(m.nome)}${m.sku?`<small>${esc(m.sku)}</small>`:''}</td><td class="m">${nl(m.kg)} ${esc(m.un)}</td><td><input class="in" data-i="${i}" data-c="lote" value="${esc(v.lote||'')}" placeholder="lote" ${v.ok?'disabled':''}></td><td><input class="in" inputmode="decimal" data-i="${i}" data-c="kg" value="${esc(v.kg||'')}" placeholder="kg" ${v.ok?'disabled':''}></td><td><span class="ck ${v.ok?'on':''}" data-k="${i}">${v.ok?'✓':''}</span></td></tr>`;}).join('')||'<tr><td colspan="5" style="color:var(--ink3)">Este produto não tem formulação cadastrada.</td></tr>'}
    ${pend.map(a=>{const v=r.aj[a.i]||{};return `<tr class="ajr"><td><b class="ajn">${esc(a.nome)}</b><small>pedido por ${esc(a.por||'')}${a.obs?' · '+esc(a.obs):''}</small></td><td class="m">${nl(a.kg)} ${esc(a.un||'kg')}</td><td><input class="in" data-aj="${a.i}" data-c="lote" value="${esc(v.lote||'')}" placeholder="lote" ${v.ok?'disabled':''}></td><td><input class="in" inputmode="decimal" data-aj="${a.i}" data-c="kg" value="${esc(v.kg||'')}" placeholder="kg" ${v.ok?'disabled':''}></td><td><span class="ck ${v.ok?'on':''}" data-akj="${a.i}">${v.ok?'✓':''}</span></td></tr>`;}).join('')}
    ${feitos.map(a=>`<tr class="okr"><td>${esc(a.nome)}<small>ajuste lançado às ${esc(a.lanc.h||'')} · ${esc(a.lanc.q||'')}</small></td><td class="m">${nl(a.kg)} ${esc(a.un||'kg')}</td><td class="m">${esc(a.lanc.lote||'—')}</td><td class="m">${nl(a.lanc.kg)}</td><td><span class="ck on">✓</span></td></tr>`).join('')}
    ${r.ext.map((a,j)=>`<tr class="ajr"><td><b class="ajn">${esc(a.nome)}</b><small>MP de ajuste</small></td><td class="m">—</td><td><input class="in" data-ex="${j}" data-c="lote" value="${esc(a.lote||'')}" placeholder="lote"></td><td><input class="in" inputmode="decimal" data-ex="${j}" data-c="kg" value="${esc(a.kg||'')}" placeholder="kg"></td><td><span class="ck" data-exx="${j}" title="tirar">×</span></td></tr>`).join('')}
    ${modoAj||ehAmanha()?'':`<tr class="addr"><td colspan="5"><span class="addaj" id="fAj">+ MP de ajuste</span></td></tr>`}
    </tbody></table><div class="fdica">Digite o lote e o peso de cada MP e toque no ✓. Pode separar enquanto o tanque enche.</div></div>
    <div class="bf"><div class="acao sec ico" data-calc title="Calculadora">${ICALC}</div><div class="acao lar" data-prob><span class="ex">!</span>Registrar problema</div><span style="flex:1"></span><div class="acao ${modoAj?'mau':''}" id="fS">${modoAj?'Lançar ajuste':'Salvar separação'}</div></div></div>
  <div class="box"><h3>Modo de Fazer <span>${s==='prep'&&proc.length?'passo '+Math.min(l.passo+1,proc.length)+' de '+proc.length:'começa no Iniciar preparo'}</span></h3><div class="bb"><ol class="modo">${proc.map((p,i)=>`<li class="${i<l.passo?'feito':''}" data-p="${i}"><em>${i<l.passo?'✓':i+1}</em><div>${esc(p)}</div></li>`).join('')||'<li style="color:var(--ink3)">Sem modo de fazer cadastrado para este produto.</li>'}</ol></div></div></div>`;
  f.classList.add('on');f.querySelector('#fX').onclick=()=>{f.classList.remove('on');desenha();};
  const nomes=(l.mp||[]).map(m=>m.nome);
  f.querySelectorAll('input[data-i]').forEach(e=>e.oninput=()=>{r.itens[nomes[+e.dataset.i]][e.dataset.c]=e.value;});
  f.querySelectorAll('input[data-aj]').forEach(e=>e.oninput=()=>{(r.aj[e.dataset.aj]||(r.aj[e.dataset.aj]={}))[e.dataset.c]=e.value;});
  f.querySelectorAll('input[data-ex]').forEach(e=>e.oninput=()=>{r.ext[+e.dataset.ex][e.dataset.c]=e.value;});
  f.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{const i=+c.dataset.k,v=r.itens[nomes[i]];if(!v.ok){if(!v.lote)return toast('Digite o lote da '+nomes[i]+'.');if(!v.kg)v.kg=nl(l.mp[i].kg);}v.ok=!v.ok;abrirForm(t,aba);});
  f.querySelectorAll('[data-akj]').forEach(c=>c.onclick=()=>{const v=r.aj[c.dataset.akj]||(r.aj[c.dataset.akj]={});if(!v.ok&&(!v.lote||!v.kg))return toast('Preencha o lote e o peso do ajuste.');v.ok=!v.ok;abrirForm(t,aba);});
  f.querySelectorAll('[data-exx]').forEach(c=>c.onclick=()=>{r.ext.splice(+c.dataset.exx,1);abrirForm(t,aba);});
  if(f.querySelector('#fAj'))f.querySelector('#fAj').onclick=()=>escolherMP('MP de ajuste',x=>{r.ext.push({nome:x.nome,sku:x.sku,lote:'',kg:''});abrirForm(t,aba);});
  f.querySelectorAll('.modo li[data-p]').forEach(li=>li.onclick=()=>{if(statusDe(t)!=='prep')return toast('Os passos são marcados durante o preparo.');const i=+li.dataset.p;const n=i<l.passo?i:i+1;
    const res=N.tqAcao(l.k,'passo',{n});if(res&&res.erro)return toast(res.erro);atualiza();const nt=T.find(z=>z.id===t.id);if(nt)abrirForm(nt,aba);});
  f.querySelector('[data-prob]').onclick=()=>registrarProblema(t);f.querySelector('[data-calc]').onclick=()=>abrirCalc();
  f.querySelector('#fS').onclick=()=>{
    if(modoAj){const falta=pend.filter(a=>!(r.aj[a.i]&&r.aj[a.i].ok));if(falta.length)return toast('Lance o lote e o peso do ajuste pedido e toque no ✓.');
      return pedirPin(t.id+' · Lançar ajuste',pin=>{if(exec(t,'ajLanc',pin,{itens:pend.map(a=>({i:a.i,lote:r.aj[a.i].lote,kg:r.aj[a.i].kg}))})){delete RASC[l.k];f.classList.remove('on');}});}
    const ex=r.ext.filter(a=>a.nome&&a.kg);if(r.ext.length&&ex.length!==r.ext.length)return toast('Preencha o lote e o peso da MP de ajuste (ou tire a linha).');
    pedirPin(t.id+' · Salvar separação',pin=>{
      const okSep=exec(t,'sep',pin,{itens:r.itens,total:tot});
      if(okSep&&ex.length){const n=T.find(z=>z.id===t.id);if(n)exec(n,'mpExtra',pin,{itens:ex});}
      if(okSep){f.classList.remove('on');}});};}

/* ---------- análise ---------- */
function abrirAna(t){const l=lote(t);if(!l)return;const f=$('fAna');const enviada=['naolib','liberado','envasando'].includes(statusDe(t));
  const R={};(l.ens||[]).forEach(e=>{R[e.k]=l.reana?'':(l.res[e.k]??'');});let obs='';
  const situ=e=>{const v=R[e.k];if(v===''||v==null)return null;if(e.quali)return v==='ok'?'ok':(v==='fora'?'fora':null);const n=+String(v).replace(',','.');if(isNaN(n))return null;if(e.min!=null&&n<e.min)return 'fora';if(e.max!=null&&n>e.max)return 'fora';return 'ok';};
  const pinta=()=>{
  f.innerHTML=`<div class="fh"><b>${l.reana?'Reanálise':'Análise'} · ${esc(l.p)}</b><small>${esc(t.id)} · lote ${esc(l.lote||'—')}${l.ini?' · desde '+esc(l.ini):''}</small><span class="x" id="aX">×</span></div>
  <div class="fb" style="grid-template-columns:1.5fr 1fr"><div class="box"><h3>Ensaios do produto <span>resultado fora da faixa fica vermelho na hora</span></h3><div class="bb"><table class="t"><thead><tr><th>Ensaio</th><th>Especificação</th><th>Resultado</th><th></th></tr></thead><tbody>
    ${(l.ens||[]).map(e=>{const s=situ(e);return `<tr><td>${esc(e.rot)}</td><td>${esc(e.esp)}</td><td>${e.quali?`<span class="pill ${R[e.k]==='ok'?'ok':'cz'} ${enviada?'':'tq'}" data-q="${e.k}|ok">Conforme</span> &nbsp;<span class="pill ${R[e.k]==='fora'?'mau':'cz'} ${enviada?'':'tq'}" data-q="${e.k}|fora">Não conforme</span>`
      :`<input class="in" inputmode="decimal" data-e="${e.k}" value="${esc(R[e.k])}" ${enviada?'disabled':''} style="width:110px">`}</td><td>${s==='ok'?'<span class="pill ok">dentro</span>':s==='fora'?'<span class="pill mau">fora</span>':''}</td></tr>`;}).join('')||'<tr><td colspan="4" style="color:var(--ink3)">Este produto não tem ensaios cadastrados.</td></tr>'}</tbody></table></div></div>
  <div class="box"><h3>Ajustes feitos no lote</h3><div class="bb"><table class="t"><thead><tr><th>Hora</th><th>O que entrou</th><th>Quanto</th></tr></thead><tbody>${((l.extra||[]).map(a=>`<tr><td class="m">${esc(a.em||'')}</td><td>${esc(a.nome)}<small>${a.lote?'lote '+esc(a.lote):''}</small></td><td class="m">${nl(a.kg)} ${esc(a.un||'kg')}</td></tr>`).join(''))||'<tr><td colspan="3" style="color:var(--ink3)">nenhum ajuste</td></tr>'}</tbody></table>
    <div style="margin-top:10px"><span style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700">Observação para o químico</span><textarea class="in obs" id="aObs" ${enviada?'disabled':''} placeholder="se teve algo diferente" style="display:block;width:100%;min-height:70px;margin-top:6px">${esc(enviada?(l.tq.anaObs||''):obs)}</textarea></div></div></div></div>
  <div class="ff"><span style="flex:1"></span><div class="acao ${enviada?'off':'amb'}" id="aE">${enviada?'Análise já enviada':l.reana?'ENVIAR REANÁLISE':'ENVIAR ANÁLISE PARA LIBERAÇÃO'}</div></div>`;
  f.classList.add('on');f.querySelector('#aX').onclick=()=>f.classList.remove('on');
  f.querySelectorAll('input[data-e]').forEach(i=>{i.oninput=()=>{R[i.dataset.e]=i.value;};i.onchange=()=>{const p=i.selectionStart;pinta();};});
  f.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{if(enviada)return;const [k,v]=b.dataset.q.split('|');R[k]=v;pinta();});
  const o=f.querySelector('#aObs');if(o)o.oninput=()=>obs=o.value;
  f.querySelector('#aE').onclick=()=>{if(enviada)return;const falta=(l.ens||[]).filter(e=>R[e.k]===''||R[e.k]==null);if(falta.length)return toast('Falta: '+falta.map(e=>e.rot).join(', ')+'.');
    pedirPin(t.id+' · Enviar '+(l.reana?'reanálise':'análise'),pin=>{const res={};(l.ens||[]).forEach(e=>{res[e.k]=e.quali?R[e.k]:String(R[e.k]).replace(',','.');});
      if(exec(t,'ana',pin,{res,obs}))f.classList.remove('on');});};};
  pinta();}

/* ---------- tema e relógio ---------- */
const LUA='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',SOL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function escuro(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function pintaTema(){$('tema').innerHTML=escuro()?SOL:LUA;}
$('tema').onclick=()=>{document.documentElement.dataset.theme=escuro()?'light':'dark';try{localStorage.setItem('erp.tq.tema',document.documentElement.dataset.theme);}catch(e){}pintaTema();};
try{document.documentElement.dataset.theme=localStorage.getItem('erp.tq.tema')||'dark';}catch(e){document.documentElement.dataset.theme='dark';}pintaTema();
try{if(N&&N.tqLogo)$('logo').src=N.tqLogo();}catch(e){}
$('menuTop').onclick=()=>abrirGeral();
/* à meia-noite volta para hoje; a cada 20 s refaz (os tempos andam) */
setInterval(()=>{if(DIA&&DIA<=ymd(new Date()))DIA=null;if(!document.querySelector('.modal.on,.full.on'))atualiza();else{carrega();topo();}},20000);
atualiza();

</script>
</body></html>
