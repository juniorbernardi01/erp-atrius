<html lang="pt-BR"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--ink2:#4B5563;--ink3:#8A93A3;--line:#E3E6EB;--line2:#F1F3F5;--az:#1E3A8A;--ok:#15803D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F6F7F9;color:var(--ink);font-size:13px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.app{padding:22px 28px 60px;max-width:1500px}
.topo{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topo h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.topo .sub{font-size:12.5px;color:var(--ink3);margin-top:3px}
.topo select{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;font-weight:600}
.esp{flex:1}
.pos{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.pos span{font:600 11.5px Inter;border-radius:999px;padding:4px 10px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.k small{display:block;font-size:11px;color:#6B7280;font-weight:600}.k b{display:block;font-size:20px;font-weight:700;margin-top:2px}.k span{font-size:11px;color:var(--ink3)}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid #D9DEE6;background:#fff;font-weight:600;font-size:12px;color:#374151}
.chips button.on{background:var(--az);border-color:var(--az);color:#fff}.chips i{font-style:normal;opacity:.7;margin-left:4px}
.busca{height:36px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:#fff;min-width:240px;outline:none}
.lista{display:grid;gap:10px}
.cli{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cli.atr{box-shadow:inset 4px 0 0 #C2410C}.cli.car{box-shadow:inset 4px 0 0 #B91C1C}.cli.pro{box-shadow:inset 4px 0 0 #6D28D9}.cli.av{box-shadow:inset 4px 0 0 #15803D}
.cab{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,.7fr)) 210px;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.cab:hover{background:#FAFBFC}
.cab .n b{display:block;font-size:14px}.cab .n span{font-size:11.5px;color:var(--ink3)}
.cab .v small{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}.cab .v b{font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.p{display:inline-flex;font:700 11px Inter;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p.atr{background:#FEF3C7;color:#92400E}.p.car{background:#FFE4D5;color:#C2410C}.p.pro{background:#FEE2E2;color:#991B1B}.p.ok{background:#DCFCE7;color:#15803D}.p.cz{background:#F1F3F5;color:#4B5563}
.wa{display:inline-flex;align-items:center;gap:5px;border:1px solid #86EFAC;background:#F0FDF4;color:#15803D;border-radius:9px;padding:6px 10px;font-weight:700;font-size:12px;text-decoration:none}
.det{border-top:1px solid var(--line2);padding:6px 16px 12px}
table{width:100%;border-collapse:collapse}th{font-size:10.5px;color:var(--ink3);text-align:right;padding:8px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td{padding:8px;border-top:1px solid var(--line2);text-align:right;font-size:12.5px}th.l,td.l{text-align:left}td.m{font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.sec{font:700 11px Inter;color:#6B7280;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px}
.vazio{padding:48px 20px;text-align:center;color:var(--ink3);background:#fff;border:1px dashed var(--line);border-radius:14px}
.aviso{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
@media(max-width:1000px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.cab{grid-template-columns:1fr 1fr}.app{padding:16px}}
.perb2{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1.5px solid #9DB8E8;border-radius:999px;background:#fff;color:#1D6FE8;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.perb2:hover{border-color:#1D6FE8}.perb2.ativo{background:#EFF4FD}
.perpop{position:fixed;z-index:500;width:560px;max-width:calc(100vw - 16px);background:#fff;border:1px solid #E4E2DC;border-radius:16px;box-shadow:0 14px 36px rgba(20,24,33,.18);display:grid;grid-template-columns:170px 1fr;overflow:hidden;font-family:inherit;color:#1A1D23}
.perpop *{box-sizing:border-box}
.perpop .pmodos{display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:#F7F8FA;border-right:1px solid #EFEEE9}
.perpop .pmodos button{border:0;border-radius:9px;text-align:left;padding:9px 12px;background:none;font-size:13px;color:#545C69;cursor:pointer}
.perpop .pmodos button:hover{background:#EEF1F5}.perpop .pmodos button.on{background:#fff;color:#1D6FE8;font-weight:600;box-shadow:0 1px 3px rgba(20,24,33,.08)}
.perpop .pcorpo{padding:14px;min-width:0}
.perpop .pdf{display:flex;align-items:center;gap:8px;height:40px;border:1px solid #E4E2DC;border-radius:9px;padding:0 6px;background:#fff;margin-bottom:8px;min-width:0}
.perpop .pdf.sm{height:36px}.perpop .pdf.at{border-color:#1D6FE8;box-shadow:0 0 0 3px #EAF1FC}
.perpop .pdf input{flex:1;border:0;outline:0;font:inherit;font-size:14px;min-width:0;background:none;text-align:center}
.perpop .pdf button{width:28px;height:28px;border-radius:50%;border:1px solid #E4E2DC;background:#fff;cursor:pointer;flex:none}
.perpop .pcal{margin:4px 0 6px}.perpop .pch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13.5px}
.perpop .pch button{width:26px;height:26px;border-radius:50%;background:#F5F4F0;border:0;cursor:pointer}
.perpop .pcg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center}.perpop .pcg span{color:#8B93A1;font-size:11px;padding:3px 0}
.perpop .pcg button{height:32px;border:0;border-radius:8px;font-size:13px;background:none;cursor:pointer;color:#1A1D23}.perpop .pcg button:hover{background:#F5F4F0}
.perpop .pcg button.hj{text-decoration:underline}.perpop .pcg button.on{border:1.5px solid #1D6FE8;color:#1D6FE8;font-weight:700;background:#fff}
.perpop .pcg button.fx{background:#EFF4FD;border-radius:0}.perpop .pcg button.ini{border-radius:8px 0 0 8px}.perpop .pcg button.fim{border-radius:0 8px 8px 0}
.perpop .pmes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.perpop .pmes button{border:1px solid #E4E2DC;border-radius:8px;padding:8px 0;font-size:12.5px;background:#fff;cursor:pointer}
.perpop .pmes button.on{border-color:#1D6FE8;color:#1D6FE8;font-weight:600;background:#EFF4FD}
.perpop .patal{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}.perpop .patal button{font-size:11.5px;border:1px solid #E4E2DC;border-radius:999px;padding:4px 9px;background:#fff;color:#545C69;cursor:pointer}
.perpop .patal button:hover{border-color:#9DB8E8;color:#1D6FE8}
.perpop .pdois{display:grid;grid-template-columns:1fr 1fr;gap:6px}.perpop .pdois small,.perpop .pcampo small{font-size:11px;color:#8B93A1}
.perpop .pdica{font-size:11.5px;color:#8B93A1;margin:0 0 6px}
.perpop .pcampo{margin:4px 0 8px}.perpop .pcampo select{width:100%;height:34px;border:1px solid #E4E2DC;border-radius:8px;padding:0 8px;font:inherit;font-size:13px}
.perpop .pres{font-size:12.5px;color:#545C69;border-top:1px solid #EFEEE9;padding-top:10px;margin:4px 0 10px}
.perpop .pbot{display:flex;gap:8px}.perpop .pbot .btn{flex:1;justify-content:center;height:38px}.perpop .pbot .btn.pri{flex:2}
@media (max-width:620px){.perpop{grid-template-columns:1fr;left:8px!important;right:8px;width:auto}.perpop .pmodos{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid #EFEEE9}.perpop .pmodos button{white-space:nowrap}}
.perpop .pdois>div{min-width:0}.perpop .pdf input{width:100%}
.perpop .btn{display:inline-flex;align-items:center;border:1px solid #D9DEE6;border-radius:9px;background:#fff;font-weight:600}.perpop .btn.pri{background:#1D6FE8;color:#fff;border-color:#1D6FE8}
</style></head><body>
<div class="app" id="app"><div class="vazio">Carregando…</div></div>
<script>
/* =====================================================================
   PERÍODO · o mesmo filtro de datas em todo o sistema (desenho aprovado)
   estado: {m:'sem'|'dia'|'mes'|'int'|'prev', dia, mes:'aaaa-mm', de, ate, campo}
   abrirPeriodo(botão, estado, {prev:true|false, campos:[[valor,rótulo]]}, aplicar)
   ===================================================================== */
const PER_MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const PER_MC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const perHoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const perYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const perD=s=>{const [a,m,d]=String(s).split('-').map(Number);return new Date(a,(m||1)-1,d||1);};
const perBr=s=>s?String(s).split('-').reverse().join('/'):'';
const perLe=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;};
const perAdd=(s,n)=>{const d=perD(s);d.setDate(d.getDate()+n);return perYmd(d);};
function perNovo(m){const h=perHoje();return {m:m||'sem',dia:h,mes:h.slice(0,7),de:perAdd(h,-29),ate:h,campo:''};}
function perRotulo(p){if(!p||p.m==='sem')return 'Período';const h=perHoje();
  if(p.m==='dia')return p.dia===h?'Hoje':perBr(p.dia);
  if(p.m==='mes'){const [a,m]=p.mes.split('-');return PER_MES[+m-1]+' de '+a;}
  const ano=p.de.slice(0,4)!==p.ate.slice(0,4)||p.ate.slice(0,4)!==h.slice(0,4);
  const r=p.de===p.ate?perBr(p.de):perBr(p.de).slice(0,ano?10:5)+' a '+perBr(p.ate).slice(0,ano?10:5);
  return p.m==='prev'?'Previstos '+r:r;}
/* o intervalo efetivo, para quem filtra: {de, ate} (vazio = sem limite) */
function perFaixa(p){if(!p||p.m==='sem')return {de:'',ate:''};
  if(p.m==='dia')return {de:p.dia,ate:p.dia};
  if(p.m==='mes'){const [a,m]=p.mes.split('-').map(Number);return {de:p.mes+'-01',ate:perYmd(new Date(a,m,0))};}
  return {de:p.de<=p.ate?p.de:p.ate,ate:p.de<=p.ate?p.ate:p.de};}
function perBotao(id,p){return `<button class="perb2 ${p&&p.m!=='sem'?'ativo':''}" id="${id}" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg> ${perRotulo(p)}</button>`;}
function abrirPeriodo(botao,estado,opts,aplicar){
  opts=opts||{};
  const velho=document.getElementById('perPop');if(velho){const mesmo=velho._dono===botao;velho.remove();if(mesmo)return;}
  const t=JSON.parse(JSON.stringify(estado||perNovo()));if(!t.campo&&opts.campos)t.campo=opts.campos[0][0];
  let alvo='de',view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);
  const p=document.createElement('div');p.id='perPop';p.className='perpop';p._dono=botao;document.body.appendChild(p);
  const modos=[['sem','sem filtro'],['dia','do dia'],['mes','do mês'],['int','do intervalo'],...(opts.prev?[['prev','previstos para']]:[])];
  const cal=()=>{const y=view.getFullYear(),m=view.getMonth(),ini=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();const faixa=t.m==='int'||t.m==='prev';
    const cls=s=>{if(!faixa)return s===t.dia?'on':'';const a=t.de<=t.ate?t.de:t.ate,b=t.de<=t.ate?t.ate:t.de;if(s===a&&s===b)return 'on';if(s===a)return 'on ini';if(s===b)return 'on fim';return s>a&&s<b?'fx':'';};
    return `<div class="pcal"><div class="pch"><button data-nv="-1" type="button">‹</button><b>${PER_MES[m]} ${y}</b><button data-nv="1" type="button">›</button></div><div class="pcg">${'DSTQQSS'.split('').map(x=>'<span>'+x+'</span>').join('')}${'<i></i>'.repeat(ini)}${Array.from({length:n},(_,i)=>{const s=perYmd(new Date(y,m,i+1));return `<button type="button" class="${cls(s)} ${s===perHoje()?'hj':''}" data-dd="${s}">${i+1}</button>`;}).join('')}</div></div>`;};
  const res=()=>{const f=perFaixa(t);if(t.m==='sem')return 'mostra tudo, sem limitar por data';
    const dias=Math.round((perD(f.ate)-perD(f.de))/864e5)+1;return `<b>${perRotulo(t)}</b>${dias>1?` · ${dias} dias`:''}`;};
  const des=()=>{
    let c='';
    if(t.m==='dia')c=`<div class="pdf"><button data-dia="-1" type="button">‹</button><input id="pdDia" value="${perBr(t.dia)}"><button data-dia="1" type="button">›</button></div>${cal()}`;
    else if(t.m==='mes'){const [a,mm]=t.mes.split('-').map(Number);c=`<div class="pdf sm"><button data-ano="-1" type="button">‹</button><input value="${a}" readonly><button data-ano="1" type="button">›</button></div><div class="pmes">${PER_MC.map((x,i)=>`<button type="button" data-ms="${i+1}" class="${i+1===mm?'on':''}">${x}</button>`).join('')}</div>`;}
    else if(t.m==='int'||t.m==='prev'){const h=perHoje();
      const at=t.m==='prev'?[['hoje',h,h],['amanhã',perAdd(h,1),perAdd(h,1)],['próximos 7 dias',h,perAdd(h,6)]]:[['últimos 7 dias',perAdd(h,-6),h],['últimos 30 dias',perAdd(h,-29),h],['este mês',h.slice(0,8)+'01',perFaixa({m:'mes',mes:h.slice(0,7)}).ate],['mês passado',perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth()-1,1)),perYmd(new Date(perD(h).getFullYear(),perD(h).getMonth(),0))]];
      c=`${t.m==='prev'?'<div class="pdica">Entrega prevista entre as duas datas. Para um dia só, deixe as duas iguais.</div>':''}<div class="patal">${at.map(([r,a,b],i)=>`<button type="button" data-at="${i}">${r}</button>`).join('')}</div>
      <div class="pdois"><div><small>de</small><div class="pdf sm ${alvo==='de'?'at':''}" data-alvo="de"><input id="pdDe" value="${perBr(t.de)}"></div></div><div><small>até</small><div class="pdf sm ${alvo==='ate'?'at':''}" data-alvo="ate"><input id="pdAte" value="${perBr(t.ate)}"></div></div></div>
      <div class="pdica">${alvo==='de'?'clique no primeiro dia':'agora clique no último dia'}</div>${cal()}`;
      p._at=at;}
    else c='<div class="pdica" style="margin:6px 0 10px">Mostra tudo, sem limitar por data.</div>';
    p.innerHTML=`<div class="pmodos">${modos.map(([k,r])=>`<button type="button" data-md="${k}" class="${t.m===k?'on':''}">${r}</button>`).join('')}</div>
      <div class="pcorpo">${c}${opts.campos&&t.m!=='sem'?`<div class="pcampo"><small>Data a considerar</small><select id="pdCampo">${opts.campos.filter(x=>t.m==='prev'?true:!x[2]).map(([v,r])=>`<option value="${v}" ${t.campo===v?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
      <div class="pres">${res()}</div><div class="pbot"><button type="button" class="btn" id="pdLimpa">limpar</button><button type="button" class="btn pri" id="pdOk">aplicar</button></div></div>`;
    p.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{t.m=b.dataset.md;alvo='de';if(t.m==='prev'&&!(estado&&estado.m==='prev')){t.de=t.ate=perHoje();}
      view=perD(t.m==='int'||t.m==='prev'?t.de:t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{view.setMonth(view.getMonth()+(+b.dataset.nv));des();});
    p.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{const s=b.dataset.dd;if(t.m==='dia'){t.dia=s;}else if(alvo==='de'){t.de=s;if(t.ate<s)t.ate=s;alvo='ate';}else{if(s<t.de){t.ate=t.de;t.de=s;}else t.ate=s;alvo='de';}des();});
    p.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{t.dia=perAdd(t.dia,+b.dataset.dia);view=perD(t.dia);view.setDate(1);des();});
    p.querySelectorAll('[data-ano]').forEach(b=>b.onclick=()=>{const [a,mm]=t.mes.split('-');t.mes=(+a+(+b.dataset.ano))+'-'+mm;des();});
    p.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{t.mes=t.mes.slice(0,4)+'-'+String(b.dataset.ms).padStart(2,'0');des();});
    p.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{const x=p._at[+b.dataset.at];t.de=x[1];t.ate=x[2];alvo='de';view=perD(t.de);view.setDate(1);des();});
    p.querySelectorAll('[data-alvo]').forEach(b=>b.onclick=()=>{if(alvo!==b.dataset.alvo){alvo=b.dataset.alvo;des();const i=p.querySelector(alvo==='de'?'#pdDe':'#pdAte');if(i)i.focus();}});
    const inp=(id,f)=>{const i=p.querySelector(id);if(i)i.onchange=()=>{const v=perLe(i.value);if(v){f(v);view=perD(v);view.setDate(1);}des();};};
    inp('#pdDia',v=>t.dia=v);inp('#pdDe',v=>t.de=v);inp('#pdAte',v=>t.ate=v);
    const cs=p.querySelector('#pdCampo');if(cs)cs.onchange=()=>{t.campo=cs.value;};
    p.querySelector('#pdLimpa').onclick=()=>{p.remove();aplicar(Object.assign(perNovo('sem'),{campo:t.campo}));};
    p.querySelector('#pdOk').onclick=()=>{p.remove();if(t.m!=='prev'&&opts.campos&&opts.campos.some(x=>x[0]===t.campo&&x[2]))t.campo=opts.campos[0][0];aplicar(t);};
    posiciona();
  };
  const posiciona=()=>{const r=botao.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
    let l=r.left;if(l+w>innerWidth-8)l=Math.max(8,innerWidth-w-8);let tp=r.bottom+6;if(tp+h>innerHeight-8)tp=Math.max(8,innerHeight-h-8);
    p.style.left=l+'px';p.style.top=tp+'px';};
  p.onclick=ev=>ev.stopPropagation();
  p.onkeydown=ev=>{if(ev.key==='Escape')p.remove();if(ev.key==='Enter'&&ev.target.tagName!=='SELECT'){ev.preventDefault();p.querySelector('#pdOk').click();}};
  des();
}
document.addEventListener('click',ev=>{const p=document.getElementById('perPop');if(p&&!p.contains(ev.target)&&ev.target!==p._dono&&!(p._dono&&p._dono.contains(ev.target)))p.remove();});

const N=(()=>{try{if(window.parent!==window&&window.parent.csNucleo)return window.parent.csNucleo;}catch(e){}return window.csNucleo||null;})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const rs=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=br=>{const m=String(br||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:'';};
const ST={d:null,f:'',q:'',per:perNovo('sem'),aberto:new Set(),vend:''};
const aberto=t=>!/^Pago|Comprovante/.test(t.sit);
function sitCli(c){const ab=c.tit.filter(aberto);if(ab.some(t=>t.sit==='Protestado'))return 'pro';if(ab.some(t=>t.sit==='Em cartório'))return 'car';if(ab.length)return 'atr';return c.av.length?'av':'ok';}
const ROT={pro:'protestado',car:'em cartório',atr:'em atraso',av:'a vencer',ok:'em dia'};
const pill=s=>{if(/^Pago/.test(s))return `<span class="p ok">${esc(s)}</span>`;const m={'Atrasado':'atr','Em cartório':'car','Protestado':'pro','Comprovante recebido':'ok'};return `<span class="p ${m[s]||'cz'}">${esc(s==='Comprovante recebido'?'comprovante enviado':s)}</span>`;};
const waLink=w=>{const d=String(w||'').replace(/\D/g,'');if(d.length<10)return '';return 'https://wa.me/'+(d.length<=11?'55':'')+d;};
async function carregar(){
 if(!N){$('app').innerHTML='<div class="vazio"><b>Abra esta página pelo ERP.</b></div>';return;}
 try{if(N.pode&&!N.pode('vendas.cob','ver')){$('app').innerHTML='<div class="vazio">Você não tem acesso a esta página.</div>';return;}}catch(e){}
 try{ST.d=await N.tiny({acao:'rep_carteira',vendedor:ST.vend});}catch(e){ST.d={erro:String(e.message||e)};}
 desenha();
}
function desenha(){
 const D=ST.d||{};
 if(D.erro){$('app').innerHTML=`<div class="vazio"><b>Não consegui carregar.</b><br>${esc(D.erro)}${/a[çc][ãa]o|desconhec/i.test(D.erro)?'<br><br>Falta atualizar a função "tiny" no Supabase (v4.6.0).':''}</div>`;return;}
 if(D.semVendedor){$('app').innerHTML=`<div class="vazio"><b>Seu login ainda não está ligado a um vendedor.</b><br>Peça para ligar em Configurações › Pessoas e permissões › ${esc(D.nome||'seu cadastro')} › Vendedor.</div>`;return;}
 const dd=D.dados||{clientes:[],resumo:{}};const R=dd.resumo||{};
 const f=perFaixa(ST.per),q=ST.q.trim().toLowerCase();
 let cl=(dd.clientes||[]).map(c=>{const tit=f.de?c.tit.filter(t=>{const d=iso(t.venc);return d>=f.de&&d<=f.ate;}):c.tit;const av=f.de?c.av.filter(t=>{const d=iso(t.venc);return d>=f.de&&d<=f.ate;}):c.av;return {...c,tit,av};}).filter(c=>c.tit.length||c.av.length);
 cl.forEach(c=>{c.s=sitCli(c);c.face=c.tit.filter(aberto).reduce((s,t)=>s+t.face,0);c.hoje=c.tit.filter(aberto).reduce((s,t)=>s+t.hoje,0);c.avv=c.av.reduce((s,t)=>s+t.valor,0);c.max=Math.max(0,...c.tit.filter(aberto).map(t=>t.dias));});
 const cont=k=>cl.filter(c=>k===''?true:k==='av'?c.av.length:k==='atr'?c.tit.some(aberto):c.s===k).length;
 if(ST.f)cl=cl.filter(c=>ST.f==='av'?c.av.length:ST.f==='atr'?c.tit.some(aberto):c.s===ST.f);
 if(q)cl=cl.filter(c=>(c.nome+' '+c.doc).toLowerCase().includes(q)||String(c.doc).replace(/\D/g,'').includes(q.replace(/\D/g,'')||'§'));
 const ord={pro:0,car:1,atr:2,av:3,ok:4};cl.sort((a,b)=>ord[a.s]-ord[b.s]||b.max-a.max||b.face-a.face);
 const em=D.em?new Date(D.em).toLocaleString('pt-BR').slice(0,17):'';
 $('app').innerHTML=`<div class="topo"><div><h1>Inadimplência dos meus clientes</h1><div class="sub">${esc(D.vendedor||'')}${em?' · atualizado em '+esc(em):''} · em atraso, cartório, protestados e o que vence nos próximos 30 dias</div></div><span class="esp"></span>
  ${D.tudo&&(D.lista||[]).length?`<select id="vSel" title="Ver a carteira de outro vendedor">${D.lista.map(v=>`<option ${v===D.vendedor?'selected':''}>${esc(v)}</option>`).join('')}</select>`:''}</div>
  ${dd.posicoes&&Object.keys(dd.posicoes).length?`<div class="pos">${Object.entries(dd.posicoes).map(([e,d])=>`<span>${esc(e)} · relatório de ${esc(String(d).slice(0,5))}</span>`).join('')}</div>`:''}
  <div class="kp">
   <div class="k"><small>Clientes em atraso</small><b>${R.clientes||0}</b><span>${R.titulos||0} título(s)</span></div>
   <div class="k"><small>Valor em atraso</small><b style="color:#B91C1C">${rs(R.face)}</b><span>valor dos boletos</span></div>
   <div class="k"><small>A cobrar hoje</small><b style="color:var(--az)">${rs(R.hoje)}</b><span>com multa 2% + juros 1% a.m.</span></div>
   <div class="k"><small>Cartório e protesto</small><b>${(R.cartorio||0)+(R.protestado||0)}</b><span>${R.cartorio||0} em cartório · ${R.protestado||0} protestado(s)</span></div>
   <div class="k"><small>A vencer em 30 dias</small><b style="color:var(--ok)">${rs(R.avencer)}</b><span>para lembrar o cliente</span></div>
  </div>
  <div class="barra"><div class="chips">${[['','Todos'],['atr','Em atraso'],['car','Em cartório'],['pro','Protestados'],['av','A vencer']].map(([k,n])=>`<button data-f="${k}" class="${ST.f===k?'on':''}">${n}<i>${cont(k)}</i></button>`).join('')}</div>
   ${perBotao('vPer',ST.per).replace('</button>',' <small style="opacity:.7;font-weight:500">vencimento</small></button>')}
   <span class="esp"></span><input class="busca" id="vQ" placeholder="Buscar cliente pelo nome ou CNPJ" value="${esc(ST.q)}"></div>
  <div class="lista">${cl.length?cl.map(c=>{const k=c.doc||c.nome,ab=ST.aberto.has(k),w=waLink(c.wa);return `<div class="cli ${c.s}">
   <div class="cab" data-k="${esc(k)}"><div class="n"><b>${esc(c.nome)}</b><span>${esc(c.doc||'')}${c.wa?' · '+esc(c.wa):''}</span></div>
    <div class="v"><small>Em atraso</small><b style="color:${c.face?'#B91C1C':'inherit'}">${c.face?rs(c.face):'—'}</b></div>
    <div class="v"><small>Hoje</small><b style="color:var(--az)">${c.face?rs(c.hoje):'—'}</b></div>
    <div class="v"><small>${c.max?'Maior atraso':'A vencer'}</small><b>${c.max?c.max+(c.max===1?' dia':' dias'):rs(c.avv)}</b></div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:flex-end"><span class="p ${c.s==='av'||c.s==='ok'?'ok':c.s}">${ROT[c.s]}</span>${w?`<a class="wa" href="${w}" target="_blank" rel="noopener" data-wa="1">WhatsApp</a>`:''}</div></div>
   ${ab?`<div class="det">${c.tit.length?`<div class="sec">Vencidos</div><table><thead><tr><th class="l">Título</th><th class="l">Empresa</th><th>Vencimento</th><th>Atraso</th><th>Valor</th><th>Hoje</th><th class="l">Situação</th></tr></thead><tbody>${c.tit.slice().sort((a,b)=>iso(a.venc).localeCompare(iso(b.venc))).map(t=>`<tr><td class="l m">${esc(t.t)}</td><td class="l">${esc(t.emp)}</td><td class="m">${esc(t.venc)}</td><td class="m">${t.dias} dia${t.dias===1?'':'s'}</td><td class="m">${rs(t.face)}</td><td class="m" style="color:var(--az);font-weight:700">${aberto(t)?rs(t.hoje):'—'}</td><td class="l">${pill(t.sit)}</td></tr>`).join('')}</tbody></table>`:''}
    ${c.av.length?`<div class="sec">A vencer</div><table><thead><tr><th class="l">Título</th><th class="l">Empresa</th><th>Vencimento</th><th>Em</th><th>Valor</th></tr></thead><tbody>${c.av.slice().sort((a,b)=>iso(a.venc).localeCompare(iso(b.venc))).map(t=>`<tr><td class="l m">${esc(t.t)}</td><td class="l">${esc(t.emp)}</td><td class="m">${esc(t.venc)}</td><td class="m">${t.dias?t.dias+' dia'+(t.dias===1?'':'s'):'hoje'}</td><td class="m">${rs(t.valor)}</td></tr>`).join('')}</tbody></table>`:''}</div>`:''}
  </div>`;}).join(''):`<div class="vazio">${(dd.clientes||[]).length?'Nenhum cliente neste filtro.':'Nenhum cliente seu em atraso. 👏'}</div>`}</div>`;
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ST.f=b.dataset.f;desenha();});
 document.querySelectorAll('.cab').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-wa]'))return;const k=c.dataset.k;ST.aberto.has(k)?ST.aberto.delete(k):ST.aberto.add(k);desenha();});
 const qi=$('vQ');qi.oninput=()=>{ST.q=qi.value;clearTimeout(window._t);window._t=setTimeout(()=>{desenha();const i=$('vQ');i.focus();i.setSelectionRange(i.value.length,i.value.length);},250);};
 $('vPer').onclick=e=>{e.stopPropagation();abrirPeriodo($('vPer'),ST.per,{},p=>{ST.per=p;desenha();});};
 const vs=$('vSel');if(vs)vs.onchange=()=>{ST.vend=vs.value;ST.aberto.clear();carregar();};
}
carregar();
setInterval(()=>{if(!document.hidden)carregar();},5*60000);
</script>
<script>
/* ===== v4.8.0 · o caminho da página (Módulo › Página › Item) vira link em todo o sistema =====
   Pedido de 24/10: o caminho no topo das páginas tem que levar de volta. Cada pedaço, menos o último, vira um link:
   o nome do módulo leva à primeira página dele; o nome de uma página leva a ela (procurada no menu do ERP).
   Links que a própria página já tinha (ex.: "Clientes e crédito" dentro da ficha do cliente) ficam como estão. */
(function(){
  if(window.__mg480)return;window.__mg480=true;
  /* CS_MOD, MOD_ATUAL e FIN_PAG são let/const no ERP: não ficam em window, por isso a leitura passa por eval */
  const P=(()=>{try{if(window.parent!==window&&typeof window.parent.csIr==='function')return window.parent;}catch(e){}return typeof window.csIr==='function'?window:null;})();
  const V=n=>{try{return P.eval(n);}catch(e){return undefined;}};
  const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  try{const st=document.createElement('style');st.textContent='.mg-a{color:inherit;cursor:pointer;text-decoration:none;border-radius:4px}.mg-a:hover{color:#1D4ED8;text-decoration:underline}';document.head.appendChild(st);}catch(e){}
  function destino(txt){
    if(!P)return null;const t=nrm(txt);if(!t)return null;
    const mods=V('CS_MOD')||[];let atualMod=null;const MA=V('MOD_ATUAL'),FP=V('FIN_PAG');
    try{atualMod=mods.find(m=>(m.pgs||[]).some(p=>p.mod&&p.mod===MA&&p.fin===FP));}catch(e){}
    const ordem=atualMod?[atualMod,...mods.filter(m=>m!==atualMod)]:mods;
    const pode=p=>{try{return typeof P.csPode!=='function'||P.csPode(p);}catch(e){return true;}};
    for(const m of ordem){const pgs=(m.pgs||[]);
      const g=pgs.find(p=>p.grupo&&p.acord&&nrm(p.n)===t);if(g){const f=pgs.find(p=>p.pai===g.acord&&!p.grupo&&pode(p));if(f)return f;}
      const p=pgs.find(p=>!p.grupo&&nrm(p.n)===t&&pode(p));if(p)return p;}
    const m=mods.find(m=>nrm(m.nome)===t);
    if(m){const f=(m.pgs||[]).find(p=>!p.grupo&&!p.breve&&pode(p)&&(p.page||p.fin||p.acao));if(f)return f;}
    return null;
  }
  function liga(el){
    if(el.dataset.mgk===el.innerHTML.length+'')return;
    const partes=el.innerHTML.split('›');
    if(partes.length<2){el.dataset.mgk=el.innerHTML.length+'';return;}
    const nova=partes.map((h,i)=>{if(i===partes.length-1||/<a[\s>]/i.test(h)||/mg-a/.test(h))return h;
      const tx=h.replace(/<[^>]+>/g,'').trim();if(!destino(tx))return h;
      return h.replace(tx,`<a class="mg-a" data-mglk="${tx.replace(/"/g,'&quot;')}">${tx}</a>`);}).join('›');
    if(nova!==el.innerHTML)el.innerHTML=nova;
    el.dataset.mgk=el.innerHTML.length+'';
  }
  const varre=()=>{try{document.querySelectorAll('.migalha,.c7-mig,.c9mig,.migal,.cfgmig').forEach(liga);}catch(e){}};
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-mglk]');if(!a)return;e.preventDefault();e.stopPropagation();
    const d=destino(a.dataset.mglk);if(d&&P){try{P.eval("CS_ABERTO=''");}catch(x){}try{P.csIr(d);}catch(x){}}},true);
  let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(varre,60);}).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(varre,300);
})();

</script>
