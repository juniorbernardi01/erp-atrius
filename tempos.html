  return {c:p.codigo,d:p.descricao,g:p.tanque,lote:tp.lote||null,l:+p.litragem||0,u:+p.un_cx||0,t,s,sm:!!tp.sm,rt:{...(tp.rt||{})},rs:{...(tp.rs||{})},rsm:!!tp.rsm};});

    $('ddl').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{SEL=b.dataset.g;grav('tp3.g',SEL);fecharDD();desenha();});};

const usaMaq=(p,m,T)=>{const k=T+'|'+m;return (p.uso&&k in p.uso)?!!p.uso[k]:p[T][m]!=null;};
const celMaq=(p,m,T,Sx,e)=>{const on=p[T][m]!=null;if(e){const u=usaMaq(p,m,T);const sw=tg(`m|${p.c}|${T}|${m}`,u).replace('class="tg"','class="tg sm"');

/* ---------- Tanques e envase (por produto mãe) ---------- */
function pgTanques(){const st=S(),e=!!ED,g=st.GR[SEL],fs=st.PR.filter(p=>p.g===SEL);
  const pronto=t=>{const x=g.tq[t.id];return (x.limp||0)+t.ench+(x.prep||0)+(g.temDesc?(x.desc||0):0);};

  const envT=(p,m)=>p.t[m]==null?null:p.t[m]+(p.s[m]??SETUP_PAD);const rap=fs.map(p=>Math.min(...MAQ.map(m=>envT(p,m)).filter(x=>x!=null))).filter(isFinite);
  const n=pendG(SEL,st);const t0=st.TQ[0];

  const bl=(nm,cor,x,sub,off)=>`<div class="bk ${off?'off':''}"><span><i style="background:${cor}"></i>${nm}</span><b>${off?'não tem':x?dur(Math.round(x.m)):'<em>falta</em>'}</b><small>${off?'este produto não descansa':x&&x.lo!==x.hi?`de ${dur(x.lo)} a ${dur(x.hi)}`:sub}</small></div>`;
  return `<div class="gh"><div style="min-width:0"><button type="button" class="gbt" id="gbt" ${e?'disabled':''} aria-haspopup="listbox"><span>${esc(SEL)}</span><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="meta">${fs.length} produto${fs.length===1?'':'s'} · ${n?`<b style="color:var(--warn)">falta ${n} tempo${n===1?'':'s'}</b>`:'<span style="color:var(--ok)">tudo com tempo</span>'}</div></div><span class="sp"></span>${acoes()}</div>
  <div class="bks">${bl('Limpeza','var(--c-limp)',mL,'média dos tanques')}${bl('Enchimento','var(--c-ench)',mE,'média dos tanques')}${bl('Preparo','var(--c-prep)',mP,'média dos tanques')}${bl('Descanso','var(--c-desc)',mD,'média dos tanques',!g.temDesc)}${bl('Envase','var(--c-env)',mV,'média das máquinas')}
    <div class="bk tot"><span>Total médio</span><b>${falta?'<em>falta tempo</em>':dur(Math.round(tot))}</b><small>da limpeza ao fim do envase</small></div></div>

/* ---------- Sopro ---------- */
function pgSopro(){const st=S(),e=!!ED;const uso=f=>st.PR.filter(p=>({0.5:'500ml detergente',1:'1L',2:'2L Redonda',3:'3L',5:'5L'})[p.l]===f&&p.c!=='401').length;

  const cel=(p,m)=>{const on=p.rt[m]!=null;if(e)return `<td class="c sep">${ni(`p|${p.c}|rs|${m}`,on?(p.rs[m]??''):'',on?String(SETUP_PAD):'',46,1)}</td><td class="c">${ni(`p|${p.c}|rt|${m}`,on?p.rt[m]:'','',70,1)}<span class="un">/h</span></td>`;
    if(!on)return '<td class="n sep nr" colspan="2">não passa</td>';const u=un(p);return `<td class="n sep vt" colspan="2">${nf(p.rt[m])} /h<small>setup ${p.rs[m]??SETUP_PAD} min${u?` · lote em ${dur(Math.round(u/p.rt[m]*60+(p.rs[m]??SETUP_PAD)))}`:''}</small></td>`;};

  ${gs.map(g=>{const q=UI.q.toLowerCase();const ps=st.PR.filter(p=>p.g===g&&(!q||(p.d+' '+p.c).toLowerCase().includes(q)));if(!ps.length)return '';const ab=!UI.ab.has(g)||q;
    return `<tr class="grp" data-gr="${esc(g)}"><td colspan="${3+ROT.length*2}">${ab?'▾':'▸'} ${esc(g)}<small>${ps.length} produto${ps.length===1?'':'s'}</small></td></tr>`+(ab?ps.map(p=>`<tr><td class="nm"><b>${esc(p.d)}</b><small>${esc(p.c)}</small></td><td class="n vt">${un(p)?nf(un(p)):'—'}</td>${ROT.map(m=>cel(p,m)).join('')}<td class="c sep">${e?tg(`p|${p.c}|rsm`,p.rsm):simNao(p.rsm)}</td></tr>`).join(''):'');}).join('')}</tbody></table></div>
  <div class="dica">Em branco = o produto não passa naquela rotuladora. O tempo do lote sai dos frascos do lote padrão ÷ frascos por hora + setup.</div>`;}
/* ---------- edição ---------- */
function grava(k,v){const st=ED,p=k.split('|');
  if(p[0]==='g')st.GR[SEL][p[1]]=v;
  else if(p[0]==='q')st.GR[SEL].tq[p[1]][p[2]]=v;
  else if(p[0]==='u')st.GR[SEL].usa[p[1]]=v;
  else if(p[0]==='t')st.TQ[+p[1]].ench=v;
  else if(p[0]==='f')st.FR[p[1]].s[p[2]]=v;
  else if(p[0]==='m'){const x=st.PR.find(y=>y.c===p[1]);const T=p[2],m=p[3],Sx={t:'s',rt:'rs'}[T];x.uso=x.uso||{};x.uso[T+'|'+m]=!!v;
    if(!v){delete x[T][m];if(Sx&&x[Sx])delete x[Sx][m];}}
  else if(p[0]==='p'){const x=st.PR.find(y=>y.c===p[1]);if(p.length===3)x[p[2]]=v;else{const o=x[p[2]];if(v==null)delete o[p[3]];else o[p[3]]=v;const T={s:'t',rs:'rt'}[p[2]];if(T&&v!=null&&x[T][p[3]]==null)x[T][p[3]]=null;}}}
function desenha(){nav();$('pn').innerHTML=({tanques:pgTanques,sopro:pgSopro,rotulo:pgRotulo}[SEC]||pgTanques)();liga();}
const hmFmt=v=>{const d=String(v||'').replace(/\D/g,'').slice(0,4);if(d.length<=2)return d;return d.slice(0,d.length-2)+':'+d.slice(-2);};
const ehHM=k=>/^p\|[^|]+\|(t|rt)\|/.test(String(k||''));
function liga(){const pn=$('pn');
  pn.querySelectorAll('.ni').forEach(e=>{if(!ehHM(e.dataset.k))return;e.setAttribute('placeholder',e.getAttribute('placeholder')||'h:mm');
    e.addEventListener('input',()=>{if(/[^0-9:]/.test(e.value)&&!/,/.test(e.value))return;const f=hmFmt(e.value);if(f!==e.value){e.value=f;try{e.setSelectionRange(f.length,f.length);}catch(x){}}});});
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
  on('bEd',()=>{ED=clone({GR,PR,TQ,FR});desenha();const f=pn.querySelector('.ni');if(f)f.focus();});
  on('bCan',()=>{ED=null;desenha();toast('Edição cancelada');});
  on('bSal',()=>{ED.PR.forEach(p=>['t','rt'].forEach(T=>Object.keys(p[T]).forEach(m=>{if(p[T][m]==null)delete p[T][m];})));try{N.tpSalvar(clone(ED));}catch(x){return toast('Não consegui gravar: '+x.message);}({GR,PR,TQ,FR}=ED);ED=null;desenha();toast('Tempos salvos');});
  on('bPdf',()=>{const tit=SEC==='tanques'?SEL:SEC==='sopro'?'Sopro':'Rotulagem';pfPdfTela(tit,'',$('pn'),SEC==='tanques'?'portrait':'landscape',{rot:'Tempos de processo',arq:'Tempos - '+tit});});
  const gb=$('gbt');if(gb)gb.onclick=()=>{$('dd')?fecharDD():abrirDD(gb);};
  const q=$('q');if(q)q.oninput=()=>{UI.q=q.value;const s=q.selectionStart;desenha();const n=$('q');n.focus();n.setSelectionRange(s,s);};
  pn.querySelectorAll('[data-gr]').forEach(e=>e.onclick=()=>{const g=e.dataset.gr;UI.ab.has(g)?UI.ab.delete(g):UI.ab.add(g);desenha();});
  pn.querySelectorAll('.ni').forEach(e=>e.onchange=()=>{grava(e.dataset.k,lerMin(e.value));setTimeout(()=>{const a=document.activeElement,k=a&&a.dataset&&(a.dataset.k||a.dataset.tg),at=a&&a.dataset&&a.dataset.k?'data-k':'data-tg';desenha();if(k){const n=$('pn').querySelector(`[${at}="${CSS.escape(k)}"]`);if(n){n.focus();if(n.select)n.select();}}},0);});
  pn.querySelectorAll('[data-tg]').forEach(e=>{const f=()=>{grava(e.dataset.tg,e.getAttribute('aria-checked')!=='true');const k=e.dataset.tg;desenha();const n=$('pn').querySelector(`[data-tg="${CSS.escape(k)}"]`);if(n)n.focus();};e.onclick=f;e.onkeydown=ev=>{if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();f();}};});}
desenha();

function pfLib(src,nome){return window[nome]?Promise.resolve():new Promise((ok,er)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>er(new Error('Não consegui carregar '+nome));document.head.appendChild(s);});}
function pfPdfTela(tit,sub,origem,ori,opt){ori=ori||'landscape';opt=opt||{};const LARG={landscape:1600,portrait:1060};
  const cl=origem.cloneNode(true);cl.querySelectorAll('button,.btn,select,#pfTip,.migalha').forEach(e=>e.remove());
  cl.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  let logo='';try{logo=(parent.document.querySelector('img[data-logo]')||{}).src||'';}catch(e){}
  const cab=`<div style="background:#1B4F9C;color:#fff;padding:14px 22px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:20px"><div style="display:flex;align-items:center;gap:18px">${logo?`<span style="background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex"><img src="${logo}" style="height:38px" alt="Atrius"></span>`:''}<div>${opt.rot?`<div style="font:700 10.5px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:.8">${esc(opt.rot)}</div>`:''}<div style="font:800 25px/1.15 Inter,sans-serif">${esc(tit)}</div></div></div><div style="text-align:right;font:700 17px/1.3 Inter,sans-serif">${sub}</div></div>
    <div style="text-align:right;font-size:10.5px;color:#64748B;margin:5px 2px 10px">emitido em ${br(perHoje())} às ${new Date().toTimeString().slice(0,5)}</div>`;
  const folha=`<div id="pfFolhaT" style="background:#fff;color:#111;width:${LARG[ori]}px;padding:22px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif">${cab}${cl.innerHTML}</div>`;
  const arq=(opt.arq||tit).replace(/[\\/:*?"<>|]+/g,'-');
  document.body.insertAdjacentHTML('beforeend',`<div class="pfmask on" id="pfMT"><div class="pfmod"><div class="fh"><b>${esc(tit)}</b><small>sai exatamente como está aqui</small><span style="flex:1"></span><button class="btn sm" data-x>Fechar ✕</button></div>
    <div class="fb" id="pfFbT">${folha}</div><div class="ff"><span class="pfori"><button class="btn sm ${ori==='portrait'?'on':''}" data-ori="portrait">Em pé</button><button class="btn sm ${ori==='landscape'?'on':''}" data-ori="landscape">Deitado</button></span><span style="flex:1"></span><button class="btn" id="pfPdfS">⤓ Salvar PDF</button><button class="btn pri" id="pfPrT">⎙ Imprimir</button></div></div></div>`);
  const m=$('pfMT');m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>m.remove());
  m.querySelectorAll('[data-ori]').forEach(b=>b.onclick=()=>{m.remove();pfPdfTela(tit,sub,origem,b.dataset.ori,opt);});
  setTimeout(()=>{const f=$('pfFolhaT');f.style.zoom=Math.min(1,($('pfFbT').clientWidth-36)/LARG[ori]);},30);
  /* fatia a imagem em páginas A4 (margem 7 mm), cortando sempre entre linhas */
  async function paginas(){await pfLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','html2canvas');
    const W=LARG[ori],mmW=(ori==='portrait'?210:297)-14,mmH=(ori==='portrait'?297:210)-14,pxMm=W/mmW,pgH=Math.floor(mmH*pxMm);
    const box=document.createElement('div');box.style.cssText='position:fixed;left:-20000px;top:0;z-index:-1';box.innerHTML=folha;document.body.appendChild(box);
    try{const f=box.firstElementChild;const t0=f.getBoundingClientRect().top;
      const cortes=[...f.querySelectorAll('tr,.pfkpis,.pfsec,.prbt,.caixa,.pfduas,#pfFolhaT>div,table')].map(e=>Math.round(e.getBoundingClientRect().bottom-t0)).concat([Math.round(f.getBoundingClientRect().height)]).sort((a,b)=>a-b);
      const cv=await html2canvas(f,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});const k=cv.width/W,total=cv.height/k;
      const pags=[];let ini=0;while(ini<total-2){let fim=ini+pgH;if(fim>=total)fim=total;else{const ok=cortes.filter(c=>c>ini+80&&c<=fim);if(ok.length)fim=ok[ok.length-1];}
        const c=document.createElement('canvas');c.width=cv.width;c.height=Math.ceil((fim-ini)*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(cv,0,Math.round(ini*k),cv.width,c.height,0,0,cv.width,c.height);
        pags.push({url:c.toDataURL('image/jpeg',.93),mmH:(fim-ini)/pxMm});ini=fim;}
      return {pags,mmW};}finally{box.remove();}}
  const ocupado=async(b,fz)=>{const t=b.textContent;b.disabled=true;b.textContent='gerando…';try{await fz();}catch(e){toast(e.message||String(e),true);}finally{b.disabled=false;b.textContent=t;}};
  $('pfPdfS').onclick=ev=>ocupado(ev.currentTarget,async()=>{const {pags,mmW}=await paginas();await pfLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','jspdf');
    const doc=new jspdf.jsPDF({orientation:ori,unit:'mm',format:'a4'});pags.forEach((p,i)=>{if(i)doc.addPage('a4',ori);doc.addImage(p.url,'JPEG',7,7,mmW,p.mmH);});doc.setProperties({title:arq});doc.save(arq+'.pdf');});
  $('pfPrT').onclick=ev=>ocupado(ev.currentTarget,async()=>{const {pags,mmW}=await paginas();const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
    const d=fr.contentWindow.document;d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(arq)}</title><style>@page{size:A4 ${ori};margin:7mm}html,body{margin:0;background:#fff}img{display:block;width:${mmW}mm}img+img{break-before:page}</style></head><body>${pags.map(p=>`<img src="${p.url}">`).join('')}</body></html>`);d.close();
    await new Promise(r=>setTimeout(r,400));const tt=document.title;document.title=arq;fr.contentWindow.focus();fr.contentWindow.print();document.title=tt;setTimeout(()=>fr.remove(),60000);});
}
function pfArqPer(de,ate){const fimMes=perYmd(new Date(+de.slice(0,4),+de.slice(5,7),0));return de.slice(8)==='01'&&ate===fimMes?de.slice(5,7)+'-'+de.slice(0,4):br(de).replace(/\//g,'-')+' a '+br(ate).replace(/\//g,'-');}
const pfPrimNome=n=>{const w=String(n).split(/[\s-]+/).filter(Boolean)[0]||n;return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();};

</script><script>
/* ===== v4.8.0 · o caminho da página (Módulo › Página › Item) vira link em todo o sistema =====
   Pedido de 24/10: o caminho no topo das páginas tem que levar de volta. Cada pedaço, menos o último, vira um link:
   o nome do módulo leva à primeira página dele; o nome de uma página leva a ela (procurada no menu do ERP).
   Links que a própria página já tinha (ex.: "Clientes e crédito" dentro da ficha do cliente) ficam como estão. */
(function(){
  if(window.__mg480)return;window.__mg480=true;
  /* CS_MOD, MOD_ATUAL e FIN_PAG são let/const no ERP: não ficam em window, por isso a leitura passa por eval */
  const P=(()=>{try{if(window.parent!==window&&typeof window.parent.csIr==='function')return window.parent;}catch(e){}return typeof window.csIr==='function'?window:null;})();
  const V=n=>{try{return P.eval(n);}catch(e){return undefined;}};
  const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  try{const st=document.createElement('style');st.textContent='.mg-a{color:inherit;cursor:pointer;text-decoration:none;border-radius:4px}.mg-a:hover{color:#1D4ED8;text-decoration:underline}';document.head.appendChild(st);}catch(e){}
  function destino(txt){
    if(!P)return null;const t=nrm(txt);if(!t)return null;
    const mods=V('CS_MOD')||[];let atualMod=null;const MA=V('MOD_ATUAL'),FP=V('FIN_PAG');
    try{atualMod=mods.find(m=>(m.pgs||[]).some(p=>p.mod&&p.mod===MA&&p.fin===FP));}catch(e){}
    const ordem=atualMod?[atualMod,...mods.filter(m=>m!==atualMod)]:mods;
    const pode=p=>{try{return typeof P.csPode!=='function'||P.csPode(p);}catch(e){return true;}};
    for(const m of ordem){const pgs=(m.pgs||[]);
      const g=pgs.find(p=>p.grupo&&p.acord&&nrm(p.n)===t);if(g){const f=pgs.find(p=>p.pai===g.acord&&!p.grupo&&pode(p));if(f)return f;}
      const p=pgs.find(p=>!p.grupo&&nrm(p.n)===t&&pode(p));if(p)return p;}
    const m=mods.find(m=>nrm(m.nome)===t);
    if(m){const f=(m.pgs||[]).find(p=>!p.grupo&&!p.breve&&pode(p)&&(p.page||p.fin||p.acao));if(f)return f;}
    return null;
  }
  function liga(el){
    if(el.dataset.mgk===el.innerHTML.length+'')return;
    const partes=el.innerHTML.split('›');
    if(partes.length<2){el.dataset.mgk=el.innerHTML.length+'';return;}
    const nova=partes.map((h,i)=>{if(i===partes.length-1||/<a[\s>]/i.test(h)||/mg-a/.test(h))return h;
      const tx=h.replace(/<[^>]+>/g,'').trim();if(!destino(tx))return h;
      return h.replace(tx,`<a class="mg-a" data-mglk="${tx.replace(/"/g,'&quot;')}">${tx}</a>`);}).join('›');
    if(nova!==el.innerHTML)el.innerHTML=nova;
    el.dataset.mgk=el.innerHTML.length+'';
  }
  const varre=()=>{try{document.querySelectorAll('.migalha,.c7-mig,.c9mig,.migal,.cfgmig').forEach(liga);}catch(e){}};
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-mglk]');if(!a)return;e.preventDefault();e.stopPropagation();
    const d=destino(a.dataset.mglk);if(d&&P){try{P.eval("CS_ABERTO=''");}catch(x){}try{P.csIr(d);}catch(x){}}},true);
  let t=null;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(varre,60);}).observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(varre,300);
})();
